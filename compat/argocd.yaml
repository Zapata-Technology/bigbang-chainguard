# Newer-minor check: Argo CD's dex 2.45 -> 2.46 and redis-exporter 1.88 -> 1.96.
# The exporter is switched on directly (redis-bb.upstream.metrics) instead of deploying the
# whole monitoring stack, which overloaded the CI runner.
images: {}
test:
  enable: [addons.argocd, prometheusOperatorCRDs]
  expect: [dex, prometheus-redis-exporter-iamguarded]
  values:
    addons: {argocd: {values: {redis-bb: {upstream: {metrics: {enabled: true}}}}}}
  check:
    # argocd-server's API answers (Big Bang runs it insecure: plain HTTP on port 80 behind
    # Istio), through the API server's service proxy.
    - >-
      s=$(kubectl -n argocd get svc -l app.kubernetes.io/name=argocd-server -o jsonpath='{.items[0].metadata.name}')
      && v=$(kubectl get --raw "/api/v1/namespaces/argocd/services/$s:80/proxy/api/version")
      && echo "$v" && echo "$v" | grep -q '"Version"'
    # The admin logs in with the generated initial password (a session token proves the
    # server, its secret key and Redis work). Through a port-forward with the runner's
    # Python: `kubectl create --raw` posts without a JSON content type, which Argo CD
    # refuses (UnsupportedMediaType). The password goes in on stdin; the token is only
    # checked, never printed.
    - |
      s=$(kubectl -n argocd get svc -l app.kubernetes.io/name=argocd-server -o jsonpath='{.items[0].metadata.name}')
      kubectl -n argocd port-forward "svc/$s" 18080:80 >/dev/null 2>&1 &
      pf=$!
      sleep 5
      kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d \
        | python3 -c 'import json, sys, urllib.request
      body = json.dumps({"username": "admin", "password": sys.stdin.read()}).encode()
      req = urllib.request.Request("http://127.0.0.1:18080/api/v1/session", body, {"Content-Type": "application/json"})
      token = json.load(urllib.request.urlopen(req, timeout=30)).get("token")
      print("admin session created" if token else "no session token")
      sys.exit(0 if token else 1)'
      rc=$?
      kill $pf
      exit $rc
    # The application controller reconciles an Application: one whose repository doesn't
    # exist (no network or credentials needed, nothing gets deployed). The controller
    # writes its status (sync Unknown and the repo-server's fetch error) within a minute.
    - |
      cat <<'EOF' | kubectl apply -f -
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: compat-probe, namespace: argocd}
      spec:
        project: default
        source: {repoURL: "https://compat.invalid/none.git", path: ".", targetRevision: HEAD}
        destination: {server: "https://kubernetes.default.svc", namespace: compat-probe}
      EOF
      i=0
      until st=$(kubectl -n argocd get application compat-probe -o jsonpath='{.status.sync.status}') && [ -n "$st" ]; do
        i=$((i+1))
        if [ $i -ge 18 ]; then echo "the controller wrote no status on Application compat-probe in 3 minutes"; kubectl -n argocd get application compat-probe -o yaml | tail -20; exit 1; fi
        sleep 10
      done
      echo "sync status: $st; conditions: $(kubectl -n argocd get application compat-probe -o jsonpath='{.status.conditions[*].type}')"
      kubectl -n argocd delete application compat-probe --wait=false
  debug:
    - "kubectl -n argocd get pods,svc"
