# Release to release with data: Keycloak and Big Bang's bundled PostgreSQL (on a
# PersistentVolume) installed from the newest release (<Big Bang>-cg.<n>, as
# compat/release-upgrade.yaml), a realm with a role and a user written through kcadm,
# then upgraded to this tree's Flux and overlays. Passes when, after the upgrade (and a
# restart of Keycloak and PostgreSQL if the upgrade didn't replace them), the same realm,
# the user with its role are there and the user logs in with the password set before:
# Keycloak's schema migration kept the data. Plus the release-upgrade checks (no pod left
# on a digest the release pinned and this tree replaced).
images: {}
test:
  enable: [keycloak]
  # The values of compat/keycloak.yaml: FIPS needs 14+ character passwords. Applied to
  # both installs (the release's and this tree's).
  values:
    packages:
      keycloak:
        values:
          upstream:
            secrets:
              env:
                stringData:
                  KEYCLOAK_ADMIN_PASSWORD: compat-keycloak-admin-not-a-secret
            database:
              password: compat-keycloak-db-not-a-secret
          postgresql:
            global:
              postgresql:
                auth:
                  password: compat-keycloak-db-not-a-secret
  expect: [keycloak, postgres]
  upgrade_from:
    release: previous
    check:
      - python3 compat/support/upgrade-data.py keycloak seed
  check:
    - python3 compat/support/upgrade-data.py keycloak verify
  setup:
    - sh compat/support/watch.sh keycloak "kubectl -n keycloak logs keycloak-keycloak-0 --previous --tail=60 || kubectl -n keycloak logs keycloak-keycloak-0 --tail=60"
  debug:
    - "cat $COMPAT_OUT/watch-keycloak.log"
    - "cat $COMPAT_OUT/upgrade-keycloak.json"
    - "kubectl -n keycloak get pods,pvc -o wide"
    - "kubectl -n keycloak get pods -o custom-columns=POD:.metadata.name,IMAGES:.spec.containers[*].image,STARTED:.status.startTime"
