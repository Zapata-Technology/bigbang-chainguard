# A real Mattermost database migration with data: Mattermost run by
# bigbang-mattermost-operator, as compat/mattermost.yaml (PostgreSQL from the org's images
# through compat/support/app-deps.py, files on SeaweedFS), installed on the org's previous
# major line (upgrade_from.images), then upgraded to this tree's Mattermost. Before the
# upgrade the first user (a system admin) makes a team and a post with an attached file.
# Passes when the server's version changed (verify --migrated), the user logs in, the team
# and post are there and the file's bytes come back from object storage.
images: {}
test:
  enable: [mattermostOperator, mattermost]
  namespaces: [mattermost-operator, mattermost, mattermost-deps]
  values:
    packages:
      mattermost:
        # As compat/mattermost.yaml: the chart's 2 CPUs / 4 GiB don't fit a kind node.
        flux: {timeout: 20m}
        values:
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: 2, memory: 2Gi}
  setup:
    - python3 compat/support/seaweedfs.py mattermost
    - python3 compat/support/app-deps.py mattermost
    - sh compat/support/watch.sh operator "kubectl -n mattermost-operator logs deploy/mattermost-operator --tail=30"
    - sh compat/support/watch.sh server "kubectl -n mattermost logs -l app=mattermost --all-containers --previous --tail=60 || kubectl -n mattermost logs -l app=mattermost --all-containers --tail=60"
  values_files:
    - $COMPAT_OUT/overlays/values-object-storage.yaml
    - $COMPAT_OUT/site-object-storage.yaml
    - $COMPAT_OUT/site-mattermost.yaml
  expect: [/mattermost, bigbang-mattermost-operator, postgres]
  forbid_log: "Problem with file storage settings|NoSuchBucket|AccessDenied|InvalidAccessKeyId|SignatureDoesNotMatch|seaweedfs.*(no such host|connection refused)"
  upgrade_from:
    # The major line before this tree's Mattermost (its newest release, as the org has it).
    images:
      ironbank/opensource/mattermost/mattermost: {cg: mattermost, version: "11.0"}
    check:
      - sh compat/support/mattermost-ping.sh
      - python3 compat/support/upgrade-data.py mattermost seed
  check:
    - sh compat/support/mattermost-ping.sh
    - python3 compat/support/upgrade-data.py mattermost verify --migrated
  debug:
    - "cat $COMPAT_OUT/upgrade-mattermost.json"
    - "kubectl get pods -n mattermost -o custom-columns=POD:.metadata.name,INIT:.spec.initContainers[*].image,IMAGES:.spec.containers[*].image,STATUS:.status.phase"
    - "kubectl -n mattermost get mattermost -o yaml | tail -40"
    - "cat $COMPAT_OUT/watch-operator.log"
    - "cat $COMPAT_OUT/watch-server.log"
