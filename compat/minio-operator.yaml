# The MinIO Operator and its sidecar built here from minio/operator's source
# (builds/minio-operator, builds/minio-operator-sidecar), FROM the org's images, in place of
# Iron Bank's archived copies. The harness builds both and loads them into kind. Big Bang's
# minio package makes a Tenant; the operator turns it into a StatefulSet whose pods run
# the sidecar image twice (the validate-arguments init container, then the sidecar
# container) beside the MinIO server. The test shrinks the Tenant to one server with four
# 1Gi volumes to fit kind (Helm replaces lists, so the pool is repeated whole).
#
# The MinIO server image itself may stay on Iron Bank: an org that doesn't carry minio
# (orgs/<org>.yaml) keeps registry1's, which CI can't pull without REGISTRY1_*. So the
# check proves the operator and sidecar did their part, not that MinIO serves: the package's
# wait job (which waits for a healthy Tenant) is off.
images:
  ironbank/opensource/minio/operator: {build: minio-operator}
  ironbank/opensource/minio/operator-sidecar: {build: minio-operator-sidecar}
test:
  enable: [addons.minioOperator, addons.minio]
  namespaces: [minio-operator, minio]
  expect: [bigbang-minio-operator, bigbang-minio-operator-sidecar]
  values:
    addons:
      minio:
        values:
          waitJob: {enabled: false}
          upstream:
            tenant:
              pools:
                - servers: 1
                  name: pool-0
                  volumesPerServer: 4
                  size: 1Gi
                  securityContext: {runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, fsGroupChangePolicy: OnRootMismatch, runAsNonRoot: true}
                  containerSecurityContext:
                    runAsUser: 1001
                    runAsGroup: 1001
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    capabilities: {drop: [ALL]}
                    seccompProfile: {type: RuntimeDefault}
  setup:
    - sh compat/support/watch.sh operator "kubectl -n minio-operator logs deploy/minio-operator --tail=30"
    - sh compat/support/watch.sh tenant "kubectl -n minio get tenant -o yaml | grep -A12 '^  status:'; kubectl -n minio get pods -o wide"
  forbid_log: "panic:"
  check:
    # The operator reconciled the Tenant (its pool is initialized and it made the
    # StatefulSet), and the Tenant pod ran the built sidecar image: validate-arguments
    # (it reads the Tenant through the API and writes MinIO's configuration) completed,
    # and the sidecar container is running. When the org has minio, the Tenant is also
    # reported healthy.
    - |
      i=0
      until st=$(kubectl -n minio get tenant -o jsonpath='{.items[0].status.pools[0].state}' 2>/dev/null) && [ "$st" = PoolInitialized ] \
          && t=$(kubectl -n minio get tenant -o jsonpath='{.items[0].metadata.name}') \
          && p=$(kubectl -n minio get pod -l "v1.min.io/tenant=$t" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null) && [ -n "$p" ] \
          && kubectl -n minio get pod "$p" -o jsonpath='{range .status.initContainerStatuses[*]}{.name} {.image} {.state.terminated.reason}{"\n"}{end}{range .status.containerStatuses[*]}{.name} {.image} running={.state.running.startedAt}{"\n"}{end}' > "$COMPAT_OUT/tenant-pod.txt" \
          && grep -q '^validate-arguments .*bigbang-minio-operator-sidecar.* Completed$' "$COMPAT_OUT/tenant-pod.txt" \
          && grep -q '^sidecar .*bigbang-minio-operator-sidecar.* running=..*$' "$COMPAT_OUT/tenant-pod.txt"; do
        i=$((i+1))
        if [ $i -ge 60 ]; then
          echo "after 10 minutes: pool '$st', pod '$p'"; cat "$COMPAT_OUT/tenant-pod.txt" 2>/dev/null
          kubectl -n minio get tenant -o jsonpath='{.items[0].status}'; echo
          kubectl -n minio-operator logs deploy/minio-operator --tail=20
          exit 1
        fi
        sleep 10
      done
      cat "$COMPAT_OUT/tenant-pod.txt"
      kubectl -n minio logs "$p" -c sidecar --tail=5
      echo "Tenant $t: pool $st; health '$(kubectl -n minio get tenant "$t" -o jsonpath='{.status.healthStatus}')'"
  debug:
    - "kubectl -n minio-operator get pods -o custom-columns=POD:.metadata.name,IMAGES:.spec.containers[*].image,STATUS:.status.phase"
    - "kubectl -n minio get pods -o custom-columns=POD:.metadata.name,INIT:.spec.initContainers[*].image,IMAGES:.spec.containers[*].image,STATUS:.status.phase"
    - "cat $COMPAT_OUT/watch-operator.log"
    - "cat $COMPAT_OUT/watch-tenant.log"
    - "kubectl -n minio logs -l v1.min.io/tenant --all-containers --tail=20"
