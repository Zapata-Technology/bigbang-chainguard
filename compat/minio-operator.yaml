# The MinIO Operator and its sidecar built here from minio/operator's source
# (builds/minio-operator, builds/minio-operator-sidecar), FROM the org's images, in place of
# Iron Bank's archived copies. The harness builds both and loads them into kind. Big Bang
# hands the operator the sidecar image; the operator puts it in every Tenant pod (the
# validate-arguments init container, then the sidecar container) beside the MinIO server.
#
# The test makes its own small Tenant (one server, four 1Gi volumes) in a namespace of its
# own rather than enabling Big Bang's minio package: the MinIO server image may stay on
# Iron Bank (an org without minio keeps registry1's, as Zapata's does in orgs/), which CI
# can't pull without REGISTRY1_*, and a package pod that never starts fails the test. So
# the check proves the operator's and the sidecar's part, not that MinIO serves.
images:
  ironbank/opensource/minio/operator: {build: minio-operator}
  ironbank/opensource/minio/operator-sidecar: {build: minio-operator-sidecar}
test:
  enable: [addons.minioOperator]
  namespaces: [minio-operator]
  expect: [bigbang-minio-operator]
  setup:
    - sh compat/support/watch.sh operator "kubectl -n minio-operator logs deploy/minio-operator --tail=30"
    - sh compat/support/watch.sh tenant "kubectl -n compat-minio get tenant -o yaml | grep -A12 '^  status:'; kubectl -n compat-minio get pods -o wide"
  forbid_log: "panic:"
  check:
    # The operator reconciles a Tenant (its pool is initialized and it made the StatefulSet),
    # and the Tenant pod ran the built sidecar image: validate-arguments (it reads the
    # Tenant through the API and writes MinIO's configuration) completed, and the sidecar
    # container is running. The server image is the mapping's minio, whatever it pulls.
    - |
      kubectl wait crd/tenants.minio.min.io --for=condition=Established --timeout=60s || exit 1
      img=$(python3 -c "import os, yaml; v = yaml.safe_load(open(os.environ['COMPAT_OUT'] + '/overlays/values-chainguard.yaml'))['addons']['minio']['values']['upstream']['tenant']['image']; print(v['repository'] + ':' + str(v['tag']))" 2>/dev/null) \
        || img=registry1.dso.mil/ironbank/opensource/minio/minio:RELEASE.2025-10-15T17-29-55Z
      kubectl create namespace compat-minio --dry-run=client -o yaml | kubectl apply -f -
      printf 'export MINIO_ROOT_USER=compat\nexport MINIO_ROOT_PASSWORD=compatMinioAB12cd34\n' > "$COMPAT_OUT/minio-config.env"
      kubectl -n compat-minio create secret generic compat-env --from-file=config.env="$COMPAT_OUT/minio-config.env" --dry-run=client -o yaml | kubectl apply -f -
      cat <<EOF | kubectl apply -f -
      apiVersion: minio.min.io/v2
      kind: Tenant
      metadata: {name: compat, namespace: compat-minio}
      spec:
        image: $img
        configuration: {name: compat-env}
        requestAutoCert: false
        pools:
          - name: pool-0
            servers: 1
            volumesPerServer: 4
            volumeClaimTemplate:
              spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
      EOF
      i=0
      until st=$(kubectl -n compat-minio get tenant compat -o jsonpath='{.status.pools[0].state}' 2>/dev/null) && [ "$st" = PoolInitialized ] \
          && p=$(kubectl -n compat-minio get pod -l v1.min.io/tenant=compat -o jsonpath='{.items[0].metadata.name}' 2>/dev/null) && [ -n "$p" ] \
          && kubectl -n compat-minio get pod "$p" -o jsonpath='{range .status.initContainerStatuses[*]}{.name} {.image} {.state.terminated.reason}{"\n"}{end}{range .status.containerStatuses[*]}{.name} {.image} running={.state.running.startedAt}{"\n"}{end}' > "$COMPAT_OUT/tenant-pod.txt" \
          && grep -q '^validate-arguments .*bigbang-minio-operator-sidecar.* Completed$' "$COMPAT_OUT/tenant-pod.txt" \
          && grep -q '^sidecar .*bigbang-minio-operator-sidecar.* running=..*$' "$COMPAT_OUT/tenant-pod.txt"; do
        i=$((i+1))
        if [ $i -ge 60 ]; then
          echo "after 10 minutes: pool '$st', pod '$p'"; cat "$COMPAT_OUT/tenant-pod.txt" 2>/dev/null
          kubectl -n compat-minio get tenant compat -o jsonpath='{.status}'; echo
          kubectl -n minio-operator logs deploy/minio-operator --tail=20
          exit 1
        fi
        sleep 10
      done
      cat "$COMPAT_OUT/tenant-pod.txt"
      kubectl -n compat-minio logs "$p" -c sidecar --tail=5
      if kubectl -n compat-minio logs "$p" -c sidecar | grep -q 'panic:'; then echo "the sidecar panicked"; exit 1; fi
      echo "Tenant compat: pool $st; server image $img"
  debug:
    - "kubectl -n minio-operator get pods -o custom-columns=POD:.metadata.name,IMAGES:.spec.containers[*].image,STATUS:.status.phase"
    - "kubectl -n compat-minio get pods -o custom-columns=POD:.metadata.name,INIT:.spec.initContainers[*].image,IMAGES:.spec.containers[*].image,STATUS:.status.phase"
    - "cat $COMPAT_OUT/watch-operator.log"
    - "cat $COMPAT_OUT/watch-tenant.log"
    - "kubectl -n compat-minio logs -l v1.min.io/tenant=compat -c validate-arguments --tail=20"
    - "kubectl -n compat-minio logs -l v1.min.io/tenant=compat -c sidecar --tail=20"
