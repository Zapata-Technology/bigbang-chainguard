# The MinIO Operator and its sidecar built here from minio/operator's source
# (builds/minio-operator, builds/minio-operator-sidecar), FROM the org's images, in place of
# Iron Bank's archived copies. The harness builds both and loads them into kind. Big Bang's
# minio package makes a Tenant; the operator runs it with the org's minio image and puts
# the sidecar image in every Tenant pod (the validate-arguments init container and the
# sidecar container). The test shrinks the Tenant to one server with four 1Gi volumes to
# fit kind (Helm replaces lists, so the pool is repeated whole).
images:
  ironbank/opensource/minio/operator: {build: minio-operator}
  ironbank/opensource/minio/operator-sidecar: {build: minio-operator-sidecar}
test:
  enable: [addons.minioOperator, addons.minio]
  namespaces: [minio-operator, minio]
  expect: [bigbang-minio-operator, bigbang-minio-operator-sidecar, minio]
  values:
    addons:
      minio:
        values:
          upstream:
            tenant:
              pools:
                - servers: 1
                  name: pool-0
                  volumesPerServer: 4
                  size: 1Gi
                  securityContext: {runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, fsGroupChangePolicy: OnRootMismatch, runAsNonRoot: true}
                  containerSecurityContext:
                    runAsUser: 1001
                    runAsGroup: 1001
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    capabilities: {drop: [ALL]}
                    seccompProfile: {type: RuntimeDefault}
  setup:
    - sh compat/support/watch.sh operator "kubectl -n minio-operator logs deploy/minio-operator --tail=30"
    - sh compat/support/watch.sh tenant "kubectl -n minio get tenant -o yaml | grep -A12 '^  status:'; kubectl -n minio get pods -o wide"
  check:
    # The operator brought the Tenant up and reports it healthy (it asks MinIO's admin API),
    # the Tenant pod's sidecar is ready (it serves /ready once it has the Tenant's
    # configuration) after validate-arguments ran, and MinIO answers its cluster health
    # check through the API server proxy.
    - |
      i=0
      until h=$(kubectl -n minio get tenant -o jsonpath='{.items[0].status.healthStatus}') && [ "$h" = green ]; do
        i=$((i+1))
        if [ $i -ge 60 ]; then
          echo "Tenant health is '$h' after 10 minutes:"; kubectl -n minio get tenant -o jsonpath='{.items[0].status}'; echo
          kubectl -n minio-operator logs deploy/minio-operator --tail=20
          exit 1
        fi
        sleep 10
      done
      t=$(kubectl -n minio get tenant -o jsonpath='{.items[0].metadata.name}')
      p=$(kubectl -n minio get pod -l "v1.min.io/tenant=$t" -o jsonpath='{.items[0].metadata.name}') || exit 1
      kubectl -n minio get pod "$p" -o jsonpath='{range .status.initContainerStatuses[*]}{.name} {.image} {.state.terminated.reason}{"\n"}{end}{range .status.containerStatuses[*]}{.name} {.image} ready={.ready}{"\n"}{end}' | tee "$COMPAT_OUT/tenant-pod.txt"
      grep -q '^validate-arguments .*bigbang-minio-operator-sidecar.* Completed$' "$COMPAT_OUT/tenant-pod.txt" || { echo "validate-arguments did not complete on the built sidecar"; exit 1; }
      grep -q '^sidecar .*bigbang-minio-operator-sidecar.* ready=true$' "$COMPAT_OUT/tenant-pod.txt" || { echo "the built sidecar is not ready"; exit 1; }
      kubectl get --raw "/api/v1/namespaces/minio/pods/$p:9000/proxy/minio/health/cluster" > /dev/null || exit 1
      echo "Tenant $t: health $h; MinIO cluster health OK"
  debug:
    - "kubectl -n minio-operator get pods -o custom-columns=POD:.metadata.name,IMAGES:.spec.containers[*].image,STATUS:.status.phase"
    - "kubectl -n minio get pods -o custom-columns=POD:.metadata.name,INIT:.spec.initContainers[*].image,IMAGES:.spec.containers[*].image,STATUS:.status.phase"
    - "cat $COMPAT_OUT/watch-operator.log"
    - "cat $COMPAT_OUT/watch-tenant.log"
    - "kubectl -n minio logs -l v1.min.io/tenant --all-containers --tail=20"
