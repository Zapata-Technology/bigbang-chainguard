# Thanos with Prometheus, storing blocks in SeaweedFS through the object-storage overlay.
images: {}
test:
  enable: [certManager, prometheusOperatorCRDs, monitoring, addons.thanos]   # as compat/monitoring.yaml
  setup:
    - python3 compat/support/seaweedfs.py thanos
  values_files:
    - $COMPAT_OUT/overlays/values-object-storage.yaml
    - $COMPAT_OUT/site-object-storage.yaml
  expect: [thanos]
  forbid_log: "NoSuchBucket|AccessDenied|InvalidAccessKeyId|SignatureDoesNotMatch|seaweedfs.*(no such host|connection refused)"
  check:
    # Thanos Query reaches both its stores, Prometheus's sidecar and the store gateway
    # (which reads the SeaweedFS bucket), and answers a PromQL query with Prometheus's data.
    - |
      p=$(kubectl -n thanos get pod -l app.kubernetes.io/name=thanos,app.kubernetes.io/component=query -o jsonpath='{.items[0].metadata.name}')
      q="/api/v1/namespaces/thanos/pods/$p:10902/proxy/api/v1"
      i=0
      until out=$(kubectl get --raw "$q/stores" 2>&1) && echo "$out" | grep -q '"sidecar":\[{' && echo "$out" | grep -q '"store":\[{'; do
        i=$((i+1)); [ $i -lt 18 ] || { echo "Thanos Query stores: $out"; exit 1; }
        sleep 10
      done
      echo "stores: $out" | cut -c1-1500
      i=0
      until out=$(kubectl get --raw "$q/query?query=up" 2>&1) && echo "$out" | grep -q '"__name__":"up"'; do
        i=$((i+1)); [ $i -lt 18 ] || { echo "Thanos Query up: $out"; exit 1; }
        sleep 10
      done
      echo "up: $out" | cut -c1-1500
  debug:
    - "kubectl -n thanos logs deploy/thanos-query --tail=15"
    - "echo s3.bucket.list | kubectl -n seaweedfs exec -i deploy/seaweedfs -- weed shell -master=localhost:9333"
