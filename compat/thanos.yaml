# Thanos with Prometheus, storing blocks in SeaweedFS through the object-storage overlay.
images: {}
test:
  enable: [monitoring, addons.thanos]
  setup:
    # Big Bang creates monitoring-objstore-secret in `monitoring` as part of its own
    # release, before Flux creates that namespace for the monitoring HelmRelease: a fresh
    # install fails with "namespaces monitoring not found". bb-install.py does the same.
    - kubectl create namespace monitoring
    - python3 compat/support/seaweedfs.py thanos
  values_files:
    - $COMPAT_OUT/overlays/values-object-storage.yaml
    - $COMPAT_OUT/site-object-storage.yaml
  expect: [thanos]
  forbid_log: "NoSuchBucket|AccessDenied|InvalidAccessKeyId|SignatureDoesNotMatch|seaweedfs.*(no such host|connection refused)"
  debug:
    - "echo s3.bucket.list | kubectl -n seaweedfs exec -i deploy/seaweedfs -- weed shell -master=localhost:9333"
