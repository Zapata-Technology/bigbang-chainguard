# Newer-minor check: Harbor's redis-exporter 1.91 -> 1.96. The package's own
# monitoring switch turns its exporters on without the whole monitoring stack.
images: {}
test:
  enable: [addons.harbor, prometheusOperatorCRDs]
  expect: [prometheus-redis-exporter]
  values:
    addons: {harbor: {values: {monitoring: {enabled: true}}}}
