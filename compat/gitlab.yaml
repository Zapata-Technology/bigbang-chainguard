# GitLab (webservice, sidekiq, gitaly, shell, registry, kas, toolbox) with PostgreSQL and
# Redis from the org's images (compat/support/app-deps.py gitlab), objects on SeaweedFS.
# Large: weekly and on demand only (compat.yml), it needs more memory than a pull
# request's runner reliably has.
images: {}
test:
  large: true
  timeout: 3300
  enable: [addons.gitlab]
  namespaces: [gitlab, gitlab-deps]
  values:
    addons:
      gitlab:
        # The runner's kind cluster has 2 CPUs and 7 GB in all, and the chart requests
        # more than that (the toolbox alone: 2 CPUs, 3.5 Gi), so pods stayed Pending:
        # one replica of each and small requests (the chart's limits stay). The package
        # chart reads GitLab's values under `upstream:`. Flux gets time for the database
        # migrations.
        flux:
          timeout: 40m
        values:
          upstream:
            registry:
              hpa: {minReplicas: 1, maxReplicas: 1}
              resources: {requests: {cpu: 50m, memory: 128Mi}}
            gitlab:
              toolbox:
                resources: {requests: {cpu: 50m, memory: 256Mi}}
              webservice:
                minReplicas: 1
                maxReplicas: 1
                resources: {requests: {cpu: 100m, memory: 1Gi}}
                workhorse: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
              sidekiq:
                minReplicas: 1
                maxReplicas: 1
                resources: {requests: {cpu: 100m, memory: 512Mi}}
              migrations:
                resources: {requests: {cpu: 100m, memory: 512Mi}}
              gitaly:
                resources: {requests: {cpu: 50m, memory: 256Mi}}
              gitlab-shell:
                minReplicas: 1
                maxReplicas: 1
                resources: {requests: {cpu: 50m, memory: 64Mi}}
              kas:
                minReplicas: 1
                maxReplicas: 1
                resources: {requests: {cpu: 50m, memory: 128Mi}}
              gitlab-exporter:
                resources: {requests: {cpu: 50m, memory: 64Mi}}
  setup:
    - python3 compat/support/seaweedfs.py gitlab
    # GitLab's chart needs an external PostgreSQL and Redis since v10.
    - python3 compat/support/app-deps.py gitlab
    # Crash-looping pods restart before the report reads them: keep their last output.
    - sh compat/support/watch.sh gitaly "kubectl -n gitlab logs -l app=gitaly --all-containers --previous --tail=60 || kubectl -n gitlab logs -l app=gitaly --all-containers --tail=60"
    - sh compat/support/watch.sh shell "kubectl -n gitlab logs -l app=gitlab-shell --all-containers --previous --tail=60 || kubectl -n gitlab logs -l app=gitlab-shell --all-containers --tail=60"
    - sh compat/support/watch.sh registry "kubectl -n gitlab logs -l app=registry --all-containers --previous --tail=60 || kubectl -n gitlab logs -l app=registry --all-containers --tail=60"
    - sh compat/support/watch.sh migrations "kubectl -n gitlab logs -l app=migrations --all-containers --previous --tail=80 || kubectl -n gitlab logs -l app=migrations --all-containers --tail=80"
    - sh compat/support/watch.sh webservice-deps "kubectl -n gitlab logs -l app=webservice -c dependencies --previous --tail=40 || kubectl -n gitlab logs -l app=webservice -c dependencies --tail=40"
  values_files:
    - $COMPAT_OUT/overlays/values-object-storage.yaml
    - $COMPAT_OUT/site-object-storage.yaml
    - $COMPAT_OUT/site-gitlab.yaml
  expect: [gitlab-webservice, gitlab-sidekiq, gitaly, gitlab-shell, gitlab-container-registry, postgres, redis]
  forbid_log: "NoSuchBucket|AccessDenied|InvalidAccessKeyId|SignatureDoesNotMatch"
  debug:
    - "cat $COMPAT_OUT/watch-gitaly.log"
    - "cat $COMPAT_OUT/watch-shell.log"
    - "cat $COMPAT_OUT/watch-registry.log"
    - "cat $COMPAT_OUT/watch-migrations.log"
    - "cat $COMPAT_OUT/watch-webservice-deps.log"
    - "kubectl -n gitlab get pods -o wide"
