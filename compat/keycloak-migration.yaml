# A real Keycloak schema migration with data: Keycloak and Big Bang's bundled PostgreSQL
# (on a PersistentVolume) installed on the org's previous Keycloak line (upgrade_from.images),
# a realm with a role and a user written through kcadm, then upgraded to this tree's
# Keycloak. Passes when Keycloak's version changed (verify --migrated) and the realm, the user
# with its role are there and the user logs in with the password set before: Keycloak's
# Liquibase migration kept the data. Release to release upgrades, which may run the same
# Keycloak on both sides: release-upgrade-keycloak.yaml.
images: {}
test:
  enable: [keycloak]
  # The values of compat/keycloak.yaml: FIPS needs 14+ character passwords. Applied to
  # both installs (the release's and this tree's).
  values:
    packages:
      keycloak:
        values:
          upstream:
            secrets:
              env:
                stringData:
                  KEYCLOAK_ADMIN_PASSWORD: compat-keycloak-admin-not-a-secret
            database:
              password: compat-keycloak-db-not-a-secret
          postgresql:
            global:
              postgresql:
                auth:
                  password: compat-keycloak-db-not-a-secret
  expect: [keycloak, postgres]
  upgrade_from:
    # The line before this tree's Keycloak. The org may sync only its current line; a pin
    # it lacks resolves to a newer line and verify --migrated fails, saying so.
    images:
      ironbank/opensource/keycloak/keycloak: {cg: keycloak, version: "26.7"}
    check:
      - python3 compat/support/upgrade-data.py keycloak seed
  check:
    - python3 compat/support/upgrade-data.py keycloak verify --migrated
  setup:
    - sh compat/support/watch.sh keycloak "kubectl -n keycloak logs keycloak-keycloak-0 --previous --tail=60 || kubectl -n keycloak logs keycloak-keycloak-0 --tail=60"
  debug:
    - "cat $COMPAT_OUT/watch-keycloak.log"
    - "cat $COMPAT_OUT/upgrade-keycloak.json"
    - "kubectl -n keycloak get pods,pvc -o wide"
    - "kubectl -n keycloak get pods -o custom-columns=POD:.metadata.name,IMAGES:.spec.containers[*].image,STARTED:.status.startTime"
