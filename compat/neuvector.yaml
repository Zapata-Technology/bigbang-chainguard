# Newer-minor check: NeuVector's prometheus-exporter 1.0 -> 1.1. The package's own
# monitoring switch turns the exporter on without the whole monitoring stack.
images: {}
test:
  enable: [neuvector, prometheusOperatorCRDs]
  expect: [neuvector-prometheus-exporter]
  values:
    neuvector: {values: {monitoring: {enabled: true}}}
