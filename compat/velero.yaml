# Velero with the AWS plugin and its node agent, backup storage location on SeaweedFS
# (object-storage overlay). The check is a real file-system backup and restore: data written
# to a PVC is backed up with defaultVolumesToFsBackup (what bb-install.py upgrade asks for),
# the namespace deleted, restored, and the data read back (compat/support/fs-backup.py).
images: {}
test:
  enable: [velero]
  setup:
    - python3 compat/support/seaweedfs.py velero
    - python3 compat/support/fs-backup.py setup
  values_files:
    - $COMPAT_OUT/overlays/values-object-storage.yaml
    - $COMPAT_OUT/site-object-storage.yaml
  expect: [velero, velero-plugin-for-aws]
  forbid_log: "NoSuchBucket|AccessDenied|InvalidAccessKeyId|SignatureDoesNotMatch|seaweedfs.*(no such host|connection refused)"
  check:
    # The location is Available, the node agent runs, the Backup completes with a pod volume
    # backup of the PVC, and after the namespace is deleted the Restore brings back the PVC's
    # data and the ConfigMap. A backup holding objects only (no node agent) fails here.
    - python3 compat/support/fs-backup.py check
  debug:
    - "kubectl -n velero get backupstoragelocations -o wide"
    - "kubectl -n velero get pods -o wide"
    - "kubectl -n velero get backups,restores,podvolumebackups,podvolumerestores -o wide"
    - "kubectl -n velero get backups -o yaml | tail -40"
    - "kubectl -n compat-backup get pods,pvc -o wide"
    - "kubectl -n compat-backup describe pod data-writer | tail -30"
    - "kubectl -n velero logs deploy/velero --tail=60"
    - "kubectl -n velero logs daemonset/node-agent --tail=60"
