# Upgrade test: Vault 1.21 (Iron Bank, what Big Bang 3.35.1 pins) -> Chainguard vault 2.x.
# Chainguard only carries Vault 2.x, so vault stays on Iron Bank unless this passes.
# Run: scripts/bb-compat.py compat/vault-2.yaml (in CI: the compat workflow)
images:
  ironbank/hashicorp/vault: {cg: vault, version: "*"}
test:
  enable: [addons.vault]
  namespaces: [vault]
