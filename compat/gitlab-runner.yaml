# GitLab Runner registered with the GitLab Big Bang deploys alongside it. Large (see gitlab.yaml).
images: {}
test:
  large: true
  timeout: 3300
  enable: [addons.gitlab, addons.gitlabRunner]
  namespaces: [gitlab, gitlab-runner, gitlab-deps]
  values:
    addons:
      gitlab:
        # A pull request's kind cluster has 2 CPUs: one replica of each, and time for
        # the database migrations (the first run timed out at Flux's 10 minutes with
        # migrations, Sidekiq and webservice still starting).
        flux:
          timeout: 40m
        values:
          gitlab:
            webservice: {minReplicas: 1, maxReplicas: 1}
            sidekiq: {minReplicas: 1, maxReplicas: 1}
            gitlab-shell: {minReplicas: 1, maxReplicas: 1}
            kas: {minReplicas: 1, maxReplicas: 1}
          registry: {hpa: {minReplicas: 1, maxReplicas: 1}}
  setup:
    - python3 compat/support/seaweedfs.py gitlab
    # GitLab's chart needs an external PostgreSQL and Redis since v10.
    - python3 compat/support/app-deps.py gitlab
    # Crash-looping pods restart before the report reads them: keep their last output.
    - sh compat/support/watch.sh gitaly "kubectl -n gitlab logs -l app=gitaly --all-containers --previous --tail=60 || kubectl -n gitlab logs -l app=gitaly --all-containers --tail=60"
    - sh compat/support/watch.sh shell "kubectl -n gitlab logs -l app=gitlab-shell --all-containers --previous --tail=60 || kubectl -n gitlab logs -l app=gitlab-shell --all-containers --tail=60"
    - sh compat/support/watch.sh registry "kubectl -n gitlab logs -l app=registry --all-containers --previous --tail=60 || kubectl -n gitlab logs -l app=registry --all-containers --tail=60"
  values_files:
    - $COMPAT_OUT/overlays/values-object-storage.yaml
    - $COMPAT_OUT/site-object-storage.yaml
    - $COMPAT_OUT/site-gitlab.yaml
  expect: [gitlab-runner, gitlab-webservice]
  debug:
    - "cat $COMPAT_OUT/watch-gitaly.log"
    - "cat $COMPAT_OUT/watch-shell.log"
    - "cat $COMPAT_OUT/watch-registry.log"
    - "kubectl -n gitlab-runner logs deploy/gitlab-runner --tail=40"
