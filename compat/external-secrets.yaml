# External Secrets Operator: controller, webhook and cert controller.
images: {}
test:
  enable: [addons.externalSecrets]
  expect: [external-secrets]
  check:
    # ESO syncs a secret: a SecretStore on ESO's built-in fake provider (no outside system)
    # and an ExternalSecret that copies one of its keys into a Kubernetes Secret. The
    # webhook validates both on create; the controller writes the Secret.
    - |
      set -e
      kubectl create namespace compat-eso
      kubectl apply -f - <<'EOF'
      apiVersion: external-secrets.io/v1
      kind: SecretStore
      metadata: {name: compat-fake, namespace: compat-eso}
      spec:
        provider:
          fake:
            data:
              - {key: /compat/answer, value: compat-synced-value}
      ---
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: compat-sync, namespace: compat-eso}
      spec:
        refreshInterval: 1h
        secretStoreRef: {name: compat-fake, kind: SecretStore}
        target: {name: compat-synced}
        data:
          - secretKey: answer
            remoteRef: {key: /compat/answer}
      EOF
      kubectl -n compat-eso wait secretstore/compat-fake --for=condition=Ready --timeout=180s
      kubectl -n compat-eso wait externalsecret/compat-sync --for=condition=Ready --timeout=180s
      got=$(kubectl -n compat-eso get secret compat-synced -o jsonpath='{.data.answer}' | base64 -d)
      [ "$got" = compat-synced-value ] || { echo "Secret compat-synced holds '$got'"; exit 1; }
      echo "ExternalSecret synced the fake provider's value into Secret compat-synced"
  debug:
    - kubectl -n compat-eso get secretstore,externalsecret -o yaml | tail -40
