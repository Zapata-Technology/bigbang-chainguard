# Upgrade test: SonarQube 26.9 community (Iron Bank) -> Chainguard sonarqube 26.10
# community (no FIPS image), with its JMX exporter from Chainguard's
# jmx-exporter-iamguarded (Bitnami file layout, same 1.6 version).
images:
  ironbank/sonarsource/sonarqube/sonarqube-community-build: {cg: sonarqube, suffix: community, fips: null}
  ironbank/opensource/prometheus/jmx-exporter: {cg: jmx-exporter-iamguarded, fips: jmx-exporter-iamguarded-fips}
test:
  enable: [addons.sonarqube]
  namespaces: [sonarqube]
  values:
    # SonarQube starts slowly on a shared CI runner; allow 15 minutes instead of 4.
    addons: {sonarqube: {values: {upstream: {startupProbe: {failureThreshold: 90}}}}}
