# Kyverno enforcement: Big Bang's restrict-image-registries policy in Enforce mode (its
# default) with packages deployed. Any image from a registry the overlay's allow list
# misses is refused admission, and its pod never starts.
images: {}
test:
  enable: [kyverno, kyvernoPolicies, headlamp, grafana]
  expect: [kyverno, headlamp, grafana]
  setup:
    # Big Bang 4's policies are Kyverno CEL ValidatingPolicies, not ClusterPolicies.
    - sh compat/support/watch.sh policies "kubectl get validatingpolicies.policies.kyverno.io -o custom-columns=NAME:.metadata.name,READY:.status.conditionStatus.ready,MESSAGE:.status.conditionStatus.message | grep -v true"
  check:
    # An org-image Pod admitted, the same Pod from docker.io refused (server dry-run).
    - sh compat/support/kyverno-admission.sh headlamp
  debug:
    - "kubectl get validatingpolicies.policies.kyverno.io -o custom-columns='NAME:.metadata.name,READY:.status.conditionStatus.ready,MESSAGE:.status.conditionStatus.message'"
    - "cat $COMPAT_OUT/watch-policies.log"
    - "kubectl get validatingpolicies.policies.kyverno.io restrict-image-registries -o jsonpath='{.spec.validationActions} {.spec.variables[0].expression}'"
    - "kubectl get events -A --field-selector reason=PolicyViolation | tail -10"
