# Kyverno enforcement: Big Bang's restrict-image-registries policy in Enforce mode (its
# default) with packages deployed. Any image from a registry the overlay's allow list
# misses is refused admission, and its pod never starts.
images: {}
test:
  enable: [kyverno, kyvernoPolicies, addons.headlamp, grafana]
  expect: [kyverno, headlamp, grafana]
  setup:
    - sh compat/support/watch.sh policies "kubectl get clusterpolicy -o custom-columns=NAME:.metadata.name,READY:.status.conditions[0].status,MESSAGE:.status.conditions[0].message | grep -v True"
  values:
    # Big Bang's require-non-root-group/-user policies render preconditions.all: null
    # (rejected by Kyverno's schema) unless some container is excluded; Istio, which
    # usually supplies that list, is off here. Exclude a container name nothing uses.
    kyvernoPolicies: {values: {excludeContainers: [compat-none]}}
  check:
    # Admission, with nothing created (server dry-run): a Pod that meets Big Bang's Enforce
    # policies is admitted on an org image (the running admission controller's) and refused,
    # by restrict-image-registries, with the same spec on a registry the overlay doesn't allow.
    - |
      set -e
      img=$(kubectl -n kyverno get pod -l app.kubernetes.io/component=admission-controller -o jsonpath='{.items[0].spec.containers[0].image}')
      spec() { printf '{"spec":{"automountServiceAccountToken":false,"securityContext":{"runAsNonRoot":true,"runAsUser":65532,"runAsGroup":65532,"fsGroup":65532,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"probe","image":"%s","securityContext":{"allowPrivilegeEscalation":false,"privileged":false,"readOnlyRootFilesystem":true,"runAsNonRoot":true,"capabilities":{"drop":["ALL"]}},"resources":{"limits":{"cpu":"50m","memory":"32Mi"},"requests":{"cpu":"50m","memory":"32Mi"}}}]}}' "$1"; }
      kubectl -n headlamp run kyverno-check-org --image="$img" --restart=Never --dry-run=server --overrides="$(spec "$img")" -o name
      echo "admitted $img"
      bad=docker.io/library/busybox:1.36
      if kubectl -n headlamp run kyverno-check-bad --image=$bad --restart=Never --dry-run=server --overrides="$(spec $bad)" -o name 2>"$COMPAT_OUT/kyverno-refused.txt"; then
        echo "admitted $bad"; exit 1
      fi
      cat "$COMPAT_OUT/kyverno-refused.txt"
      grep -q restrict-image-registries "$COMPAT_OUT/kyverno-refused.txt"
  debug:
    - "kubectl get clusterpolicy -o custom-columns='NAME:.metadata.name,READY:.status.conditions[0].status,REASON:.status.conditions[0].reason,MESSAGE:.status.conditions[0].message'"
    - "cat $COMPAT_OUT/watch-policies.log"
    - "kubectl get clusterpolicy restrict-image-registries -o jsonpath='{.spec.validationFailureAction} {.spec.rules[0].validate.message}'"
    - "kubectl get events -A --field-selector reason=PolicyViolation | tail -10"
