# Object storage, OBJECT_STORAGE=seaweedfs (the default): deploys the generated
# seaweedfs/ (or seaweedfs-fips/) kustomization as a site would, then Big Bang with
# overlays/values-object-storage.yaml, and runs Tempo on it. Passes only if Tempo runs,
# no MinIO is deployed, and nothing logs S3 errors.
images: {}
test:
  enable: [tempo]
  setup:
    - python3 compat/support/seaweedfs.py tempo
    - sh compat/support/watch.sh tempo "kubectl -n tempo logs tempo-tempo-0 --previous --tail=40 || kubectl -n tempo logs tempo-tempo-0 --tail=40"
    - sh compat/support/watch.sh tempo-config "kubectl -n tempo get configmap tempo -o yaml | grep -B2 -A30 'receivers:'"
  values_files:
    - $COMPAT_OUT/overlays/values-object-storage.yaml
    - $COMPAT_OUT/site-object-storage.yaml
  expect: [tempo]
  forbid_log: "NoSuchBucket|AccessDenied|InvalidAccessKeyId|SignatureDoesNotMatch|seaweedfs.*(no such host|connection refused)"
  check:
    # Tempo takes a trace and finds it: send one span with a unique trace ID to the OTLP
    # HTTP receiver (JSON, with curl through a port-forward: `kubectl create --raw` sends
    # no JSON content type), then read the trace back through Tempo's API.
    # Then /flush cuts the ingester's block, which Tempo writes to its SeaweedFS bucket
    # (<prefix>-tempo/single-tenant/<block id>/).
    - |
      pod=/api/v1/namespaces/tempo/pods/tempo-tempo-0
      kubectl -n tempo port-forward pod/tempo-tempo-0 14318:4318 > "$COMPAT_OUT/pf-tempo.log" 2>&1 &
      pf=$!; trap 'kill $pf' EXIT
      t=$(date +%s%N); id=$(printf '%032x' "$t"); span=$(printf '%016x' "$t")
      printf '{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"compat-check"}}]},"scopeSpans":[{"spans":[{"traceId":"%s","spanId":"%s","name":"compat-check","kind":1,"startTimeUnixNano":"%s","endTimeUnixNano":"%s"}]}]}]}' "$id" "$span" "$t" "$((t+1000000))" > "$COMPAT_OUT/tempo-trace.json"
      i=0
      until curl -sS --fail-with-body -H 'Content-Type: application/json' --data-binary @"$COMPAT_OUT/tempo-trace.json" http://127.0.0.1:14318/v1/traces; do
        i=$((i+1)); [ $i -lt 15 ] || { echo "Tempo refused the trace:"; cat "$COMPAT_OUT/pf-tempo.log"; exit 1; }
        sleep 2
      done
      echo
      i=0
      until out=$(kubectl get --raw "$pod:3200/proxy/api/traces/$id" 2>&1) && echo "$out" | grep -q compat-check; do
        i=$((i+1)); [ $i -lt 18 ] || { echo "sent trace $id, Tempo says: $out"; exit 1; }
        sleep 10
      done
      echo "trace $id: $out" | cut -c1-600
      kubectl get --raw "$pod:3200/proxy/flush" || exit 1
      wsh() { echo "$1" | kubectl -n seaweedfs exec -i deploy/seaweedfs -- weed shell -master=localhost:9333 -filer=localhost:8888 2>&1; }
      b=$(wsh 'fs.ls /buckets' | grep -o '[A-Za-z0-9.-]*-tempo' | head -1)
      [ -n "$b" ] || { echo "no tempo bucket: $(wsh 'fs.ls /buckets')"; exit 1; }
      i=0
      until out=$(wsh "fs.ls /buckets/$b/single-tenant") && echo "$out" | grep -q '[0-9a-f]\{8\}-[0-9a-f]\{4\}-'; do
        i=$((i+1)); [ $i -lt 18 ] || { echo "no Tempo block in $b: $out"; exit 1; }
        sleep 10
      done
      echo "blocks in $b: $out"
  debug:
    - "echo s3.bucket.list | kubectl -n seaweedfs exec -i deploy/seaweedfs -- weed shell -master=localhost:9333"
    - "kubectl get pods -A -o custom-columns=NS:.metadata.namespace,POD:.metadata.name,IMAGES:.spec.containers[*].image | grep -i minio || echo 'no MinIO pods'"
    - "kubectl -n tempo describe statefulset | tail -40"
    - "cat $COMPAT_OUT/watch-tempo.log"
    - "cat $COMPAT_OUT/watch-tempo-config.log"
    - "kubectl -n tempo get events --sort-by=.lastTimestamp | tail -20"
