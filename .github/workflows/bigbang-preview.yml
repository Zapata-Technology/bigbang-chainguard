# Daily: run this repo against Big Bang's next releases (scripts/bb-preview.py), so their
# breaking changes show up as a list of work before they ship:
#   master            Big Bang's development branch: weeks ahead
#   release-X.Y.Z     the release branch Big Bang cuts before tagging X.Y.Z, while one is
#                     newer than the newest tag: what the next release will be, days ahead
# Keeps one issue per ref (label bigbang-preview, the ref in its title) current: opened or
# updated while something would break, closed when nothing does, and a release branch's
# closed once its release is tagged (update.yml's bot/bigbang-release takes over). It
# changes no file and opens no pull request.
name: Big Bang preview - next release against this repo

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Big Bang branch or tag
        default: master

permissions:
  contents: read

concurrency:
  group: bigbang-preview
  cancel-in-progress: true

jobs:
  # The refs to preview: the dispatched one, else master and an untagged release branch.
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write   # close a tagged release branch's issue
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
      release: ${{ steps.refs.outputs.release }}   # the release branch to deploy on kind, if any
    steps:
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            repo1.dso.mil:443

      - name: Big Bang refs to preview
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          remote=""
          for i in 1 2 3 4; do   # repo1.dso.mil intermittently refuses GitHub runners
            remote=$(git ls-remote --heads --tags https://repo1.dso.mil/big-bang/bigbang.git) && break
            sleep $((30 * i))
          done
          latest=$(grep -oE 'refs/tags/[0-9]+\.[0-9]+\.[0-9]+$' <<<"$remote" | sed 's#refs/tags/##' | sort -V | tail -1 || true)
          branch=$(grep -oE 'refs/heads/release-[0-9]+\.[0-9]+\.[0-9]+$' <<<"$remote" | sed 's#refs/heads/release-##' | sort -V | tail -1 || true)
          refs='"master"'
          if [ -n "$branch" ] && [ -n "$latest" ] && [ "$branch" != "$latest" ] \
             && [ "$(printf '%s\n%s\n' "$latest" "$branch" | sort -V | tail -1)" = "$branch" ]; then
            refs+=",\"release-$branch\""
            [ -n "$REF" ] || echo "release=release-$branch" | tee -a "$GITHUB_OUTPUT"
          fi
          echo "newest tag $latest, newest release branch ${branch:-none}"
          if [ -n "$REF" ]; then
            # Dispatched: that ref alone (a release branch gets the kind tests too).
            if grep -qE '^release-[0-9]+\.[0-9]+\.[0-9]+$' <<<"$REF"; then
              echo "release=$REF" | tee -a "$GITHUB_OUTPUT"
            fi
            refs="\"$REF\""
          fi
          echo "refs=[$refs]" | tee -a "$GITHUB_OUTPUT"
          # A release branch whose release is out: its issue is done (on every run, the
          # dispatched ones too; not the ref this run previews).
          [ -n "$remote" ] || exit 0
          gh api "repos/$GH_REPO/issues?labels=bigbang-preview&state=open&per_page=100" \
            --jq '.[] | "\(.number) \(.title)"' > open.txt
          while read -r num title; do
            ref=$(grep -oE '\(release-[0-9.]+\)$' <<<"$title" | tr -d '()' || true)
            [ -n "$ref" ] && [ "$ref" != "$REF" ] || continue
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "${ref#release-}" "$latest" | sort -V | tail -1)" = "$latest" ]; then
              gh api -X POST "repos/$GH_REPO/issues/$num/comments" \
                -f body="Big Bang $latest is tagged: the nightly release pull request (bot/bigbang-release) takes over from this preview." >/dev/null
              gh api -X PATCH "repos/$GH_REPO/issues/$num" -f state=closed >/dev/null
            fi
          done < open.txt

  preview:
    needs: refs
    name: preview (${{ matrix.ref }})
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.refs.outputs.refs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      BUILD_REGISTRY: ${{ vars.BUILD_REGISTRY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.cgr.dev:443
            *.r2.cloudflarestorage.com:443
            api.github.com:443
            cgr.dev:443
            console-api.enforce.dev:443
            dl.enforce.dev:443
            files.pythonhosted.org:443
            get.helm.sh:443
            ghcr.io:443
            github.com:443
            issuer.enforce.dev:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo1.dso.mil:443
            results-receiver.actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v3.18.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Log into Chainguard
        uses: chainguard-dev/setup-chainctl@bfe7503a12660737d9d66d02d2610a399d804316  # v0.6.0
        with:
          # Pinned: `latest` changes under every run. Same version in every workflow
          # (tests/test_repo_rules.py); raise it on purpose (AGENTS.md, "chainctl").
          version: 0.2.403
          identity: ${{ secrets.CGR_ACTIONS_ID }}

      - name: Run against Big Bang's next release
        id: preview
        env:
          REF: ${{ matrix.ref }}
        run: |
          python3 -m pip install --quiet -r requirements.txt
          set +e
          python3 scripts/bb-preview.py --ref "$REF" \
            --dir "$RUNNER_TEMP/preview" -o "$RUNNER_TEMP/report.md"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the preview issue current
        if: always() && steps.preview.outputs.rc != ''
        env:
          REF: ${{ matrix.ref }}
          RC: ${{ steps.preview.outputs.rc }}
          RELEASE: ${{ needs.refs.outputs.release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create bigbang-preview --color FBCA04 \
            --description "Big Bang's next release against this repo (bigbang-preview.yml)" 2>/dev/null || true
          title="Big Bang's next release: what would break ($REF)"
          # master's issue from before titles carried the ref has the plain title.
          issue=$(gh issue list --label bigbang-preview --state open --json number,title \
            | jq -r --arg t "$title" --arg r "$REF" \
            'map(select(.title == $t or ($r == "master" and .title == "Big Bang'"'"'s next release: what would break"))) | .[0].number // empty')
          { cat "$RUNNER_TEMP/report.md" 2>/dev/null || echo "The preview produced no report: see the run."
            echo; echo "Run: $RUN_URL"; } > "$RUNNER_TEMP/body.md"
          if [ "$RC" = 0 ] && [ "$REF" = "$RELEASE" ]; then
            # The kind tests on this ref decide whether its issue closes (kind-report).
            [ -n "$issue" ] && gh issue edit "$issue" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            exit 0
          fi
          if [ "$RC" = 0 ]; then
            [ -n "$issue" ] && gh issue close "$issue" --comment "Nothing would break any more ($RUN_URL)."
            exit 0
          fi
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --label bigbang-preview --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

  # A release branch (not master: it moves daily and is weeks out) is what the next release
  # will ship: deploy a handful of kind tests on it (compat.yml with bigbang_ref; the plan
  # picks compat-plan.py PREVIEW), runtime breakage the render above can't see. Standard
  # runners only. The results stay out of docs/testing.md's table (marked `preview`).
  kind:
    needs: refs
    if: needs.refs.outputs.release != ''
    permissions:
      actions: read     # compat.yml's results job: this run's result artifacts
      contents: read
      id-token: write   # Log into Chainguard
      packages: read    # BUILD_REGISTRY images
    uses: ./.github/workflows/compat.yml
    with:
      bigbang_ref: ${{ needs.refs.outputs.release }}
    secrets: inherit

  # The kind results in the release branch's issue (a section the next run replaces). The
  # preview job leaves that issue open when it found nothing; this closes it only if the
  # kind tests passed too, and opens one if they failed.
  kind-report:
    needs: [refs, preview, kind]
    if: ${{ !cancelled() && needs.refs.outputs.release != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read     # gh run download: the kind jobs' result artifacts
      contents: read
      issues: write
    steps:
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pipelines.actions.githubusercontent.com:443
            pypi.org:443
            results-receiver.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Kind results into the preview issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ needs.refs.outputs.release }}
          KIND: ${{ needs.kind.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -r requirements.txt
          gh run download "$GITHUB_RUN_ID" --pattern 'compat-result-*' -D "$RUNNER_TEMP/kind" \
            || echo "no kind results to download"
          title="Big Bang's next release: what would break ($REF)"
          issue=$(gh issue list --label bigbang-preview --state open --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')
          body="$RUNNER_TEMP/body.md"
          if [ -n "$issue" ]; then gh issue view "$issue" --json body --jq .body > "$body"; else : > "$body"; fi
          action=$(python3 scripts/bb-preview.py --ref "$REF" --kind-results "$RUNNER_TEMP/kind" \
            --kind-outcome "$KIND" --kind-run "$RUN_URL" --body "$body" ${issue:+--have-issue} 2>"$RUNNER_TEMP/section.md")
          cat "$RUNNER_TEMP/section.md" >> "$GITHUB_STEP_SUMMARY"
          echo "kind tests $KIND; issue ${issue:-none}: $action"
          case "$action" in
            create) gh issue create --label bigbang-preview --title "$title" --body-file "$body" ;;
            edit) gh issue edit "$issue" --body-file "$body" ;;
            close) gh issue edit "$issue" --body-file "$body"
                   gh issue close "$issue" --comment "Nothing would break any more, and the kind tests passed ($RUN_URL)." ;;
          esac
