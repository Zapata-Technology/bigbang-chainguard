# Big Bang's default packages on RKE2 with the CIS profile, installed the way a site installs
# (scripts/bb-install.py check, then install). Most Big Bang sites run RKE2 hardened to CIS:
# Pod Security Admission enforcing `restricted`, etcd as its own user, the kubelet refusing
# unsafe kernel settings, real persistent volumes. kind (compat.yml) and k3s (fips-kernel.yml)
# have none of that, so a package that needs a privilege PSA refuses, or a volume, passes
# there and fails at a site. Each run boots an AlmaLinux 9 VM under KVM, installs a pinned
# RKE2 in it (.github/rke2-vm.sh), installs Big Bang, and fails on
# any pod not Ready, any restart, an image that can't be pulled, or an admission refusal.
# A pull request (its own files, or a new BIGBANG_VERSION: the release PR) installs the
# standard overlay only. The weekly run and a manual run also install once with --fips (a
# second job). Each job records its result as `rke2-default` for docs/testing.md's table
# (scripts/test-results.py; never part of results-gate). kind's --kubelet-insecure-tls
# stays in the metrics-server kind test.
name: RKE2 - Big Bang on RKE2 with the CIS profile

on:
  pull_request:
    paths:
      # A new Big Bang (the release PR, bot/bigbang-release): what most sites run, before it
      # merges. Not overlays/**: a path filter can't tell a tag change from the nightly
      # digest refresh, which would run this billed VM on every bot PR.
      - BIGBANG_VERSION
      - .github/workflows/rke2.yml
      - .github/rke2-vm.sh
      - .github/vm-lib.sh
      - scripts/cluster-check.py
      - scripts/bbinstall/nodes.py
  schedule:
    - cron: "0 11 * * 0"   # weekly, after compat.yml's and fips-kernel.yml's Sunday runs
  workflow_dispatch:
    inputs:
      neuvector_report:
        description: "Also build the security report: NeuVector's scans of every deployed and pinned image, checked against grype, Trivy, Chainguard's advisories, KEV and EPSS (scripts/security-report.py)"
        type: boolean
        default: false
      report_from_run:
        description: "Only rebuild the security report, from this earlier run's NeuVector scans (a run ID): no VM"
        type: string
        default: ""
      publish_report:
        description: "Publish the report as the weekly run does: attach it to the latest release, and open bot/security-report when its counts changed"
        type: boolean
        default: false

permissions:
  contents: read

# The larger runner is billed: a new push to a pull request cancels its older run. Scheduled
# and manual runs each get their own group (run_id), so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rke2:
    # Big Bang's default packages need more than a standard private-repository runner (2 CPUs,
    # 7 GB): set the repository variable RKE2_RUNNER to a larger runner's label (16 GB or more).
    runs-on: ${{ vars.RKE2_RUNNER || 'ubuntu-latest' }}
    # Not on Dependabot's pull requests: an action bump doesn't need this billed larger-runner VM test, and
    # CI, builds and the kind tests already run the bumped actions. Scheduled, manual and
    # every other pull request's runs are unchanged.
    if: (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && !inputs.report_from_run
    # 150 minutes for the install; the security report's by-reference scans add up to 60.
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        # JSON booleans. A pull request is standard only; schedule and workflow_dispatch
        # run standard and FIPS. Two jobs, so a FIPS failure still uploads the standard logs.
        fips: ${{ fromJSON(github.event_name == 'pull_request' && '[false]' || '[false, true]') }}
    name: default packages (RKE2, CIS, ${{ matrix.fips && 'FIPS' || 'standard' }})
    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      BUILD_REGISTRY: ${{ vars.BUILD_REGISTRY }}
      GITHUB_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      # Block every outbound call not listed: the runner's own downloads (packages, the VM
      # image, Helm, chainctl), and the VM's, which leave through the runner (RKE2's release,
      # local-path's busybox helper from Docker Hub, the org's images, Big Bang's charts on repo1,
      # and Sigstore, which Kyverno asks to verify each image's signature for the installer's
      # signature policy: blocked, every Deployment timed out in Kyverno's webhook).
      # A blocked host shows up as a failed download or pull: add it here if it is expected.
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.cgr.dev:443
            *.r2.cloudflarestorage.com:443
            api.github.com:443
            archive.ubuntu.com:80
            auth.docker.io:443
            azure.archive.ubuntu.com:80
            cgr.dev:443
            codeload.github.com:443
            console-api.enforce.dev:443
            dl.enforce.dev:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            get.helm.sh:443
            ghcr.io:443
            github.com:443
            issuer.enforce.dev:443
            objects.githubusercontent.com:443
            packages.microsoft.com:443
            pipelines.actions.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry1.dso.mil:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            repo.almalinux.org:443
            repo1.dso.mil:443
            results-receiver.actions.githubusercontent.com:443
            security.ubuntu.com:80
            storage.googleapis.com:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      # Without RKE2_RUNNER the job lands on ubuntu-latest, which can't hold Big Bang's default
      # packages (the results below): two hours of a run that can't pass. Say so at once. A
      # manual run may still try a standard runner on purpose.
      - name: A runner large enough (RKE2_RUNNER)
        env:
          RKE2_RUNNER: ${{ vars.RKE2_RUNNER }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$RKE2_RUNNER" ] && [ "$EVENT" != workflow_dispatch ]; then
            echo "::error::the repository variable RKE2_RUNNER is empty: set it to a runner label with 16 GB or more (docs/testing.md, RKE2)"
            exit 1
          fi
          echo "runner: ${RKE2_RUNNER:-ubuntu-latest}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # no git push here: keep the token out of .git/config

      # The VM's disk grows on the runner's as Big Bang's images arrive. The VM gets twice the
      # runner's CPUs (at least 8) and all but 2 GB of its memory. Big Bang's default packages
      # request more than 6 GB (istiod stayed Pending with "Insufficient memory"), so a runner
      # under 14 GB gets a 12 GB VM backed by swap instead: they schedule, but the control
      # plane then starves (lost leases, Kyverno's webhook timing out), so use RKE2_RUNNER.
      - name: Free disk space and memory; size the VM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo systemctl stop docker.socket docker containerd || true
          mem=$(free -m | awk '/^Mem:/ {print $2}')
          cpus=$(( $(nproc) * 2 > 8 ? $(nproc) * 2 : 8 ))
          if [ "$mem" -ge 14000 ]; then
            vm_mem=$((mem - 2048))
          else
            echo "::warning::$mem MB on this runner: Big Bang's default packages need a larger one (RKE2_RUNNER); swapping"
            vm_mem=12288
            sudo fallocate -l 12G /rke2-swap && sudo chmod 600 /rke2-swap && sudo mkswap -q /rke2-swap && sudo swapon /rke2-swap
          fi
          echo "VM_MEMORY=$vm_mem" >> "$GITHUB_ENV"
          echo "VM_CPUS=$cpus" >> "$GITHUB_ENV"
          echo "runner: $(nproc) CPUs, $mem MB; VM: $cpus vCPUs, $vm_mem MB"
          df -h /
          swapon --show

      # Without KVM a VM would be emulated (TCG), far too slow for Big Bang: stop here.
      - name: Check for KVM
        run: |
          echo "CPUs: $(nproc); memory: $(free -m | awk '/^Mem:/ {print $2}') MB"
          if [ ! -e /dev/kvm ]; then
            echo "::error::no /dev/kvm on this runner: nested virtualization isn't available"
            exit 1
          fi
          # GitHub's documented way to let the runner user open /dev/kvm.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v3.18.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Python packages
        run: python -m pip install --quiet -r requirements.txt

      # Before the VM: its storage provisioner is the org's image (.github/rke2-vm.sh).
      - name: Log into Chainguard
        uses: chainguard-dev/setup-chainctl@bfe7503a12660737d9d66d02d2610a399d804316  # v0.6.0
        with:
          # Pinned: `latest` changes under every run. Same version in every workflow
          # (tests/test_repo_rules.py); raise it on purpose (AGENTS.md, "chainctl").
          version: 0.2.403
          identity: ${{ secrets.CGR_ACTIONS_ID }}

      - name: Boot a VM with RKE2 (CIS profile)
        id: vm
        timeout-minutes: 30
        run: |
          CGR_PULL_TOKEN=$(chainctl auth token --audience cgr.dev)
          echo "::add-mask::$CGR_PULL_TOKEN"
          export CGR_PULL_TOKEN
          bash .github/rke2-vm.sh boot
          echo "KUBECONFIG=$RUNNER_TEMP/rke2-vm/kubeconfig" >> "$GITHUB_ENV"

      # The API server keeps events for an hour; an admission refusal early in the install
      # must still count at the end.
      - name: Keep every event
        run: bash .github/rke2-vm.sh events

      # What a site runs: a site file with Big Bang's defaults, `check` (nothing changes),
      # then `install`. --small-cluster only lowers Flux's requests on the one-node VM.
      - name: bb-install.py check, then install (${{ matrix.fips && 'FIPS' || 'standard' }} images)
        id: install
        env:
          BUILD_REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY1_USERNAME: ${{ secrets.REGISTRY1_USERNAME }}
          REGISTRY1_PASSWORD: ${{ secrets.REGISTRY1_PASSWORD }}
        run: |
          set -o pipefail
          SITE=$RUNNER_TEMP/site.yaml
          CGR_PASSWORD=$(chainctl auth token --audience cgr.dev)
          echo "::add-mask::$CGR_PASSWORD"
          export CGR_USERNAME=_token CGR_PASSWORD
          python scripts/bb-install.py init --site "$SITE" --domain bigbang.test --yes
          # The VM's storage is local-path-provisioner, which creates each volume with a helper
          # pod that mounts a host path. Big Bang's Kyverno policies refused it (restrict-volume-types,
          # restrict-image-registries), so Loki's volume was never made. A site excludes its
          # storage provisioner's namespace the same way.
          python - "$SITE" <<'PY'
          import sys, yaml
          site = yaml.safe_load(open(sys.argv[1])) or {}
          policies = site.setdefault("packages", {}).setdefault("kyvernoPolicies", {}) \
              .setdefault("values", {}).setdefault("policies", {})
          policies["excludeNamespaces"] = sorted(set(policies.get("excludeNamespaces", [])) | {"local-path-storage"})
          yaml.safe_dump(site, open(sys.argv[1], "w"), sort_keys=False)
          PY
          cat "$SITE"
          # Pull requests stay standard. Schedule and workflow_dispatch pass --fips on the FIPS job.
          extra=""
          if [ "${{ matrix.fips }}" = "true" ]; then extra=--fips; fi
          python scripts/bb-install.py check --site "$SITE" --yes $extra 2>&1 | tee "$RUNNER_TEMP/check.log"
          # check's node probe (bbinstall/nodes.py) must run under PSA restricted and read the
          # VM's raised inotify limits, not fall back to a note.
          grep -q "node(s) read" "$RUNNER_TEMP/check.log" || { echo "check didn't read the nodes' inotify limits"; exit 1; }
          python scripts/bb-install.py install --site "$SITE" --yes --small-cluster --timeout 3600 $extra 2>&1 \
            | tee "$RUNNER_TEMP/install.log"

      # Run even when the install failed: it names every unhealthy pod and refused admission.
      - name: Every pod Ready, no restarts, no pull errors, no admission refusals
        id: health
        if: always() && steps.vm.outcome == 'success'
        run: |
          set -o pipefail
          python scripts/cluster-check.py --events "$RUNNER_TEMP/rke2-vm/logs/events.log" 2>&1             | tee "$RUNNER_TEMP/cluster-check.log"

      # Weekly, and on request (workflow_dispatch input neuvector_report): NeuVector's own scan
      # of every image the deployment runs, and by reference of every pinned image it doesn't
      # (Big Bang's optional packages), through the controller's API on a local port-forward
      # (Big Bang creates no API Service). It logs in as admin with the chart's bootstrap
      # password and sets a random one, as NeuVector requires on first login; neither is
      # printed or saved. Not part of the recorded result: a failed export fails only this run.
      - name: NeuVector's scans of the deployed images
        id: nvreport
        if: (inputs.neuvector_report || github.event_name == 'schedule') && steps.install.outcome == 'success'
        timeout-minutes: 120
        env:
          MODE: ${{ matrix.fips && 'fips' || 'standard' }}
          # NeuVector's own containers aren't in its workload list: nv-report.py scans those
          # images by reference, pulling with these (the deployed digests from the org and GHCR).
          BUILD_REGISTRY_USERNAME: ${{ github.actor }}
          BUILD_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # A controller that isn't Ready refuses the forward and kubectl gives up: wait for
          # the rollout, then keep the forward up (a dropped one is restarted). nv-report.py
          # retries its login while the API comes up.
          kubectl -n neuvector rollout status deploy/neuvector-controller-pod --timeout=600s
          # Big Bang's default NetworkPolicies let NeuVector's scanner reach only the Kubernetes
          # API, so a by-reference scan can't pull from a registry: each one waits 60 s and
          # fails "Image not found". For this report only (not the overlays), let the scanner
          # and controller reach registries on 443; a deployer who wants registry scans adds
          # the same egress (neuvector.values.networkPolicies.egress.from.scanner.to.cidr).
          kubectl apply -f - <<'EOF'
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: nv-report-registry-egress
            namespace: neuvector
          spec:
            podSelector:
              matchExpressions:
                - {key: app, operator: In, values: [neuvector-scanner-pod, neuvector-controller-pod]}
            policyTypes: [Egress]
            egress:
              - ports: [{port: 443, protocol: TCP}]
          EOF
          (while true; do kubectl -n neuvector port-forward deploy/neuvector-controller-pod 10443:10443; sleep 2; done) \
            >> "$RUNNER_TEMP/nv-port-forward.log" 2>&1 &
          trap 'kill %1 2>/dev/null || true' EXIT
          NV_BOOTSTRAP=$(kubectl -n neuvector get secret neuvector-bootstrap-secret -o jsonpath='{.data.bootstrapPassword}' | base64 -d)
          echo "::add-mask::$NV_BOOTSTRAP"
          # NeuVector's password policy wants upper, lower, digit and a symbol.
          NV_PASSWORD="$(openssl rand -base64 24 | tr -d '/+=')Aa1!"
          echo "::add-mask::$NV_PASSWORD"
          CGR_PASSWORD=$(chainctl auth token --audience cgr.dev)
          echo "::add-mask::$CGR_PASSWORD"
          export NV_BOOTSTRAP NV_PASSWORD CGR_USERNAME=_token CGR_PASSWORD
          kubectl get pods -A -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{end}' \
            > "$RUNNER_TEMP/pod-images.txt"
          overlay=overlays/values-chainguard.yaml flux=flux/kustomization.yaml
          if [ "$MODE" = fips ]; then overlay=overlays/values-chainguard-fips.yaml flux=flux-fips/kustomization.yaml; fi
          python scripts/security-report.py pins --mode "$MODE" > "$RUNNER_TEMP/pinned-images.txt"
          python scripts/nv-report.py --api https://127.0.0.1:10443 --out "$RUNNER_TEMP/nv-report" \
            --mode "$MODE" --overlay "$overlay" --overlay "$flux" --pod-images "$RUNNER_TEMP/pod-images.txt" \
            --optional-images "$RUNNER_TEMP/pinned-images.txt" --jobs 3 --timeout 1500
          cp "$RUNNER_TEMP/pod-images.txt" "$RUNNER_TEMP/pinned-images.txt" "$RUNNER_TEMP/nv-report/"
          cat "$RUNNER_TEMP/nv-report/nv-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload NeuVector's scans
        if: always() && steps.nvreport.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nv-report${{ matrix.fips && '-fips' || '' }}
          path: ${{ runner.temp }}/nv-report
          retention-days: 30
          if-no-files-found: ignore

      # Checked again after the install: a pass must mean Big Bang ran under the CIS profile.
      - name: The CIS profile was in effect throughout
        id: cis
        if: always() && steps.vm.outcome == 'success'
        run: bash .github/rke2-vm.sh assert

      - name: Summary
        if: always()
        run: |
          {
            echo "### Big Bang default packages on RKE2 (CIS profile)"
            echo '```'
            grep -E "^(RESULT|PROBLEM|NOTE|HEALTHY|NOT HEALTHY|not ready|not installing|ready:)|^  (OK  |FAIL)" \
              "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/install.log" "$RUNNER_TEMP/cluster-check.log" 2>/dev/null | head -120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cluster state and VM logs
        if: always() && steps.vm.outcome != 'skipped'
        run: |
          bash .github/rke2-vm.sh logs
          d=$RUNNER_TEMP/diag; mkdir -p "$d"
          kubectl get nodes -o wide > "$d/nodes.txt" 2>&1 || true
          kubectl describe nodes >> "$d/nodes.txt" 2>&1 || true
          kubectl get pods -A -o wide > "$d/pods.txt" 2>&1 || true
          kubectl get helmreleases -A > "$d/helmreleases.txt" 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > "$d/events.txt" 2>&1 || true
          kubectl get pvc -A > "$d/pvc.txt" 2>&1 || true
          for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            for p in $(kubectl -n "$ns" get pod -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              mkdir -p "$d/logs/$ns"
              kubectl -n "$ns" logs "$p" --all-containers --tail=500 > "$d/logs/$ns/$p.log" 2>&1 || true
              kubectl -n "$ns" logs "$p" --all-containers --previous --tail=500 > "$d/logs/$ns/$p.previous.log" 2>/dev/null \
                || rm -f "$d/logs/$ns/$p.previous.log"
            done
          done

      - name: Upload logs and cluster state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rke2-default-packages${{ matrix.fips && '-fips' || '' }}
          path: |
            ${{ runner.temp }}/diag
            ${{ runner.temp }}/check.log
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/cluster-check.log
            ${{ runner.temp }}/rke2-vm/logs
          retention-days: 14
          if-no-files-found: ignore

      # The run's result as JSON, as compat.yml's jobs record theirs: test-results.py reads
      # rke2.yml's runs too (update --from-main, --from-branch) and puts `rke2-default` in
      # docs/testing.md's table. results-gate.py never requires that row. A pass needs the
      # install, the health check and the CIS assertion; a step that didn't finish (a
      # cancelled job, a VM that never booted) records `error`, which replaces nothing.
      - name: Record the result
        # Not when the job stopped before the VM (no RKE2_RUNNER, no KVM): nothing was tested.
        if: always() && steps.vm.outcome != 'skipped'
        env:
          INSTALL: ${{ steps.install.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          CIS: ${{ steps.cis.outcome }}
          MODE: ${{ matrix.fips && 'fips' || 'standard' }}
        run: |
          outcome=success
          for o in "$INSTALL" "$HEALTH" "$CIS"; do
            case "$o" in
              success) ;;
              failure) if [ "$outcome" = success ]; then outcome=failure; fi ;;
              *) outcome=cancelled ;;
            esac
          done
          python scripts/test-results.py record --test rke2-default --mode "$MODE" --outcome "$outcome" \
            --log "$RUNNER_TEMP/install.log" --out "$RUNNER_TEMP/result"
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: compat-result-rke2-default-${{ matrix.fips && 'fips' || 'standard' }}
          path: ${{ runner.temp }}/result
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true   # a re-run job replaces its earlier attempt's result

  # The security report (weekly, and with neuvector_report): both jobs' NeuVector scans,
  # each image scanned again with grype and Trivy, its signature and SBOM checked with
  # cosign, every finding matched to Chainguard's advisory, CISA's KEV list and EPSS
  # (scripts/security-report.py), and the report printed to PDF with the runner's Chrome.
  # On a standard runner: none of it needs the VM.
  security-report:
    needs: [rke2]
    if: always() && (inputs.neuvector_report || inputs.report_from_run || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      BUILD_REGISTRY: ${{ vars.BUILD_REGISTRY }}
      BUILD_SIGNER: ${{ github.repository }}
      # Trivy's databases from GHCR (mirror.gcr.io is its default).
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
    permissions:
      actions: read      # another run's artifacts (report_from_run)
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          # cve-report.yml's list (grype, the registries, Docker Hub's CDNs for RKE2's images),
          # Sigstore for cosign, and the report's feeds: Chainguard's and Wolfi's security
          # databases, CISA's KEV list and FIRST's EPSS API. Trivy's installer downloads from
          # get.trivy.dev (curl exit 7 when blocked, run 45550267826).
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.cgr.dev:443
            *.r2.cloudflarestorage.com:443
            api.first.org:443
            api.github.com:443
            auth.docker.io:443
            cgr.dev:443
            console-api.enforce.dev:443
            dl.enforce.dev:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            grype.anchore.io:443
            index.docker.io:443
            issuer.enforce.dev:443
            objects.githubusercontent.com:443
            packages.cgr.dev:443
            packages.wolfi.dev:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            www.cisa.gov:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: NeuVector's scans from both jobs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: nv-report*
          path: ${{ runner.temp }}/nv
          run-id: ${{ inputs.report_from_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Any scans to report?
        id: have
        run: |
          ls -R "$RUNNER_TEMP/nv" || true
          if ls "$RUNNER_TEMP"/nv/*/nv-report.json >/dev/null 2>&1; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::no NeuVector report from the RKE2 jobs: nothing to report"; fi

      - name: Log into Chainguard
        if: steps.have.outputs.yes
        uses: chainguard-dev/setup-chainctl@bfe7503a12660737d9d66d02d2610a399d804316  # v0.6.0
        with:
          # Pinned: `latest` changes under every run. Same version in every workflow
          # (tests/test_repo_rules.py); raise it on purpose (AGENTS.md, "chainctl").
          version: 0.2.403
          identity: ${{ secrets.CGR_ACTIONS_ID }}

      - name: Log into GHCR (the images this repo builds)
        if: steps.have.outputs.yes
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # grype and Trivy unpack each image (GitLab's are several GB): two at a time, on /mnt
      # (the runner's second, larger disk), as cve-report.yml does.
      - name: Free disk space
        if: steps.have.outputs.yes
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/scan && sudo chown "$USER" /mnt/scan
          df -h / /mnt

      - name: Install grype
        if: steps.have.outputs.yes
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2

      - name: Install Trivy
        if: steps.have.outputs.yes
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.76.2
          cache: false

      - name: Install cosign
        if: steps.have.outputs.yes
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          cosign-release: v3.0.6

      - name: Scan, check and build the report
        if: steps.have.outputs.yes
        env:
          GRYPE_DIR: ${{ steps.grype.outputs.cmd }}
          TMPDIR: /mnt/scan
        run: |
          set -o pipefail
          python3 -m pip install --quiet -r requirements.txt
          export PATH="$(dirname "$GRYPE_DIR"):$PATH"
          grype db update
          nv=()
          for d in "$RUNNER_TEMP"/nv/*/; do nv+=(--nv "$d"); done
          python3 scripts/security-report.py scan "${nv[@]}" --out "$RUNNER_TEMP/scans" --jobs 2
          python3 scripts/security-report.py build "${nv[@]}" --scans "$RUNNER_TEMP/scans" --out "$RUNNER_TEMP/security-report"
          cat "$RUNNER_TEMP/security-report/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # The runner's Chrome prints the HTML report (stdlib only in the script, no PDF library).
      - name: Print the report to PDF
        if: steps.have.outputs.yes
        run: |
          out="$RUNNER_TEMP/security-report"
          google-chrome --headless=new --disable-gpu --no-sandbox --no-pdf-header-footer \
            --print-to-pdf="$out/security-report.pdf" "file://$out/report.html"
          ls -l "$out"

      - name: Upload the security report
        if: always() && steps.have.outputs.yes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: security-report
          path: ${{ runner.temp }}/security-report
          retention-days: 90
          if-no-files-found: ignore

  # Publishes the report (weekly; by hand with publish_report): the PDF on the latest release
  # every time (release.py also attaches docs/security-report.pdf to each new release), and
  # docs/security-report.pdf and .md through the bot pull request bot/security-report, which
  # automerge.yml merges when green. That pull request opens only when the report's counts
  # (summary.md) changed: a 2 MB PDF a week would grow every clone.
  publish-report:
    needs: [security-report]
    if: always() && needs.security-report.result == 'success' && (github.event_name == 'schedule' || inputs.publish_report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read      # this run's artifact
      contents: write    # the release asset
    steps:
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: The security report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: security-report
          path: ${{ runner.temp }}/sr

      - name: Attach it to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sr="$RUNNER_TEMP/sr"
          [ -s "$sr/security-report.pdf" ] || { echo "::error::the artifact has no security-report.pdf"; exit 1; }
          tag=$(gh release view --json tagName --jq .tagName)
          gh release upload "$tag" "$sr/security-report.pdf" --clobber
          echo "Attached security-report.pdf to release $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: docs/security-report.pdf and .md
        id: docs
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sr="$RUNNER_TEMP/sr"
          n=$(wc -l < "$sr/summary.md")
          if [ -f docs/security-report.md ] && head -n "$n" docs/security-report.md | cmp -s - "$sr/summary.md"; then
            echo "::notice::the counts match docs/security-report.md: no pull request"
            exit 0
          fi
          cp "$sr/security-report.pdf" docs/security-report.pdf
          {
            cat "$sr/summary.md"
            echo
            echo "Scanned $(date -u +%F) (rke2.yml run $RUN_ID). Open C/H: after Chainguard's advisories. The full report:"
            echo "[security-report.pdf](security-report.pdf). Rebuilt weekly by rke2.yml; [testing.md](testing.md#neuvectors-scan-of-every-deployed-image) explains it."
          } > docs/security-report.md
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The bot's token (the GitHub App's, else RELEASE_PAT), so CI runs on the pull request.
      - name: Bot token (GitHub App)
        id: app
        if: steps.docs.outputs.date && vars.BOT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the pull request
        if: steps.docs.outputs.date
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        with:
          token: ${{ steps.app.outputs.token || secrets.RELEASE_PAT }}
          base: main
          branch: bot/security-report
          delete-branch: true
          title: "chore: security report ${{ steps.docs.outputs.date }}"
          commit-message: "chore: security report ${{ steps.docs.outputs.date }}"
          body: "The weekly security report from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}: its counts changed. automerge.yml merges it when every check passes."
          add-paths: |
            docs/security-report.pdf
            docs/security-report.md

  # A scheduled run has no pull request to fail on: keep one `ci-scheduled-failure` issue
  # for this workflow current (scripts/ci-alert.py), closed by the next scheduled success.
  alert:
    needs: [rke2, security-report, publish-report]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Keep the scheduled-failure issue current
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_MENTION: ${{ vars.ALERT_MENTION }}
          WORKFLOW: ${{ github.workflow }}
          # A cancelled job (a time limit) is a failure too.
          RESULT: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci-alert.py --workflow "$WORKFLOW" --result "$RESULT" --run-url "$RUN_URL"
