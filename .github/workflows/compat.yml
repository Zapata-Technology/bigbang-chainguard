# Upgrade tests: deploy one Big Bang package on Chainguard images in a throwaway kind
# cluster, with a trial mapping from compat/<test>.yaml (e.g. Vault 2.x where Big
# Bang pins 1.21), and check that it runs. One job per test and mode; nothing here
# changes the overlays. Runs on pull requests that change a test, or by hand; the
# results tell you whether to move an image from `stays` to the trial mapping.
name: Compat - upgrade tests

on:
  pull_request:
    paths:
      # What a cluster runs changes: the nightly pull request's new tags and digests are
      # tested on kind before they merge, not only rendered.
      - BIGBANG_VERSION
      - mapping.yaml
      - orgs/**
      - object-storage.yaml
      - overlays/**
      - flux/**
      - flux-fips/**
      - compat/**
      - .github/kind-compat.yaml
      - scripts/bb-compat.py
      - scripts/bb-install.py
      - scripts/bbcluster.py
      - .github/workflows/compat.yml
  schedule:
    - cron: "0 6 * * 0"   # weekly: every test, the large ones too
  workflow_dispatch:
    inputs:
      tests:
        description: Comma-separated compat/<test> names (empty = all)
        default: ""
      fips:
        description: Also run each test with the FIPS overlay
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      bigbang-key: ${{ steps.bb.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: m
        env:
          TESTS: ${{ inputs.tests }}
          FIPS: ${{ github.event_name != 'workflow_dispatch' || inputs.fips }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os, re
          named = [t.strip() for t in os.environ["TESTS"].split(",") if t.strip()]
          names = named or sorted(os.path.basename(p)[:-5] for p in glob.glob("compat/*.yaml"))
          def large(n):   # `large: true` under test: (no PyYAML in this job)
              return bool(re.search(r"^  large: true", open(f"compat/{n}.yaml").read(), re.M))
          if not named and os.environ["EVENT"] == "pull_request":
              names = [n for n in names if not large(n)]   # large tests: weekly and on demand
          modes = ["standard", "fips"] if os.environ["FIPS"] == "true" else ["standard"]
          print("matrix=" + json.dumps({"include": [{"test": n, "mode": m, "minutes": 90 if large(n) else 45}
                                                    for n in names for m in modes]}))
          EOF

      # Clone Big Bang once per version and share it through the Actions cache: ~50 test
      # jobs cloning repo1.dso.mil at the same moment fail together when it has a bad
      # minute (HTTP 503), and repo1 then sees one clone per Big Bang release, not ~50 a run.
      - id: bb
        run: echo "key=bigbang-chart-$(cat BIGBANG_VERSION)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: work/bigbang
          key: ${{ steps.bb.outputs.key }}
          lookup-only: true
      - name: Fetch Big Bang (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tag=$(cat BIGBANG_VERSION)
          for i in 1 2 3 4 5 6; do   # repo1.dso.mil intermittently refuses GitHub runners
            git clone -q --depth 1 --branch "$tag" https://repo1.dso.mil/big-bang/bigbang.git work/bigbang && break
            rm -rf work/bigbang; sleep $((30 * i))
          done
          test -d work/bigbang/chart
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: work/bigbang
          key: ${{ steps.bb.outputs.key }}

  test:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.test }} (${{ matrix.mode }})
    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      BUILD_REGISTRY: ${{ vars.BUILD_REGISTRY }}
      # fluxrelease.py reads Flux releases from api.github.com; authenticated, the
      # parallel jobs don't share the anonymous rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      # Audit only: the kind nodes pull every image a test needs through Docker's network,
      # from whichever registries that test touches; a blocked pull would look like the
      # image failure these tests exist to find. ci/builds/update run in block mode.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.18.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # Four kind nodes each pull the package's images (NeuVector's are large): the
      # runner's disk filled up ("No space left on device"). Drop preinstalled
      # toolchains these jobs don't use (~30 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # kind's nodes share the runner's kernel; NeuVector's enforcers ran out of inotify
      # instances ("Failed to open file monitor! too many open files"). kind's documented fix.
      - name: Raise inotify limits
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512

      - name: Create a kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa  # v1.15.1
        with:
          cluster_name: compat
          node_image: kindest/node:v1.34.0
          config: .github/kind-compat.yaml
          # kind-action's cleanup tries to remove a registry container it never created.
          ignore_failed_clean: true

      - name: Log into Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28  # v0.5.1
        with:
          identity: ${{ secrets.CGR_ACTIONS_ID }}

      - name: Big Bang (from the plan job's cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: work/bigbang
          key: ${{ needs.plan.outputs.bigbang-key }}
          fail-on-cache-miss: true

      - name: Python packages
        run: |
          python3 -m pip install --quiet pyyaml
          test -d work/bigbang/chart

      - name: Deploy and check
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          # An Iron Bank account, for tests marked `registry1: true` (vault-upgrade starts
          # from Iron Bank's Vault). Without these secrets bb-compat.py prints
          # "RESULT ...: SKIPPED" and exits 0 for such a test.
          REGISTRY1_USERNAME: ${{ secrets.REGISTRY1_USERNAME }}
          REGISTRY1_PASSWORD: ${{ secrets.REGISTRY1_PASSWORD }}
          KIND_CLUSTER: compat
          # bb-compat.py keeps every pod's logs and the cluster's state here; uploaded below.
          COMPAT_DIAG: ${{ runner.temp }}/diag
        run: |
          CGR_TOKEN=$(chainctl auth token --audience cgr.dev)
          echo "::add-mask::$CGR_TOKEN"
          export CGR_TOKEN
          # repo1.dso.mil refuses GitHub's runners now and then, and a package whose chart
          # Flux couldn't fetch never starts: one more run on the same cluster then (Flux
          # has kept retrying meanwhile). Any other failure is real.
          for try in 1 2; do
            set +e
            python3 scripts/bb-compat.py "compat/${{ matrix.test }}.yaml" \
              ${{ matrix.mode == 'fips' && '--fips' || '' }} 2>&1 | tee "${RUNNER_TEMP}/compat.log"
            rc=${PIPESTATUS[0]}
            set -e
            [ "$rc" = 0 ] && exit 0
            if [ "$try" = 2 ] || ! grep -q "^PROBLEM: repo1.dso.mil: .* can't fetch" "${RUNNER_TEMP}/compat.log"; then
              exit "$rc"
            fi
            echo "::warning::repo1.dso.mil refused a chart fetch; running the test once more"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.test }} (${{ matrix.mode }})"
            echo '```'
            grep -E "^RESULT|^PROBLEM|^EXITED|^  (OK  |FAIL)|^         [a-z].*: " "${RUNNER_TEMP}/compat.log" 2>/dev/null | head -60 || true
            echo '```'
            echo "Every pod's logs and the cluster's state: artifact \`compat-${{ matrix.test }}-${{ matrix.mode }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Pass or fail: each container's log (and the run before a restart), events, pod
      # descriptions, node allocations and Flux's status, kept after the cluster is gone.
      # Download: gh run download <run id> -n compat-<test>-<mode>
      - name: Upload logs and cluster state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: compat-${{ matrix.test }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/diag
            ${{ runner.temp }}/compat.log
          retention-days: 14
          if-no-files-found: ignore
