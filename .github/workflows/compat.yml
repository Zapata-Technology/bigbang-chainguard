# Upgrade tests: deploy one Big Bang package on Chainguard images in a throwaway kind
# cluster, with a trial mapping from compat/<test>.yaml (e.g. Vault 2.x where Big
# Bang pins 1.21), and check that it runs. One job per test and mode; nothing here
# changes the overlays. Runs on pull requests that change a test, or by hand; the
# results tell you whether to move an image from `stays` to the trial mapping. Each job
# also records its result as JSON; the nightly update.yml turns main's into
# docs/testing.md's results table (scripts/test-results.py).
name: Compat - upgrade tests

on:
  pull_request:
    paths:
      # What a cluster runs changes. scripts/compat-plan.py then picks only the tests the
      # change reaches: a package's new tag runs that package's tests; digest-only, Flux and
      # harness changes run two small smoke tests; the weekly run covers everything.
      - BIGBANG_VERSION
      - mapping.yaml
      - orgs/**
      - object-storage.yaml
      - overlays/**
      - flux/**
      - flux-fips/**
      - compat/**
      - .github/kind-compat.yaml
      - scripts/bb-compat.py
      - scripts/compat-plan.py
      - scripts/bb-install.py
      - scripts/bbinstall/**
      - scripts/bbcluster.py
      - .github/workflows/compat.yml
  schedule:
    - cron: "0 6 * * 0"   # weekly: every test, the large ones too
  workflow_dispatch:
    inputs:
      tests:
        description: Comma-separated compat/<test> names (empty = all)
        default: ""
      fips:
        description: Also run each test with the FIPS overlay
        type: boolean
        default: true
      bigbang_ref:
        description: Deploy this Big Bang branch or tag instead of BIGBANG_VERSION (empty = BIGBANG_VERSION)
        default: ""
  # bigbang-preview.yml: Big Bang's untagged release-X.Y.Z branch, before it ships. The
  # plan job clones that ref and rediscovers its images; each test job converts the
  # overlays from that discovery (nothing is committed). With no `tests`, a handful
  # (compat-plan.py PREVIEW). Results carry a preview marker and never reach
  # docs/testing.md's table (test-results.py).
  workflow_call:
    inputs:
      bigbang_ref:
        description: Big Bang branch or tag to deploy instead of BIGBANG_VERSION
        type: string
        required: true

# A new push to a pull request cancels that pull request's older run (only the newest
# commit's result matters, and every run costs runner minutes). Runs on
# main and schedules each get their own group (run_id), so none is cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
      bigbang-key: ${{ steps.m.outputs.bigbang-key }}
    env:
      # Empty except for bigbang-preview.yml's calls and manual runs that name a ref.
      BIGBANG_REF: ${{ inputs.bigbang_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # the pull request's changed files
      # Which tests: a pull request runs only those its change reaches (a changed
      # compat/<test>.yaml, a package whose overlay changed, ...); see scripts/compat-plan.py.
      # Also the Big Bang to deploy and its cache key: BIGBANG_VERSION's, or BIGBANG_REF's
      # at its current commit.
      - id: m
        env:
          TESTS: ${{ inputs.tests }}
          FIPS: ${{ github.event_name != 'workflow_dispatch' || inputs.fips }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -o pipefail   # a bad or unknown BIGBANG_REF stops the run here
          python3 scripts/compat-plan.py --event "$EVENT" --tests "$TESTS" --bigbang-ref "$BIGBANG_REF" \
            ${BASE:+--changed-from "origin/$BASE"} $([ "$FIPS" = true ] && echo --fips) | tee -a "$GITHUB_OUTPUT"

      # Clone Big Bang once per version and share it through the Actions cache: ~50 test
      # jobs cloning repo1.dso.mil at the same moment fail together when it has a bad
      # minute (HTTP 503), and repo1 then sees one clone per Big Bang release, not ~50 a run.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: work/bigbang
          key: ${{ steps.m.outputs.bigbang-key }}
          lookup-only: true
      - name: Fetch Big Bang (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true' && env.BIGBANG_REF == ''
        env:
          TAG: ${{ steps.m.outputs.bigbang-version }}
        run: |
          for i in 1 2 3 4 5 6; do   # repo1.dso.mil intermittently refuses GitHub runners
            git clone -q --depth 1 --branch "$TAG" https://repo1.dso.mil/big-bang/bigbang.git work/bigbang && break
            rm -rf work/bigbang; sleep $((30 * i))
          done
          test -d work/bigbang/chart

      # A Big Bang branch: its chart and every package (bb-fetch.py), and the images they
      # deploy (bb-images.py, every package on, as discovery/images.json is made). The
      # discovery rides in the cached clone; each test job puts it in place of
      # discovery/images.json, so bb-compat.py converts the overlays for that ref.
      - name: Set up Helm (Big Bang ref, cache miss only)
        if: steps.cache.outputs.cache-hit != 'true' && env.BIGBANG_REF != ''
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v3.18.3
      - name: Set up Python (Big Bang ref, cache miss only)
        if: steps.cache.outputs.cache-hit != 'true' && env.BIGBANG_REF != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Fetch Big Bang's ref and discover its images (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true' && env.BIGBANG_REF != ''
        run: |
          python3 -m pip install --quiet -r requirements.txt
          python3 scripts/bb-fetch.py --version "$BIGBANG_REF" --dir work
          python3 scripts/bb-images.py --bigbang work/bigbang --pkgs work/pkgs \
            --values discovery/render-inputs.yaml -o work/bigbang/.ref-images.json
          test -s work/bigbang/.ref-images.json

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: work/bigbang
          key: ${{ steps.m.outputs.bigbang-key }}

  test:
    needs: plan
    # A pull request whose change reaches no kind test (docs, unit tests) runs none.
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.test }} (${{ matrix.mode }})
    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      BUILD_REGISTRY: ${{ vars.BUILD_REGISTRY }}
      # fluxrelease.py reads Flux releases from api.github.com; authenticated, the
      # parallel jobs don't share the anonymous rate limit.
      GITHUB_TOKEN: ${{ github.token }}
      BIGBANG_REF: ${{ inputs.bigbang_ref }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      # Audit only: the kind nodes pull every image a test needs through Docker's network,
      # from whichever registries that test touches; a blocked pull would look like the
      # image failure these tests exist to find. ci/builds/update run in block mode.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v3.18.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # Four kind nodes each pull the package's images (NeuVector's are large): the
      # runner's disk filled up ("No space left on device"). Drop preinstalled
      # toolchains these jobs don't use (~30 GB). Deleting them takes ~90 s, so it runs in
      # the background while the cluster starts; "Deploy and check" waits for it before
      # the package's images are pulled.
      - name: Free disk space (in the background)
        run: |
          nohup setsid sh -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h /; touch "$0/disk-freed"' "$RUNNER_TEMP" \
            > "$RUNNER_TEMP/free-disk.log" 2>&1 < /dev/null &

      # kind's nodes share the runner's kernel; NeuVector's enforcers ran out of inotify
      # instances ("Failed to open file monitor! too many open files"). kind's documented fix.
      - name: Raise inotify limits
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512

      - name: Create a kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376  # v1.15.2
        with:
          cluster_name: compat
          # Big Bang 4 requires Kubernetes 1.35+; the image kind v0.33.0 (kind-action's default) lists.
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          config: .github/kind-compat.yaml
          # kind-action's cleanup tries to remove a registry container it never created.
          ignore_failed_clean: true

      - name: Log into Chainguard
        uses: chainguard-dev/setup-chainctl@bfe7503a12660737d9d66d02d2610a399d804316  # v0.6.0
        with:
          # Pinned: `latest` changes under every run. Same version in every workflow
          # (tests/test_repo_rules.py); raise it on purpose (AGENTS.md, "chainctl").
          version: 0.2.403
          identity: ${{ secrets.CGR_ACTIONS_ID }}

      # bb-install.py upgrade --to verifies a release's signature with it
      # (compat/installer-upgrade-to.yaml).
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          # Pinned: the installer's default moves with each release (4.1.3: cosign 3.1.4,
          # which deprecates the signing flags builds.yml uses). Same version in every
          # workflow (tests/test_repo_rules.py); raise it on purpose, with builds.yml's flags.
          cosign-release: v3.0.6

      - name: Big Bang (from the plan job's cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: work/bigbang
          key: ${{ needs.plan.outputs.bigbang-key }}
          fail-on-cache-miss: true

      - name: Python packages
        run: |
          python3 -m pip install --quiet -r requirements.txt
          test -d work/bigbang/chart

      # A Big Bang ref (bigbang-preview.yml): this job's checkout deploys it in place of
      # BIGBANG_VERSION, with the plan job's discovery of its images, so bb-compat.py
      # converts the overlays (and Flux's base/flux?ref=) for it. Never committed.
      - name: Big Bang ref in place of BIGBANG_VERSION
        if: env.BIGBANG_REF != ''
        run: |
          cp work/bigbang/.ref-images.json discovery/images.json
          printf '%s\n' "$BIGBANG_REF" > BIGBANG_VERSION
          echo "Deploying Big Bang $BIGBANG_REF ($(git -C work/bigbang rev-parse --short HEAD 2>/dev/null || echo '?'))"

      - name: Deploy and check
        id: deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          # An Iron Bank account, for tests marked `registry1: true` (vault-upgrade starts
          # from Iron Bank's Vault). Without these secrets bb-compat.py prints
          # "RESULT ...: SKIPPED" and exits 0 for such a test.
          REGISTRY1_USERNAME: ${{ secrets.REGISTRY1_USERNAME }}
          REGISTRY1_PASSWORD: ${{ secrets.REGISTRY1_PASSWORD }}
          KIND_CLUSTER: compat
          # bb-compat.py keeps every pod's logs and the cluster's state here; uploaded below.
          COMPAT_DIAG: ${{ runner.temp }}/diag
        run: |
          until [ -f "$RUNNER_TEMP/disk-freed" ]; do sleep 5; done   # "Free disk space" above
          cat "$RUNNER_TEMP/free-disk.log"
          CGR_TOKEN=$(chainctl auth token --audience cgr.dev)
          echo "::add-mask::$CGR_TOKEN"
          export CGR_TOKEN
          # repo1.dso.mil refuses GitHub's runners now and then, and a package whose chart
          # Flux couldn't fetch never starts: one more run on the same cluster then (Flux
          # has kept retrying meanwhile). Any other failure is real.
          for try in 1 2; do
            set +e
            python3 scripts/bb-compat.py "compat/${{ matrix.test }}.yaml" \
              ${{ matrix.mode == 'fips' && '--fips' || '' }} 2>&1 | tee "${RUNNER_TEMP}/compat.log"
            rc=${PIPESTATUS[0]}
            set -e
            [ "$rc" = 0 ] && exit 0
            if [ "$try" = 2 ] || ! grep -q "^PROBLEM: repo1.dso.mil: .* can't fetch" "${RUNNER_TEMP}/compat.log"; then
              exit "$rc"
            fi
            echo "::warning::repo1.dso.mil refused a chart fetch; running the test once more"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.test }} (${{ matrix.mode }})"
            echo '```'
            grep -E "^RESULT|^PROBLEM|^EXITED|^[0-9:]{8} LIVE |^  (OK  |FAIL)|^         [a-z].*: " "${RUNNER_TEMP}/compat.log" 2>/dev/null | head -60 || true
            echo '```'
            echo "Every pod's logs and the cluster's state: artifact \`compat-${{ matrix.test }}-${{ matrix.mode }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Pass or fail: each container's log (and the run before a restart), events, pod
      # descriptions, node allocations and Flux's status, kept after the cluster is gone.
      # Download: gh run download <run id> -n compat-<test>-<mode>
      - name: Upload logs and cluster state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: compat-${{ matrix.test }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/diag
            ${{ runner.temp }}/compat.log
          retention-days: 14
          if-no-files-found: ignore

      # The job's result as JSON (test, mode, pass/fail/skipped, Big Bang version, date,
      # run, commit): the nightly update.yml writes docs/testing.md's results table from
      # these (scripts/test-results.py). A cancelled job or a failed setup step records
      # `error`, which never replaces a real result. A Big Bang ref's result is marked
      # `preview` and stays out of the table (it isn't what this repo deploys).
      - name: Record the result
        if: always()
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
          TEST: ${{ matrix.test }}
          MODE: ${{ matrix.mode }}
        run: |
          python3 scripts/test-results.py record --test "$TEST" --mode "$MODE" --outcome "$OUTCOME" \
            --log "${RUNNER_TEMP}/compat.log" --out "${RUNNER_TEMP}/result" ${BIGBANG_REF:+--preview}
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: compat-result-${{ matrix.test }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/result
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true   # a re-run job replaces its earlier attempt's result

  # Runs on main (the weekly schedule, manual runs): every job's result in one artifact,
  # `compat-results`, and a table in the run's summary. Pull requests skip it; their
  # results describe a branch, not main.
  results:
    needs: test
    if: always() && github.event_name != 'pull_request' && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read     # gh run download: this run's result artifacts
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Collect the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --pattern 'compat-result-*' -D results || true
          {
            echo "### Kind test results"
            python3 scripts/test-results.py summary --results results
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: compat-results
          path: results
          retention-days: 90
          if-no-files-found: ignore
