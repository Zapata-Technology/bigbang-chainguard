name: Auto-merge - nightly update

# Merges the nightly bot pull requests (update.yml: bot/bigbang-update, and
# bot/builds-update with build.yaml files held back until published) once every
# check on its head commit has passed: CI, the image builds and every kind test. Branch
# protection only requires `verify`, so GitHub's own auto-merge would not wait for the
# kind tests; this does. It runs each time one of those workflows finishes and merges on
# the run that sees nothing pending or failed.
#
# Not merged automatically: a new Big Bang release (BIGBANG_VERSION changes; a person
# reads the report first), and a pull request labeled `hold`.
#
# A workflow run on the bot PR that fails on its first attempt gets its failed jobs
# re-run once: most nightly failures are repo1.dso.mil refusing the runner or a
# download's 5xx. A second failure waits for a person (python scripts/ci-triage.py <pr>).
#
# The reads use GITHUB_TOKEN (RELEASE_PAT has no Checks permission, so the check-runs call
# returned 403). Only the merge uses RELEASE_PAT, as update.yml does: a merge made with
# GITHUB_TOKEN would not start the push workflows (builds.yml, release.yml) on main.

on:
  workflow_run:
    workflows: [CI, "Compat - upgrade tests", "Build - Big Bang images"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.head_branch == 'bot/bigbang-update' ||
       github.event.workflow_run.head_branch == 'bot/builds-update') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write        # re-run a failed first attempt
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      # No checkout: nothing from the pull request runs here.
      - name: Merge when every check on the head commit passed
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          [ -n "$MERGE_TOKEN" ] || { echo "::warning::RELEASE_PAT is not set; not merging"; exit 0; }
          pr=$(gh pr list --head "$BRANCH" --state open --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "no open $BRANCH pull request at $SHA (a newer commit, or merged)"; exit 0
          fi
          if gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx hold; then
            echo "#$pr is labeled hold"; exit 0
          fi
          if gh pr diff "$pr" --name-only | grep -qx BIGBANG_VERSION; then
            echo "#$pr moves to a new Big Bang release: left for a person to merge"; exit 0
          fi
          # A kind test cut off by its time limit (repo1.dso.mil) ends the run as cancelled.
          if { [ "$CONCLUSION" = failure ] || [ "$CONCLUSION" = cancelled ] || [ "$CONCLUSION" = timed_out ]; } \
              && [ "$ATTEMPT" = 1 ]; then
            echo "run $RUN failed on its first attempt: re-running its failed jobs once"
            gh run rerun "$RUN" --failed
            exit 0
          fi
          # Every check run on the head commit, any workflow. Wait while any is unfinished;
          # stop on any that didn't pass. Skipped jobs (codeql before the repo is public) count
          # as passed.
          runs=$(gh api --paginate "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | "\(.status) \(.conclusion // "-") \(.name)"')
          echo "$runs"
          [ -n "$runs" ] || { echo "no checks yet"; exit 0; }
          if echo "$runs" | grep -qv '^completed '; then
            echo "checks still running on #$pr"; exit 0
          fi
          if echo "$runs" | grep -qvE '^completed (success|skipped|neutral) '; then
            echo "::warning::#$pr has a failed check; not merging"; exit 0
          fi
          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$pr" --squash --delete-branch --match-head-commit "$SHA"
          echo "merged #$pr at $SHA"
