name: Auto-merge - nightly update

# Merges the nightly bot pull requests (update.yml: bot/bigbang-update, the routine track;
# bot/bigbang-release, a new Big Bang release; and bot/builds-update / bot/builds-release
# with build.yaml files held back until published) once every check on its head commit has
# passed: CI, the image builds and every kind test. Branch
# protection only requires `verify`, so GitHub's own auto-merge would not wait for the
# kind tests; this does. It runs each time one of those workflows finishes and merges on
# the run that sees nothing pending or failed.
#
# Not merged automatically: a new Big Bang release (bot/bigbang-release; a person reads its
# upgrade notes and report first), except a patch release (same MAJOR.MINOR) when the
# AUTOMERGE_BIGBANG_PATCHES repository variable is `true`; a pull request labeled `hold`, and a bot PR that carries anything
# but the bot's one commit touching the files update.yml writes (a person's commit on the
# bot branch would otherwise land on main unreviewed, under the bot's title).
#
# A workflow run on the bot PR that fails on its first attempt is triaged with main's
# scripts/ci-triage.py --run: its failed jobs are re-run once only when every failure is a
# known flake (repo1.dso.mil refusing the runner, a network timeout, a download's 5xx). A real
# failure (a check, a missing image, a policy refusal) isn't re-run: it fails the same way
# again and only delays the person. That, a failure that survives the re-run, or triage that
# couldn't read GitHub waits for a person: the PR gets the `needs-attention` label and one
# comment saying what failed (python scripts/ci-triage.py <pr>), mentioning the ALERT_MENTION
# repository variable (e.g. a maintainer's login) when it is set.
#
# Every read is captured before it is tested: under `set -e` a failed gh call stops the
# run. (Piping gh into `grep -q` inside an `if` read a failed call as "no hold label".)
#
# The reads use GITHUB_TOKEN (RELEASE_PAT has no Checks permission, so the check-runs call
# returned 403). The merge uses the bot's token: the GitHub App's (BOT_APP_CLIENT_ID
# variable, BOT_APP_PRIVATE_KEY secret) when set, else RELEASE_PAT. A merge made with
# GITHUB_TOKEN would not start the push workflows (builds.yml, release.yml) on main.

on:
  workflow_run:
    workflows: [CI, "Compat - upgrade tests", "Build - Big Bang images"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.head_branch == 'bot/bigbang-update' ||
       github.event.workflow_run.head_branch == 'bot/bigbang-release' ||
       github.event.workflow_run.head_branch == 'bot/builds-update' ||
       github.event.workflow_run.head_branch == 'bot/builds-release') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write        # re-run a failed first attempt
      contents: read
      pull-requests: write  # the needs-attention label and comment
      checks: read
    steps:
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.blob.core.windows.net:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: Bot token (GitHub App)
        id: app
        if: vars.BOT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # main's scripts (ci-triage.py), never the pull request's: workflow_run runs with secrets,
      # so nothing from the bot branch is checked out or run here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Merge when every check on the head commit passed
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_PAT }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          MENTION: ${{ vars.ALERT_MENTION }}
          PATCHES: ${{ vars.AUTOMERGE_BIGBANG_PATCHES }}
        run: |
          set -euo pipefail
          [ -n "$MERGE_TOKEN" ] || { echo "::warning::no bot token (BOT_APP_CLIENT_ID or RELEASE_PAT); not merging"; exit 0; }

          pulls=$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100")
          pr=$(jq -r --arg b "$BRANCH" --arg s "$SHA" \
            '.[] | select(.head.ref == $b and .head.sha == $s) | .number' <<<"$pulls")
          if [ -z "$pr" ]; then
            echo "no open $BRANCH pull request at $SHA (a newer commit, or merged)"; exit 0
          fi
          labels=$(gh api "repos/$GH_REPO/issues/$pr/labels" --jq '.[].name')

          # Label the PR and say why, once (the label marks that it was said).
          attention() {
            echo "::warning::#$pr needs a person: $1"
            if grep -qx needs-attention <<<"$labels"; then return 0; fi
            gh api -X POST "repos/$GH_REPO/issues/$pr/labels" -f "labels[]=needs-attention" >/dev/null
            body="Auto-merge stopped: $1"$'\n\n'"Triage: \`python scripts/ci-triage.py $pr\` (AGENTS.md has the playbooks). Remove the \`needs-attention\` label once handled."
            [ -z "$MENTION" ] || body="$MENTION $body"
            gh api -X POST "repos/$GH_REPO/issues/$pr/comments" -f body="$body" >/dev/null
          }

          if grep -qx hold <<<"$labels"; then
            echo "#$pr is labeled hold"; exit 0
          fi

          # The PR must be the bot's own: one commit, touching only what update.yml writes.
          files=""; page=1
          while :; do
            batch=$(gh api "repos/$GH_REPO/pulls/$pr/files?per_page=100&page=$page" --jq '.[].filename')
            files+="$batch"$'\n'
            [ "$(grep -c . <<<"$batch" || true)" -lt 100 ] && break
            page=$((page + 1))
          done
          commits=$(gh api "repos/$GH_REPO/pulls/$pr/commits?per_page=100" --jq 'length')
          foreign=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$BRANCH:$f" in
              bot/builds-update:builds/*/build.yaml|bot/builds-release:builds/*/build.yaml) ;;
              bot/bigbang-*:BIGBANG_VERSION|bot/bigbang-*:discovery/images.json) ;;
              bot/bigbang-*:overlays/*.yaml|bot/bigbang-*:flux/kustomization.yaml) ;;
              bot/bigbang-*:flux-fips/kustomization.yaml|bot/bigbang-*:builds/*/build.yaml) ;;
              bot/bigbang-*:seaweedfs/*.yaml|bot/bigbang-*:seaweedfs-fips/*.yaml) ;;
              bot/bigbang-*:docs/images.md|bot/bigbang-*:docs/required-images.md) ;;
              bot/bigbang-*:docs/version-differences.md|bot/bigbang-*:docs/testing.md) ;;
              bot/bigbang-*:docs/test-results.json|bot/bigbang-release:docs/upgrades/*.md) ;;
              *) foreign+=" $f" ;;
            esac
          done <<<"$files"
          if [ -n "$foreign" ] || [ "$commits" != 1 ]; then
            attention "it isn't only the bot's commit ($commits commit(s); files update.yml doesn't write:${foreign:- none}). Fix on main instead; update.yml rebuilds this branch from main."
            exit 0
          fi
          # A new Big Bang release: a person merges it, unless it is a patch release (same
          # MAJOR.MINOR as main's) and AUTOMERGE_BIGBANG_PATCHES is `true`.
          if grep -qx BIGBANG_VERSION <<<"$files"; then
            if [ "$BRANCH" != bot/bigbang-release ]; then
              attention "it changes BIGBANG_VERSION, which only the release track (bot/bigbang-release) does."
              exit 0
            fi
            content=$(gh api "repos/$GH_REPO/contents/BIGBANG_VERSION?ref=$SHA" --jq .content)
            new=$(base64 -d <<<"$content" | tr -d '[:space:]')
            old=$(tr -d '[:space:]' < BIGBANG_VERSION)
            if [ "$PATCHES" != true ] || [ -z "$new" ] || [ "${old%.*}" != "${new%.*}" ]; then
              attention "it moves to Big Bang $new (from $old), which a person merges after reading the upgrade notes (docs/upgrades/$new.md) and the report in the PR body."
              exit 0
            fi
            echo "Big Bang $old -> $new is a patch release and AUTOMERGE_BIGBANG_PATCHES is true: merging it when green"
          fi

          # A kind test cut off by its time limit (repo1.dso.mil) ends the run as cancelled.
          # Re-run a first attempt only when ci-triage.py finds nothing but known flakes
          # (exit 2); a real failure (1) or a triage that couldn't tell (anything else) waits
          # for a person. CI_TRIAGE: the command, replaced by a stub in tests/test_automerge.py.
          if { [ "$CONCLUSION" = failure ] || [ "$CONCLUSION" = cancelled ] || [ "$CONCLUSION" = timed_out ]; } \
              && [ "$ATTEMPT" = 1 ]; then
            rc=0
            ${CI_TRIAGE:-python3 scripts/ci-triage.py} --run "$RUN" || rc=$?
            case "$rc" in
              2)
                echo "run $RUN failed on its first attempt, only on known flakes: re-running its failed jobs once"
                gh run rerun "$RUN" --failed ;;
              1)
                attention "$RUN_NAME failed, and ci-triage.py finds a real failure (not re-run; the log above has the evidence): $RUN_URL" ;;
              *)
                attention "$RUN_NAME failed, and ci-triage.py couldn't triage it (exit $rc), so it wasn't re-run: $RUN_URL" ;;
            esac
            exit 0
          fi
          if [ "$CONCLUSION" = failure ] || [ "$CONCLUSION" = cancelled ] || [ "$CONCLUSION" = timed_out ]; then
            attention "$RUN_NAME failed again after its re-run (attempt $ATTEMPT): $RUN_URL"
            exit 0
          fi

          # Every check run on the head commit, any workflow (the newest of each: the API's
          # default filter). Wait while any is unfinished; stop on any that didn't pass.
          # Skipped jobs count as passed. Pages by number: --paginate is fine here, but keep
          # one way of paging in this repo (scripts/ghrest.py).
          runs=""; page=1
          while :; do
            batch=$(gh api "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100&page=$page" \
              --jq '.check_runs[] | "\(.status) \(.conclusion // "-") \(.name)"')
            runs+="$batch"$'\n'
            [ "$(grep -c . <<<"$batch" || true)" -lt 100 ] && break
            page=$((page + 1))
          done
          runs=$(grep . <<<"$runs" || true)
          echo "$runs"
          [ -n "$runs" ] || { echo "no checks yet"; exit 0; }
          if grep -qv '^completed ' <<<"$runs"; then
            echo "checks still running on #$pr"; exit 0
          fi
          if grep -qvE '^completed (success|skipped|neutral) ' <<<"$runs"; then
            echo "::warning::#$pr has a failed check; not merging"; exit 0
          fi
          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$pr" --squash --delete-branch --match-head-commit "$SHA"
          echo "merged #$pr at $SHA"
