# Checks that the overlays still convert every image Big Bang deploys.
#
# 1. discovery/images.json matches a fresh render of Big Bang + every package
# 2. mapping.yaml covers every discovered image and each one has an org tag
# 3. the committed overlays match what bb-convert.py generates (newer org
#    patches only warn; the nightly update workflow picks them up)
# 4. Big Bang rendered with the overlays deploys only org images or documented
#    Iron Bank images, standard and FIPS
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Chainguard org (cgr.dev/<org>). Set the CHAINGUARD_ORG repository variable to
      # override the CHAINGUARD_ORG file without a commit.
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      # Registry of the images this repo builds (BUILD_REGISTRY file otherwise).
      BUILD_REGISTRY: ${{ vars.BUILD_REGISTRY }}
      # fluxrelease.py reads Flux releases from api.github.com; authenticated, the
      # parallel jobs don't share the anonymous rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Block every outbound call not listed (GitHub, PyPI, Chainguard, repo1/registry1,
      # and what this workflow's tools download). A blocked call fails the step and
      # shows up in the job's annotations: add the host here if it is expected.
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a  # v2.13.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.cgr.dev:443
            api.github.com:443
            cgr.dev:443
            codeload.github.com:443
            console-api.enforce.dev:443
            dl.enforce.dev:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            get.helm.sh:443
            ghcr.io:443
            github.com:443
            issuer.enforce.dev:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry1.dso.mil:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            repo1.dso.mil:443
            results-receiver.actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5.0.0
        with:
          version: v3.18.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Unit tests
        run: |
          python3 -m pip install --quiet pyyaml pytest
          python3 -m pytest -q tests

      - name: Log into Chainguard
        uses: chainguard-dev/setup-chainctl@be0acd273acf04bfdf91f51198327e719f6af978  # v0.4.0
        with:
          identity: ${{ secrets.CGR_ACTIONS_ID }}

      - name: Fetch Big Bang and its packages
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/bb-fetch.py

      - name: Discovery is current
        run: |
          python3 scripts/bb-images.py --bigbang work/bigbang --pkgs work/pkgs \
            --values discovery/render-inputs.yaml -o work/images.json
          diff -u discovery/images.json work/images.json

      - name: Shell and empty-default scan (sh is busybox on Chainguard -dev images)
        run: python3 scripts/bb-scan.py --pkgs work/pkgs --bigbang work/bigbang

      - name: Overlays are current
        run: |
          rc=0
          python3 scripts/bb-convert.py --check || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::warning::Newer org patches exist; the nightly update will refresh the overlays."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Verify standard images
        run: python3 scripts/bb-verify.py --bigbang work/bigbang --pkgs work/pkgs -o "${RUNNER_TEMP}/rendered.json"

      - name: Verify FIPS images
        run: python3 scripts/bb-verify.py --bigbang work/bigbang --pkgs work/pkgs --fips -o "${RUNNER_TEMP}/rendered-fips.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Chainguard signatures on every org image
        env:
          CHAINGUARD_ORG_ID: ${{ vars.CHAINGUARD_ORG_ID }}
        run: python3 scripts/bb-signatures.py "${RUNNER_TEMP}/rendered.json" "${RUNNER_TEMP}/rendered-fips.json"
