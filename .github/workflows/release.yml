# Cuts a versioned release (<Big Bang version>-cg.<n>) when main changes what users
# deploy: the overlays, Flux, SeaweedFS, the installer and the files it reads. The
# release holds the archive to install from, its sha256 and a keyless Sigstore signature
# (verifiable against this workflow), and notes with the image changes since the previous
# release (scripts/release.py). The signature is recorded in Sigstore's public log.
#
# It runs after CI, not on the push: a release is tagged only once CI's `verify` passed on
# that exact commit. workflow_run has no path filter, so release.py --after-ci decides:
# it releases only when a file in its DEPLOYABLE list changed since the previous release
# (docs-only and test-only commits cut none). Measuring from the last release, not the
# last commit, means a deployable change whose CI failed is released by the next commit
# that passes. workflow_run also fires again when CI is re-run, so a flaky `verify` that
# passes on re-run still releases. It waits on `verify` only (release.py reads that check
# run), not the whole CI conclusion: results-gate can be red on main while the overlays
# are fine.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Runs only from main (the job's `if`): the signature's identity names the ref, and
  # bb-install.py upgrade --to and docs/quickstart.md accept release.yml@refs/heads/main only.
  # A manual run releases main's HEAD whatever changed, still only after `verify` passed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # workflow_run: only CI runs for pushes to this repository's main. `branches: [main]`
    # alone also matches a pull request whose head branch is called main, from a fork.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a release takes about a minute
    permissions:
      contents: write   # the tag and the release
      id-token: write   # cosign keyless: the archive's signature names this workflow
      checks: read      # release.py reads CI's verify check run on the commit
    steps:
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: block
          # timestamp.sigstore.dev: cosign 3's sign-blob timestamps the signature with the
          # timestamp authority in Sigstore's signing config.
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The commit CI verified, not main's newest: main may have moved on since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0   # every tag, to number the release and diff against the last one
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          # Pinned: the installer's default moves with each release (4.1.3: cosign 3.1.4,
          # which deprecates the signing flags builds.yml uses). Same version in every
          # workflow (tests/test_repo_rules.py); raise it on purpose, with builds.yml's flags.
          cosign-release: v3.0.6

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 -m pip install --quiet -r requirements.txt
          if [ "$EVENT" = workflow_run ]; then
            python3 scripts/release.py --after-ci
          else
            python3 scripts/release.py --require-verify
          fi
