# Cuts a versioned release (<Big Bang version>-cg.<n>) when main changes what users
# deploy: the overlays, Flux, SeaweedFS, the installer and the files it reads. The
# release holds the archive to install from and notes with the image changes since the
# previous release (scripts/release.py).
name: Release

on:
  push:
    branches: [main]
    paths:
      - BIGBANG_VERSION
      - overlays/**
      - flux/**
      - flux-fips/**
      - seaweedfs/**
      - seaweedfs-fips/**
      - discovery/images.json
      - mapping.yaml
      - object-storage.yaml
      - orgs/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the tag and the release
    steps:
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # every tag, to number the release and diff against the last one
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/release.py
