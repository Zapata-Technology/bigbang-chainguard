# Build and smoke-test the Big Bang images this repo rebuilds FROM the org's
# images (builds/<name>/build.yaml, generated by scripts/bb-<name>.py):
#   grafana-plugins   Grafana with Iron Bank's plugin set
#   base              Big Bang's job base image (bash, kubectl, yq, jq, curl)
#   devops-tester     Big Bang's test runner (kubectl, velero, kyverno, chainsaw, mc)
#   vault             Chainguard Vault plus curl (Big Bang's post-start hook); built only
#                     once the mapping uses it (compat/vault-2.yaml tests it first)
#
# Pull requests build and test. A push to main (e.g. a merged nightly update) also
# pushes the images to the BUILD_REGISTRY repository variable when it is set; a
# manual run with push=true does the same. With the SIGN_IMAGES variable set to
# "keyless", each pushed image is signed with cosign keyless (GitHub OIDC) and gets
# an SPDX SBOM attestation. Keyless signing records the image name and digest in
# the public Sigstore transparency log (Rekor); leave it unset to skip signing.
name: Build - Big Bang images

on:
  pull_request:
    paths:
      - builds/**
      - scripts/bb-grafana-plugins.py
      - scripts/bb-base.py
      - scripts/bb-devops-tester.py
      - scripts/bb-vault.py
      - scripts/bbbuild.py
      - .github/workflows/builds.yml
  push:
    branches: [main]
    paths:
      - builds/**
      - scripts/bb-grafana-plugins.py
      - scripts/bb-base.py
      - scripts/bb-devops-tester.py
      - scripts/bb-vault.py
      - scripts/bbbuild.py
      - .github/workflows/builds.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push the images to BUILD_REGISTRY (ghcr.io/<owner> uses this repo's token)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [grafana-plugins, base, devops-tester, vault]
    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      BUILD_REGISTRY: ${{ vars.BUILD_REGISTRY }}
      PUSH: ${{ (inputs.push || (github.event_name == 'push' && vars.BUILD_REGISTRY != '')) && 'true' || '' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a  # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Log into Chainguard
        uses: chainguard-dev/setup-chainctl@be0acd273acf04bfdf91f51198327e719f6af978
        with:
          identity: ${{ secrets.CGR_ACTIONS_ID }}

      - name: Log into GHCR
        if: ${{ env.PUSH == 'true' && startsWith(vars.BUILD_REGISTRY, 'ghcr.io/') }}
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build and smoke-test (standard and FIPS)
        run: |
          python3 -m pip install --quiet pyyaml
          args=(--no-generate --build --test --built-file "${RUNNER_TEMP}/built.txt")
          [ "$PUSH" = true ] && args+=(--push --pushed-file "${RUNNER_TEMP}/pushed.txt")
          python3 "scripts/bb-${{ matrix.name }}.py" "${args[@]}"

      - name: Install grype
        if: ${{ hashFiles(format('{0}/built.txt', runner.temp)) != '' }}
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2

      # Chainguard bases are kept at zero known CVEs; what a build adds (packages,
      # plugin zips, upstream binaries) must not bring a fixable critical one.
      - name: Scan the built images (fail on fixable critical CVEs)
        if: ${{ hashFiles(format('{0}/built.txt', runner.temp)) != '' }}
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          rc=0
          while read -r image; do
            [ -n "$image" ] || continue
            echo "== $image"
            "$GRYPE" "docker:$image" --only-fixed --fail-on critical -o table || rc=1
          done < "${RUNNER_TEMP}/built.txt"
          exit $rc

      - name: Install cosign
        if: ${{ env.PUSH == 'true' && vars.SIGN_IMAGES == 'keyless' && hashFiles(format('{0}/pushed.txt', runner.temp)) != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft
        if: ${{ env.PUSH == 'true' && vars.SIGN_IMAGES == 'keyless' && hashFiles(format('{0}/pushed.txt', runner.temp)) != '' }}
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      - name: Sign and attest an SBOM (cosign keyless)
        if: ${{ env.PUSH == 'true' && vars.SIGN_IMAGES == 'keyless' && hashFiles(format('{0}/pushed.txt', runner.temp)) != '' }}
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          while read -r image; do
            [ -n "$image" ] || continue
            "$SYFT" "$image" -o spdx-json="${RUNNER_TEMP}/sbom.spdx.json"
            cosign sign --yes "$image"
            cosign attest --yes --type spdxjson --predicate "${RUNNER_TEMP}/sbom.spdx.json" "$image"
            echo "signed $image" >> "$GITHUB_STEP_SUMMARY"
          done < "${RUNNER_TEMP}/pushed.txt"
