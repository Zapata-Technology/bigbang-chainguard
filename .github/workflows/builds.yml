# Build and smoke-test the Big Bang images this repo rebuilds FROM the org's
# images (builds/<name>/build.yaml, generated by scripts/bb-build.py <name> from
# builds/<name>/recipe.yaml; the matrix below lists every recipe):
#   grafana-plugins   Grafana with Iron Bank's plugin set
#   base              Big Bang's job base image (bash, kubectl, yq, jq, curl)
#   devops-tester     Big Bang's test runner (kubectl, velero, kyverno, chainsaw, mc)
#   vault             Chainguard Vault plus curl (Big Bang's post-start hook); built only
#                     once the mapping uses it (compat/vault-2.yaml tests it first)
#   jmx-exporter      the Prometheus JMX javaagent jar, sh and curl (SonarQube's init container)
#   mattermost-operator  the Mattermost Operator built from upstream's source (Go)
#   tempo-query       Tempo's Jaeger storage backend built from upstream's source (Go)
#   minio-operator, minio-operator-sidecar  the MinIO Operator and its Tenant sidecar,
#                     built from upstream's (archived) source (Go)
#   gitaly-init-cgroups  GitLab's Gitaly cgroups init container, built from Gitaly's source (Go)
#   registry-adapter  NeuVector's Harbor scanner adapter built from upstream's source (Go, cgo)
#
# Pull requests build and test. A push to main (e.g. a merged nightly update) also
# pushes the images to the BUILD_REGISTRY repository variable when it is set; a
# manual run with push=true does the same. With the SIGN_IMAGES variable set to
# "keyless", each pushed image is signed with cosign keyless (GitHub OIDC) and gets
# SPDX SBOM and SLSA provenance attestations. Keyless signing records the image name and digest in
# the public Sigstore transparency log (Rekor); leave it unset to skip signing.
name: Build - Big Bang images

on:
  pull_request:
    paths:
      - builds/**
      - scripts/bb-build.py
      - scripts/bbbuild.py
      - scripts/buildhooks/**
      - scripts/bb-install.py
      - scripts/bbinstall/**
      - .dockerignore
      - .github/workflows/builds.yml
  push:
    branches: [main]
    paths:
      - builds/**
      - scripts/bb-build.py
      - scripts/bbbuild.py
      - scripts/buildhooks/**
      - scripts/bb-install.py
      - scripts/bbinstall/**
      - .dockerignore
      - .github/workflows/builds.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push the images to BUILD_REGISTRY (ghcr.io/<owner> uses this repo's token)
        type: boolean
        default: false
      force:
        description: Build every image, even one this org's mapping doesn't use yet (publish before switching to it)
        type: boolean
        default: false

# A new push to a pull request cancels that pull request's older run (only the newest
# commit's result matters, and every run costs runner minutes). Runs on
# main and schedules each get their own group (run_id), so none is cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [grafana-plugins, base, devops-tester, vault, jmx-exporter, mattermost-operator, tempo-query, minio-operator, minio-operator-sidecar, gitaly-init-cgroups, registry-adapter, installer]
    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      BUILD_REGISTRY: ${{ vars.BUILD_REGISTRY }}
      PUSH: ${{ (inputs.push || (github.event_name == 'push' && vars.BUILD_REGISTRY != '')) && 'true' || '' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      # Block every outbound call not listed (GitHub, PyPI, Chainguard, repo1/registry1,
      # and what this workflow's tools download). A blocked call fails the step and
      # shows up in the job's annotations: add the host here if it is expected.
      # proxy.golang.org serves module zips from storage.googleapis.com; grafana.com, the
      # Grafana plugins grafana-plugins installs; timestamp.sigstore.dev, the timestamp in
      # the Sigstore bundle cosign 3 signs and attests with (pushes to main only).
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.cgr.dev:443
            *.r2.cloudflarestorage.com:443
            api.github.com:443
            cgr.dev:443
            codeload.github.com:443
            console-api.enforce.dev:443
            dl.enforce.dev:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            gitlab.com:443
            grafana.com:443
            grype.anchore.io:443
            issuer.enforce.dev:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            proxy.golang.org:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry1.dso.mil:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            repo1.dso.mil:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            toolbox-data.anchore.io:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # grafana-plugins (standard and FIPS, each exported to a tarball for grype) filled the
      # runner's disk: grype failed with "no space left on device". Drop preinstalled
      # toolchains no build uses (~30 GB), as compat.yml does.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Log into Chainguard
        uses: chainguard-dev/setup-chainctl@bfe7503a12660737d9d66d02d2610a399d804316  # v0.6.0
        with:
          identity: ${{ secrets.CGR_ACTIONS_ID }}

      - name: Log into GHCR
        if: ${{ env.PUSH == 'true' && startsWith(vars.BUILD_REGISTRY, 'ghcr.io/') }}
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # Outputs, not hashFiles(): hashFiles only sees the workspace, never RUNNER_TEMP, so
      # the scan and signing steps were always skipped.
      - name: Build and smoke-test (standard and FIPS)
        id: build
        run: |
          python3 -m pip install --quiet -r requirements.txt
          args=(--build --test --built-file "${RUNNER_TEMP}/built.txt")
          # A new builder has no build.yaml until update.yml on main writes it together with
          # the overlays that use it (committed alone, bb-verify fails: the mapping says
          # `build:` but the overlays still name Iron Bank). Until then generate it here and
          # upload it for review; on main this publishes the image before the overlays
          # switch to it. Otherwise build exactly what is committed.
          if [ -f "builds/${{ matrix.name }}/build.yaml" ]; then
            args+=(--no-generate)
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
          # A pull request tests every builder, including one this org's mapping doesn't use;
          # main builds only what the mapping uses, unless a manual run sets force (to publish
          # an image before the mapping switches to it, so its kind tests can pull it).
          [ "${{ github.event_name }}" = pull_request ] || [ "${{ inputs.force }}" = true ] && args+=(--force)
          # Chainguard's package repository sometimes refuses one fetch ("Permission denied",
          # a network error), and a download's server can answer 5xx (grafana.com's plugin
          # downloads: "curl: (22) ... returned error: 500"): one more try then. Any other
          # failure is real and fails now.
          for try in 1 2; do
            : > "${RUNNER_TEMP}/built.txt"
            set +e
            python3 scripts/bb-build.py "${{ matrix.name }}" "${args[@]}" 2>&1 | tee "${RUNNER_TEMP}/build.log"
            rc=${PIPESTATUS[0]}
            set -e
            [ "$rc" = 0 ] && break
            if [ "$try" = 2 ] || ! grep -qE "ERROR: [^ ]+: (Permission denied|network error|temporary error|TLS handshake)|curl: \(22\) The requested URL returned error: 5[0-9][0-9]|proxy\.golang\.org/[^ ]*: stream error" \
                "${RUNNER_TEMP}/build.log"; then
              exit "$rc"
            fi
            echo "::warning::transient package fetch failure; building once more"
          done
          [ -s "${RUNNER_TEMP}/built.txt" ] && echo "built=true" >> "$GITHUB_OUTPUT" || true

      - name: Upload the generated build.yaml (for review)
        if: steps.build.outputs.generated == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-yaml-${{ matrix.name }}
          path: builds/${{ matrix.name }}/build.yaml
          if-no-files-found: error

      # grype's vulnerability database (~60-90 s to download), cached per UTC day. grype
      # still asks grype.anchore.io for a newer database before scanning and downloads
      # one if it exists, so the cache only skips re-downloading an unchanged one.
      - name: Day (grype database cache key)
        if: steps.build.outputs.built == 'true'
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: grype database (cached per day)
        if: steps.build.outputs.built == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ steps.day.outputs.day }}
          restore-keys: grype-db-

      - name: Install grype
        if: steps.build.outputs.built == 'true'
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2

      # Chainguard bases are kept at zero known CVEs; what a build adds (packages,
      # plugin zips, upstream binaries) must not bring a fixable critical one. It runs
      # before the push, so an image that fails it is never published.
      - name: Scan the built images (fail on fixable critical CVEs)
        if: steps.build.outputs.built == 'true'
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          rc=0
          while read -r image; do
            [ -n "$image" ] || continue
            echo "== $image"
            "$GRYPE" "docker:$image" --only-fixed --fail-on critical -o table || rc=1
          done < "${RUNNER_TEMP}/built.txt"
          exit $rc

      - name: Install cosign
        if: vars.SIGN_IMAGES == 'keyless' && env.PUSH == 'true' && steps.build.outputs.built == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          # Pinned: the installer's default moves with each release (4.1.3: cosign 3.1.4,
          # which deprecates the signing flags builds.yml uses). Same version in every
          # workflow (tests/test_repo_rules.py); raise it on purpose, with builds.yml's flags.
          cosign-release: v3.0.6

      # Signed before the tag moves: the installer's signature policy enforces by default,
      # so a tag pointing at an unsigned digest, even for a minute, refuses new Pods. Each
      # image goes up first as <tag>-staging, that digest is signed in both of cosign's
      # formats (the Sigstore bundle cosign 3 writes by default, and the classic .sig tag
      # Kyverno's verifyImages reads), and only then is <tag> pushed: the same image, so
      # the same, already signed digest.
      - name: Push to BUILD_REGISTRY (signed before the tag moves)
        if: env.PUSH == 'true' && steps.build.outputs.built == 'true'
        id: push
        env:
          SIGN: ${{ vars.SIGN_IMAGES == 'keyless' && 'true' || '' }}
        run: |
          # GHCR refuses the first push to a new package now and then ("denied"), and
          # takes it a little later.
          push() {
            for try in 1 2 3; do
              docker push "$1" && return 0
              [ "$try" = 3 ] && return 1
              echo "::warning::push of $1 refused; trying again in 30s"
              sleep 30
            done
          }
          # Sigstore's log (Rekor) sometimes stores an entry but answers too late; cosign's
          # own retry is then refused as a duplicate (409 createLogEntryConflict). A fresh
          # cosign run makes new ephemeral keys, so a new entry, and goes through.
          sigstore() {
            for try in 1 2 3; do
              cosign "$@" && return 0
              [ "$try" = 3 ] && return 1
              echo "::warning::cosign $1 failed; trying again in 20s"
              sleep 20
            done
          }
          while read -r image; do
            [ -n "$image" ] || continue
            if [ -n "$SIGN" ]; then
              staging="${image}-staging"
              docker tag "$image" "$staging"
              push "$staging"
              digest="${image%:*}@$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$staging" \
                | grep -m1 "^${image%:*}@" | cut -d@ -f2)"
              sigstore sign --yes "$digest"
              sigstore sign --yes --new-bundle-format=false --use-signing-config=false "$digest"
            fi
            push "$image"
            docker inspect --format '{{index .RepoDigests 0}}' "$image" >> "${RUNNER_TEMP}/pushed.txt"
          done < "${RUNNER_TEMP}/built.txt"
          [ -s "${RUNNER_TEMP}/pushed.txt" ] && echo "pushed=true" >> "$GITHUB_OUTPUT" || true

      - name: Install syft
        if: vars.SIGN_IMAGES == 'keyless' && steps.push.outputs.pushed == 'true'
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      # Signed at push (above); then an SBOM and SLSA provenance (scripts/bb-provenance.py:
      # run, commit and every pinned input).
      - name: Attest an SBOM and provenance (cosign keyless)
        if: vars.SIGN_IMAGES == 'keyless' && steps.push.outputs.pushed == 'true'
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          sigstore() {   # as in the push step: retry a late answer from Sigstore's log
            for try in 1 2 3; do
              cosign "$@" && return 0
              [ "$try" = 3 ] && return 1
              echo "::warning::cosign $1 failed; trying again in 20s"
              sleep 20
            done
          }
          while read -r image; do
            [ -n "$image" ] || continue
            "$SYFT" "$image" -o spdx-json="${RUNNER_TEMP}/sbom.spdx.json"
            python3 scripts/bb-provenance.py "${{ matrix.name }}" "$image" -o "${RUNNER_TEMP}/provenance.json"
            sigstore attest --yes --type spdxjson --predicate "${RUNNER_TEMP}/sbom.spdx.json" "$image"
            sigstore attest --yes --type slsaprovenance1 --predicate "${RUNNER_TEMP}/provenance.json" "$image"
            echo "signed $image (SBOM, provenance)" >> "$GITHUB_STEP_SUMMARY"
          done < "${RUNNER_TEMP}/pushed.txt"
