# Build and smoke-test the Big Bang images this repo rebuilds FROM the org's
# images (builds/<name>/build.yaml, generated by scripts/bb-<name>.py):
#   grafana-plugins   Grafana with Iron Bank's plugin set
#   base              Big Bang's job base image (bash, kubectl, yq, jq, curl)
# Pull requests and pushes only build and test. A manual run with push=true also
# pushes the standard and FIPS images to BUILD_REGISTRY.
name: Build - Big Bang images

on:
  pull_request:
    paths:
      - builds/**
      - scripts/bb-grafana-plugins.py
      - scripts/bb-base.py
      - scripts/bbbuild.py
      - .github/workflows/builds.yml
  push:
    branches: [main]
    paths:
      - builds/**
      - scripts/bb-grafana-plugins.py
      - scripts/bb-base.py
      - scripts/bbbuild.py
      - .github/workflows/builds.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push the images to BUILD_REGISTRY (ghcr.io/<owner> uses this repo's token)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [grafana-plugins, base]
    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      BUILD_REGISTRY: ${{ vars.BUILD_REGISTRY }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a  # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Log into Chainguard
        uses: chainguard-dev/setup-chainctl@be0acd273acf04bfdf91f51198327e719f6af978
        with:
          identity: ${{ secrets.CGR_ACTIONS_ID }}

      - name: Log into GHCR
        if: ${{ inputs.push }}
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build and smoke-test (standard and FIPS)
        env:
          PUSH: ${{ inputs.push && '--push' || '' }}
        run: |
          python3 -m pip install --quiet pyyaml
          python3 "scripts/bb-${{ matrix.name }}.py" --no-generate --build --test $PUSH
