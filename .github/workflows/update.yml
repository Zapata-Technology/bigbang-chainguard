# Nightly: move the overlays to the newest org patches, and to a new Big Bang
# release when one is out.
#
# A new Big Bang release re-runs discovery. If it deploys an image mapping.yaml
# does not cover, or one with no org tag, the pull request still opens with the
# failures in its body (and CI fails on it): add the mapping and push to the branch.
name: Update - Big Bang and Chainguard tags

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Chainguard org (cgr.dev/<org>). Set the CHAINGUARD_ORG repository variable to
      # override the CHAINGUARD_ORG file without a commit.
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      # Registry of the images this repo builds (BUILD_REGISTRY file otherwise).
      BUILD_REGISTRY: ${{ vars.BUILD_REGISTRY }}
      # fluxrelease.py reads Flux releases from api.github.com; authenticated, the
      # parallel jobs don't share the anonymous rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read   # compat.yml's result artifacts (docs/testing.md's results table)
    steps:
      # Block every outbound call not listed (GitHub, PyPI, Chainguard, repo1/registry1,
      # and what this workflow's tools download). A blocked call fails the step and
      # shows up in the job's annotations: add the host here if it is expected.
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.cgr.dev:443
            *.r2.cloudflarestorage.com:443
            api.github.com:443
            cgr.dev:443
            codeload.github.com:443
            console-api.enforce.dev:443
            dl.enforce.dev:443
            files.pythonhosted.org:443
            get.helm.sh:443
            ghcr.io:443
            github.com:443
            gitlab.com:443
            issuer.enforce.dev:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            proxy.golang.org:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry1.dso.mil:443
            release-assets.githubusercontent.com:443
            repo1.dso.mil:443
            results-receiver.actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.18.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Log into Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28  # v0.5.1
        with:
          identity: ${{ secrets.CGR_ACTIONS_ID }}

      - name: Newest Big Bang release
        id: bb
        run: |
          current=$(cat BIGBANG_VERSION)
          latest=""
          for i in 1 2 3 4; do   # repo1.dso.mil intermittently refuses GitHub runners
            latest=$(git ls-remote --tags https://repo1.dso.mil/big-bang/bigbang.git \
              | grep -oE 'refs/tags/[0-9]+\.[0-9]+\.[0-9]+$' | sed 's#refs/tags/##' | sort -V | tail -1) || true
            [ -n "$latest" ] && break
            sleep $((30 * i))
          done
          echo "current=$current latest=$latest"
          if [ -n "$latest" ] && [ "$latest" != "$current" ] \
             && [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            echo "$latest" > BIGBANG_VERSION
            echo "title=Big Bang $latest on Chainguard images" >> "$GITHUB_OUTPUT"
          else
            echo "title=update Chainguard tags in the Big Bang overlays" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover, convert, verify
        id: run
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/bb-fetch.py
          python3 scripts/bb-images.py --bigbang work/bigbang --pkgs work/pkgs \
            --values discovery/render-inputs.yaml -o discovery/images.json
          {
            echo '```'
            # The images this repo builds: re-read Iron Bank's recipes and re-pin the
            # org images they build FROM (new kubectl/Grafana patches, new plugins).
            # builds.yml builds them on this PR and pushes them once it merges. The
            # builders are independent (each writes only its builds/<name>/build.yaml and
            # mostly waits on the network), so they run in parallel; each one's output is
            # printed in order afterwards, with how long it took.
            if [ -n "$BUILD_REGISTRY" ]; then
              out="${RUNNER_TEMP}/builders"; mkdir -p "$out"
              start=$(date +%s)
              for b in grafana-plugins base devops-tester vault jmx-exporter mattermost-operator tempo-query minio-operator minio-operator-sidecar gitaly-init-cgroups; do
                ( s=$(date +%s); python3 "scripts/bb-$b.py" > "$out/$b.log" 2>&1 || true
                  echo "bb-$b.py: $(( $(date +%s) - s )) s" >> "$out/$b.log" ) &
              done
              wait
              for b in grafana-plugins base devops-tester vault jmx-exporter mattermost-operator tempo-query minio-operator minio-operator-sidecar gitaly-init-cgroups; do
                cat "$out/$b.log"
              done
              echo "builders (in parallel): $(( $(date +%s) - start )) s"
            fi
            python3 scripts/bb-convert.py 2>&1 || true
            python3 scripts/bb-verify.py --bigbang work/bigbang --pkgs work/pkgs 2>&1 || true
            python3 scripts/bb-verify.py --bigbang work/bigbang --pkgs work/pkgs --fips 2>&1 || true
            # A new Big Bang release can add bash-in-sh scripts or empty config defaults.
            python3 scripts/bb-scan.py --pkgs work/pkgs --bigbang work/bigbang 2>&1 || true
            # Iron Bank leftovers Chainguard now publishes (add them to the org).
            python3 scripts/bb-leftovers.py 2>&1 || true
            echo '```'
          } > "${RUNNER_TEMP}/report.md"
          cat "${RUNNER_TEMP}/report.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "body<<REPORT_EOF"
            cat "${RUNNER_TEMP}/report.md"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      # docs/testing.md's results table: the newest result of each kind test and mode from
      # compat.yml's runs on main (artifacts on api.github.com and its blob storage, both
      # allowed above). A download problem leaves the recorded results as they are.
      - name: Kind test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test-results.py update --from-main 20 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::test-results.py failed; docs/testing.md's results unchanged"

      - name: Open the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          # RELEASE_PAT lets CI run on the bot's pull request; GITHUB_TOKEN does not.
          token: ${{ secrets.RELEASE_PAT || github.token }}
          base: main
          branch: bot/bigbang-update
          delete-branch: true
          title: "chore: ${{ steps.bb.outputs.title }}"
          commit-message: "chore: ${{ steps.bb.outputs.title }}"
          add-paths: |
            BIGBANG_VERSION
            discovery/images.json
            overlays/*.yaml
            flux/kustomization.yaml
            flux-fips/kustomization.yaml
            docs/images.md
            docs/required-images.md
            docs/version-differences.md
            docs/testing.md
            docs/test-results.json
            builds/*/build.yaml
            seaweedfs/*.yaml
            seaweedfs-fips/*.yaml
          body: |
            Automated by `.github/workflows/update.yml`.

            ${{ steps.run.outputs.body }}
