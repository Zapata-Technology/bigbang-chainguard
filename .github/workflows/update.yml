# Nightly: move the overlays to the newest org patches, and to a new Big Bang
# release when one is out.
#
# A new Big Bang release re-runs discovery. If it deploys an image mapping.yaml
# does not cover, or one with no org tag, the pull request still opens with the
# failures in its body (and CI fails on it): add the mapping and push to the branch.
#
# An image this repo builds whose tag moves (Grafana 13.3.0 -> 13.3.1) can't be in the
# overlays until builds.yml has published it from main. scripts/bb-held-builds.py holds
# such a build.yaml back: the overlays stay on the published tag, and the build.yaml goes
# in its own pull request (bot/builds-update; automerge.yml merges it when green). Once
# builds.yml has published from main, this workflow runs again and moves the overlays.
name: Update - Big Bang and Chainguard tags

on:
  schedule:
    - cron: "17 3 * * *"   # off the hour: GitHub delays scheduled runs most at :00
  workflow_dispatch:
  # builds.yml finished on main: a held-back build may be published now.
  workflow_run:
    workflows: ["Build - Big Bang images"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    # After builds.yml only when it published (a push to main that succeeded).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      # Chainguard org (cgr.dev/<org>). Set the CHAINGUARD_ORG repository variable to
      # override the CHAINGUARD_ORG file without a commit.
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      # Registry of the images this repo builds (BUILD_REGISTRY file otherwise).
      BUILD_REGISTRY: ${{ vars.BUILD_REGISTRY }}
      # fluxrelease.py reads Flux releases from api.github.com; authenticated, the
      # parallel jobs don't share the anonymous rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read   # compat.yml's result artifacts (docs/testing.md's results table)
      packages: read  # bb-held-builds.py asks GHCR which build tags are published
    steps:
      # Block every outbound call not listed (GitHub, PyPI, Chainguard, repo1/registry1,
      # and what this workflow's tools download). A blocked call fails the step and
      # shows up in the job's annotations: add the host here if it is expected.
      - name: Harden the runner (block unlisted outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.cgr.dev:443
            *.r2.cloudflarestorage.com:443
            api.github.com:443
            cgr.dev:443
            codeload.github.com:443
            console-api.enforce.dev:443
            dl.enforce.dev:443
            files.pythonhosted.org:443
            get.helm.sh:443
            ghcr.io:443
            github.com:443
            gitlab.com:443
            issuer.enforce.dev:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            proxy.golang.org:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry1.dso.mil:443
            release-assets.githubusercontent.com:443
            repo1.dso.mil:443
            results-receiver.actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v3.18.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Log into Chainguard
        uses: chainguard-dev/setup-chainctl@bfe7503a12660737d9d66d02d2610a399d804316  # v0.6.0
        with:
          identity: ${{ secrets.CGR_ACTIONS_ID }}

      - name: Log into GHCR (which build tags are published)
        if: startsWith(vars.BUILD_REGISTRY, 'ghcr.io/')
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Newest Big Bang release
        id: bb
        run: |
          current=$(cat BIGBANG_VERSION)
          latest=""
          for i in 1 2 3 4; do   # repo1.dso.mil intermittently refuses GitHub runners
            latest=$(git ls-remote --tags https://repo1.dso.mil/big-bang/bigbang.git \
              | grep -oE 'refs/tags/[0-9]+\.[0-9]+\.[0-9]+$' | sed 's#refs/tags/##' | sort -V | tail -1) || true
            [ -n "$latest" ] && break
            sleep $((30 * i))
          done
          echo "current=$current latest=$latest"
          if [ -n "$latest" ] && [ "$latest" != "$current" ] \
             && [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            echo "$latest" > BIGBANG_VERSION
            echo "title=Big Bang $latest on Chainguard images" >> "$GITHUB_OUTPUT"
          else
            echo "title=update Chainguard tags in the Big Bang overlays" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover, convert, verify
        id: run
        run: |
          python3 -m pip install --quiet -r requirements.txt
          python3 scripts/bb-fetch.py
          python3 scripts/bb-images.py --bigbang work/bigbang --pkgs work/pkgs \
            --values discovery/render-inputs.yaml -o discovery/images.json
          {
            echo '```'
            # The images this repo builds (builds/<name>/recipe.yaml): re-read Iron Bank's
            # recipes and re-pin the org images they build FROM (new kubectl/Grafana patches,
            # new plugins). builds.yml builds them on this PR and pushes them once it merges.
            # The builds are independent (each writes only its builds/<name>/build.yaml and
            # mostly waits on the network), so they run in parallel; each one's output is
            # printed in order afterwards, with how long it took.
            if [ -n "$BUILD_REGISTRY" ]; then
              out="${RUNNER_TEMP}/builders"; mkdir -p "$out"
              start=$(date +%s)
              for b in grafana-plugins base devops-tester vault jmx-exporter mattermost-operator tempo-query minio-operator minio-operator-sidecar gitaly-init-cgroups registry-adapter; do
                ( s=$(date +%s); python3 scripts/bb-build.py "$b" > "$out/$b.log" 2>&1 || true
                  echo "bb-build.py $b: $(( $(date +%s) - s )) s" >> "$out/$b.log" ) &
              done
              wait
              for b in grafana-plugins base devops-tester vault jmx-exporter mattermost-operator tempo-query minio-operator minio-operator-sidecar gitaly-init-cgroups registry-adapter; do
                cat "$out/$b.log"
              done
              echo "builders (in parallel): $(( $(date +%s) - start )) s"
              # A moved tag builds.yml hasn't published yet: keep the overlays on the
              # published one; the new build.yaml goes in bot/builds-update below.
              held=$(python3 scripts/bb-held-builds.py hold "${RUNNER_TEMP}/held") || held=""
              if [ -n "$held" ]; then
                echo "held back until builds.yml publishes them from main (bot/builds-update):"
                echo "$held" | sed 's/^/  /'
                { echo "held<<HELD_EOF"; echo "$held"; echo "HELD_EOF"; } >> "$GITHUB_OUTPUT"
              fi
            fi
            python3 scripts/bb-convert.py 2>&1 || true
            python3 scripts/bb-verify.py --bigbang work/bigbang --pkgs work/pkgs 2>&1 || true
            python3 scripts/bb-verify.py --bigbang work/bigbang --pkgs work/pkgs --fips 2>&1 || true
            # A new Big Bang release can add bash-in-sh scripts or empty config defaults.
            python3 scripts/bb-scan.py --pkgs work/pkgs --bigbang work/bigbang 2>&1 || true
            # Iron Bank leftovers Chainguard now publishes (add them to the org).
            python3 scripts/bb-leftovers.py 2>&1 || true
            # The plan's per-tier room, and needed repositories that don't fit it.
            python3 scripts/bb-org-repos.py --quota 2>&1 || true
            echo '```'
          } > "${RUNNER_TEMP}/report.md"
          cat "${RUNNER_TEMP}/report.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "body<<REPORT_EOF"
            cat "${RUNNER_TEMP}/report.md"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      # docs/testing.md's results table: the newest result of each kind test and mode from
      # compat.yml's runs on main (artifacts on api.github.com and its blob storage, both
      # allowed above). A download problem leaves the recorded results as they are.
      - name: Kind test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test-results.py update --from-main 20 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::test-results.py failed; docs/testing.md's results unchanged"

      - name: Open the pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        with:
          # RELEASE_PAT lets CI run on the bot's pull request; GITHUB_TOKEN does not.
          token: ${{ secrets.RELEASE_PAT || github.token }}
          base: main
          branch: bot/bigbang-update
          delete-branch: true
          title: "chore: ${{ steps.bb.outputs.title }}"
          commit-message: "chore: ${{ steps.bb.outputs.title }}"
          add-paths: |
            BIGBANG_VERSION
            discovery/images.json
            overlays/*.yaml
            flux/kustomization.yaml
            flux-fips/kustomization.yaml
            docs/images.md
            docs/required-images.md
            docs/version-differences.md
            docs/testing.md
            docs/test-results.json
            builds/*/build.yaml
            seaweedfs/*.yaml
            seaweedfs-fips/*.yaml
          body: |
            Automated by `.github/workflows/update.yml`.

            ${{ steps.run.outputs.body }}

      # The held-back build.yaml files, alone: the overlays don't change, so this passes,
      # and once it merges builds.yml publishes the new tags and this workflow runs again.
      - name: Put the held-back builds back
        if: steps.run.outputs.held != ''
        run: python3 scripts/bb-held-builds.py restore "${RUNNER_TEMP}/held"

      - name: Open the builds pull request
        if: steps.run.outputs.held != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        with:
          token: ${{ secrets.RELEASE_PAT || github.token }}
          base: main
          branch: bot/builds-update
          delete-branch: true
          title: "chore: build the images built here at their new versions"
          commit-message: "chore: build the images built here at their new versions"
          add-paths: ${{ steps.run.outputs.held }}
          body: |
            Automated by `.github/workflows/update.yml`.

            These images' tags moved, and builds.yml publishes a tag only from main, so the
            overlays can't use them yet (`scripts/bb-held-builds.py`):

            ```
            ${{ steps.run.outputs.held }}
            ```

            Nothing deployed changes here. When this merges, builds.yml pushes and signs the
            new tags, then update.yml runs again and moves the overlays in `bot/bigbang-update`.
