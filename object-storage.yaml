# External S3 object storage for Big Bang (SeaweedFS, or any S3-compatible service)
# instead of the MinIO that Big Bang deploys or bundles. scripts/bb-object-storage.py
# fills the tokens below and writes an overlay. Checked against Big Bang 4.0.0's
# templates; recheck this file when BIGBANG_VERSION changes.
#
# Tokens:
#   {endpoint}         the URL as given, e.g. http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
#   {host}             the same without the scheme (host:port)
#   {region}           --region
#   {insecure}         true when the endpoint is http:// (a YAML boolean)
#   {ssl}              "true" when the endpoint is https://, else "false" (a string, for env values)
#   {prefix}           --bucket-prefix
#   {bucket:<name>}    <prefix>-<name>
#
# Credentials are never written. Each package lists the values that take an access
# key / secret under `credentials`; the site file sets them (`--credentials-template`
# writes a skeleton).

# Always applied: Big Bang's own MinIO packages stay off.
disable:
  packages.minio.enabled: false
  packages.minioOperator.enabled: false

packages:
  tempo:
    note: Traces go to S3 instead of local disk.
    values:
      packages.tempo.objectStorage: {endpoint: "{host}", region: "{region}", bucket: "{bucket:tempo}", insecure: "{insecure}"}
    credentials: [packages.tempo.objectStorage.accessKey, packages.tempo.objectStorage.accessSecret]
    buckets: [tempo]

  thanos:
    note: Thanos stores blocks in S3; with an endpoint set, Big Bang does not deploy its bundled MinIO.
    values:
      packages.thanos.objectStorage: {endpoint: "{host}", region: "{region}", bucket: "{bucket:thanos}", insecure: "{insecure}"}
      packages.thanos.values.minio.enabled: false
    credentials: [packages.thanos.objectStorage.accessKey, packages.thanos.objectStorage.accessSecret]
    buckets: [thanos]

  mimir:
    note: Mimir's blocks, ruler and alertmanager storage go to S3.
    values:
      packages.mimir.s3ObjectStorage: {enabled: true, endpoint: "{host}", region: "{region}", bucketName: "{bucket:mimir}", insecure: "{insecure}"}
      packages.mimir.values.upstream.minio.enabled: false
    credentials: [packages.mimir.s3ObjectStorage.accessKey, packages.mimir.s3ObjectStorage.accessSecret]
    buckets: [mimir]

  mattermost:
    note: Big Bang installs Mattermost's bundled MinIO unless endpoint, keys and bucket are all set.
    values:
      packages.mattermost.objectStorage: {endpoint: "{host}", bucket: "{bucket:mattermost}"}
      # The operator sets MM_FILESETTINGS_AMAZONS3SSL=true for every external file store
      # (false only for a MinIO it manages); the chart's env overrides it.
      packages.mattermost.values.mattermostEnvs.MM_FILESETTINGS_AMAZONS3SSL: "{ssl}"
    credentials: [packages.mattermost.objectStorage.accessKey, packages.mattermost.objectStorage.accessSecret]
    buckets: [mattermost]

  gitlab:
    note: >-
      GitLab's buckets are <prefix>-gitlab-*. type "minio" makes GitLab use path-style
      requests, which SeaweedFS needs.
    values:
      packages.gitlab.objectStorage: {type: minio, endpoint: "{endpoint}", region: "{region}", bucketPrefix: "{prefix}"}
    credentials: [packages.gitlab.objectStorage.accessKey, packages.gitlab.objectStorage.accessSecret]
    buckets: [gitlab-registry, gitlab-lfs, gitlab-artifacts, gitlab-uploads, gitlab-packages, gitlab-mr-diffs,
              gitlab-terraform-state, gitlab-dependency-proxy, gitlab-pseudo, gitlab-backup, gitlab-backup-tmp]

  velero:
    note: Backups go to S3 through the AWS plugin (path-style).
    values:
      packages.velero.values.upstream.configuration.backupStorageLocation:
        - name: default
          provider: aws
          bucket: "{bucket:velero}"
          config: {region: "{region}", s3ForcePathStyle: "true", s3Url: "{endpoint}"}
      # The chart's placeholder snapshot location has an empty credential; Flux keeps the
      # nulls and Velero's CRD rejects them (compat/velero.yaml). S3 holds backups only:
      # no volume snapshot locations.
      packages.velero.values.upstream.configuration.volumeSnapshotLocation: []
    credentials: [packages.velero.values.upstream.credentials.secretContents.cloud]
    buckets: [velero]

  loki:
    optional: true
    note: >-
      Off unless --with loki. Big Bang's default Loki (strategy monolith) keeps logs on
      local disk and deploys no MinIO. Object storage needs strategy scalable, which runs
      Loki's read, write and backend components separately.
    values:
      packages.loki.strategy: scalable
      packages.loki.objectStorage:
        endpoint: "{endpoint}"
        region: "{region}"
        bucketNames: {chunks: "{bucket:loki-chunks}", ruler: "{bucket:loki-ruler}", admin: "{bucket:loki-admin}"}
      packages.loki.values.minio.enabled: false
      packages.loki.values.loki.storage.s3.s3ForcePathStyle: true
      packages.loki.values.loki.storage.s3.insecure: "{insecure}"
    credentials: [packages.loki.objectStorage.accessKey, packages.loki.objectStorage.accessSecret]
    buckets: [loki-chunks, loki-ruler, loki-admin]
