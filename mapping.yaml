# Iron Bank repository (path after registry1.dso.mil/) -> Chainguard repository in
# cgr.dev/<org> (the org is set in CHAINGUARD_ORG; see the README). An org's own
# exceptions go in orgs/<org>.yaml, which replaces entries here for that org.
#
#   <ironbank path>: <chainguard name>            FIPS variant is <name>-fips
#   <ironbank path>: {cg: <name>, fips: <name>}   FIPS variant named differently
#   <ironbank path>: {cg: <name>, fips: null}     no FIPS variant; FIPS overlay keeps the standard image
#   <ironbank path>: {stays: <reason>}            no Chainguard equivalent; stays on Iron Bank
#   <ironbank path>: {stays: <reason>, until: <name>}  same, and bb-convert reports when the org's
#                                                 <name> repo has tags (ready to convert)
#   Options on a cg entry:
#     fallback: ironbank   keep Iron Bank's image (instead of failing) while the org has no usable tag
#     strict: true         never a newer MINOR than Iron Bank's (no "MINOR AHEAD") for this image
#     group: <name>        images that move together: all convert, or all stay on Iron Bank
#     version_from: <ironbank path>  match the Iron Bank tag of another image (e.g. its release)
#     same_patch: <name>   group members with the same name use one patch: the newest all have
#     min_version: <M.m>   an Iron Bank tag on an older line takes the newest release instead
#                          (end-of-life lines the org stops rebuilding)
#   <ironbank path>: {cg: <name>, tag: <tag>}     pin a tag instead of matching the Iron Bank version
#   <ironbank path>: {cg: <name>, version: <v>}   resolve against version <v> instead of the Iron Bank tag
#                                                 ("*": the org's newest release)
#   <ironbank path>: {build: <name>}              built FROM the org's images by this repo
#                                                 (builds/<name>/, pushed to BUILD_REGISTRY)
#   <ironbank path>: {ref: <full repo>, fips: <full repo>, tag: <tag>}   image outside the org
#
# bb-convert.py fails if a discovered image is not listed here, so a new Big Bang
# release that adds an image cannot slip through on registry1.
images:
  # --- Flux (base/flux kustomization) ---
  ironbank/fluxcd/helm-controller: flux-helm-controller
  ironbank/fluxcd/kustomize-controller: flux-kustomize-controller
  ironbank/fluxcd/notification-controller: flux-notification-controller
  ironbank/fluxcd/source-controller: flux-source-controller

  # --- Istio ---
  ironbank/opensource/istio/pilot: istio-pilot
  ironbank/opensource/istio/proxyv2: istio-proxy
  ironbank/opensource/istio/install-cni: istio-install-cni
  # ztunnel is off by default (Istio ambient mode only).
  ironbank/opensource/istio/ztunnel: {cg: ztunnel, fallback: ironbank}
  ironbank/istio-ecosystem/authservice: authservice

  # --- Kiali ---
  ironbank/opensource/kiali/kiali: kiali
  ironbank/opensource/kiali/kiali-operator: kiali-operator

  # --- Policy ---
  ironbank/opensource/kyverno: kyverno
  ironbank/opensource/kyverno/kyverno/background-controller: kyverno-background-controller
  ironbank/opensource/kyverno/kyverno/cleanup-controller: kyverno-cleanup-controller
  ironbank/opensource/kyverno/kyverno/reports-controller: kyverno-reports-controller
  ironbank/opensource/kyverno/kyverno/readiness-checker: kyverno-readiness-checker
  ironbank/opensource/kyverno/kyvernocli: kyverno-cli
  ironbank/opensource/kyverno/kyvernopre: {cg: kyvernopre, fips: null}
  ironbank/opensource/kyverno/policy-reporter: kyverno-policy-reporter
  ironbank/opensource/kyverno/policy-reporter/kyverno-plugin: kyverno-policy-reporter-plugin-kyverno
  ironbank/nirmata/policy-reporter/policy-reporter-ui: kyverno-policy-reporter-ui
  ironbank/opensource/openpolicyagent/gatekeeper: gatekeeper

  # --- Logging / tracing / metrics ---
  ironbank/opensource/grafana/alloy: grafana-alloy
  ironbank/opensource/grafana/alloy-operator: {cg: grafana-alloy-operator, version: "0.9"}   # Chainguard tags the operator release (0.9.x), Iron Bank the app (1.11)
  ironbank/opensource/grafana/helm-chart-toolbox-kubectl: {cg: kubectl, version: "1.34", suffix: dev}   # toolbox "1.0" is its own version, not kubectl's
  ironbank/opensource/grafana/loki: loki
  ironbank/bigbang/grafana/loki-canary: loki-canary
  ironbank/bigbang/grafana/loki-helm-test: {stays: "Big Bang test image (helm test only)"}
  ironbank/grafana/grafana-enterprise-logs: {stays: "Grafana Enterprise Logs is licensed; no Chainguard image"}
  ironbank/ironbank/opensource/grafana/enterprise-logs-provisioner: {stays: "Grafana Enterprise Logs is licensed; no Chainguard image"}
  ironbank/opensource/grafana/tempo: tempo
  # No Chainguard tempo-query image: scripts/bb-build.py tempo-query builds it from grafana/tempo's
  # source FROM the org's images; with BUILD_REGISTRY empty it stays on Iron Bank.
  ironbank/opensource/grafana/tempo-query: {build: tempo-query}
  ironbank/opensource/grafana/mimir: grafana-mimir
  ironbank/opensource/grafana/rollout-operator: grafana-rollout-operator
  ironbank/opensource/grafana/grafana-image-renderer: {cg: grafana-image-renderer, fips: null}
  # Big Bang builds Grafana with plugins baked in. scripts/bb-build.py grafana-plugins
  # rebuilds it FROM the org's grafana / grafana-fips images using Iron Bank's own
  # plugin list; with BUILD_REGISTRY empty it stays on Iron Bank.
  ironbank/big-bang/grafana/grafana-plugins: {build: grafana-plugins}
  ironbank/kiwigrid/k8s-sidecar: k8s-sidecar
  ironbank/opensource/fluent/fluent-bit: fluent-bit
  ironbank/opensource/prometheus/prometheus: prometheus
  ironbank/opensource/prometheus/alertmanager: prometheus-alertmanager
  ironbank/opensource/prometheus/node-exporter: prometheus-node-exporter
  ironbank/opensource/prometheus/blackbox_exporter: prometheus-blackbox-exporter
  ironbank/opensource/prometheus/snmp_exporter: {cg: prometheus-snmp-exporter, fips: null}
  ironbank/opensource/prometheus/memcached-exporter: memcached-exporter
  # SonarQube's JMX init container runs sh -c "curl file:///opt/jmx_exporter/jmx_prometheus_javaagent-<v>.jar";
  # Chainguard's jmx-exporter-iamguarded has the Bitnami layout and no sh or curl, so
  # scripts/bb-build.py jmx-exporter rebuilds Iron Bank's recipe (that jar, by sha256, at that
  # path) FROM the org's busybox -dev images with curl; with BUILD_REGISTRY empty it stays.
  ironbank/opensource/prometheus/jmx-exporter: {build: jmx-exporter}
  ironbank/opensource/prometheus-operator/prometheus-operator: prometheus-operator
  ironbank/opensource/prometheus-operator/prometheus-config-reloader: prometheus-config-reloader
  ironbank/opensource/kubernetes/kube-state-metrics: kube-state-metrics
  ironbank/opensource/kubernetes-sigs/metrics-server: metrics-server
  ironbank/opensource/thanos/thanos: thanos
  ironbank/opensource/jimmidyson/configmap-reload: configmap-reload
  ironbank/opensource/memcached/memcached: memcached
  # Bitnami's Redis chart (redis-bb) starts the exporter with /bin/bash -ec "redis_exporter ...":
  # it needs the Bitnami layout, which Chainguard ships as -iamguarded. The plain
  # prometheus-redis-exporter has no shell: redis-bb's StatefulSet failed (compat/argocd, harbor).
  ironbank/bitnami/analytics/redis-exporter: prometheus-redis-exporter-iamguarded
  ironbank/opensource/elasticsearch-exporter: prometheus-elasticsearch-exporter
  ironbank/afdco/prometheus/mysqld_exporter: prometheus-mysqld-exporter

  # --- Elastic ---
  ironbank/elastic/eck-operator/eck-operator: eck-operator
  ironbank/elastic/elasticsearch/elasticsearch: elasticsearch
  ironbank/elastic/kibana/kibana: kibana

  # --- Security ---
  ironbank/neuvector/neuvector/controller: neuvector-controller
  ironbank/neuvector/neuvector/enforcer: neuvector-enforcer
  ironbank/neuvector/neuvector/manager: neuvector-manager
  ironbank/neuvector/neuvector/scanner: neuvector-scanner
  ironbank/neuvector/neuvector/prometheus-exporter: neuvector-prometheus-exporter
  # No Chainguard registry-adapter image: scripts/bb-build.py registry-adapter builds it from
  # upstream's source FROM the org's images; with BUILD_REGISTRY empty it stays on Iron Bank.
  ironbank/opensource/neuvector/registry-adapter: {build: registry-adapter}
  ironbank/twistlock/console/console: {stays: "Prisma Cloud (Twistlock) is proprietary; vendor image only"}
  ironbank/twistlock/defender/defender: {stays: "Prisma Cloud (Twistlock) is proprietary; vendor image only"}
  ironbank/anchore/enterprise/enterprise: {stays: "Anchore Enterprise is proprietary; vendor image only"}
  ironbank/anchore/enterpriseui/enterpriseui: {stays: "Anchore Enterprise is proprietary; vendor image only"}
  ironbank/anchore/cli/cli: {stays: "Anchore CLI test image (bbtests only)"}
  ironbank/microfocus/fortify/ssc: {stays: "Fortify SSC is proprietary; vendor image only"}
  # Chainguard has no FIPS SonarQube. Tested on kind (compat/sonarqube-26.10.yaml).
  ironbank/sonarsource/sonarqube/sonarqube-community-build: {cg: sonarqube, suffix: community, fips: null}
  # Big Bang's vault post-start hook needs curl, which Chainguard's vault image lacks:
  # scripts/bb-build.py vault adds it. Chainguard carries Vault 2.x only (Big Bang pins
  # 1.21); tested on kind as a fresh install (compat/vault-2.yaml) and as an upgrade of
  # Iron Bank 1.21 data (compat/vault-upgrade.yaml, which needs an Iron Bank login).
  ironbank/hashicorp/vault: {build: vault}
  ironbank/hashicorp/vault/vault-k8s: vault-k8s
  ironbank/hashicorp/vault-csi-provider: vault-csi-provider
  ironbank/opensource/external-secrets/external-secrets: external-secrets

  # --- Certificates / identity ---
  ironbank/jetstack/cert-manager-controller: cert-manager-controller
  ironbank/jetstack/cert-manager-cainjector: cert-manager-cainjector
  ironbank/jetstack/cert-manager-webhook: cert-manager-webhook
  ironbank/opensource/jetstack/cert-manager-acmesolver: cert-manager-acmesolver
  ironbank/opensource/cleanstart/cert-manager-startupapicheck: cert-manager-startupapicheck
  ironbank/opensource/keycloak/keycloak: keycloak
  ironbank/opensource/dexidp/dex: dex

  # --- Apps ---
  ironbank/big-bang/argocd: argocd
  ironbank/opensource/headlamp-k8s/headlamp: headlamp
  ironbank/opensource/velero/velero: velero
  ironbank/opensource/velero/velero-plugin-for-aws: velero-plugin-for-aws
  ironbank/opensource/mattermost/mattermost: mattermost
  # No Chainguard mattermost-operator image: scripts/bb-build.py mattermost-operator builds it from
  # upstream's source FROM the org's images; with BUILD_REGISTRY empty it stays on Iron Bank.
  ironbank/opensource/mattermost/mattermost-operator: {build: mattermost-operator}
  ironbank/opensource/go-gitea/gitea: {stays: "org gitea is 28.x; Big Bang renovate pins 1.27 (test fixture)"}
  ironbank/opensource/apache/kafka-native: {cg: kafka-native, fips: null, fallback: ironbank}
  ironbank/container-hardening-tools/renovate/renovate: renovate
  ironbank/opensource/goharbor/harbor-core: harbor-core
  ironbank/opensource/goharbor/harbor-exporter: harbor-exporter
  ironbank/opensource/goharbor/harbor-jobservice: harbor-jobservice
  ironbank/opensource/goharbor/harbor-portal: harbor-portal
  ironbank/opensource/goharbor/harbor-registryctl: harbor-registryctl
  ironbank/opensource/goharbor/registry: harbor-registry
  ironbank/opensource/goharbor/trivy-adapter: harbor-trivy-adapter

  # MinIO (minio, mattermost's bundled minio, bucket-init jobs). Iron Bank pins
  # RELEASE.<date> tags, which have no MAJOR.MINOR line to match, so these take the
  # org's newest release (docs/images.md flags it).
  ironbank/opensource/minio/minio: {cg: minio, version: "*"}
  ironbank/opensource/minio/mc: {cg: minio-client, version: "*"}
  # No Chainguard MinIO Operator images: scripts/bb-build.py minio-operator and
  # minio-operator-sidecar build both from minio/operator's source (archived upstream
  # and on Iron Bank) FROM the org's images; with BUILD_REGISTRY empty they stay on Iron Bank.
  ironbank/opensource/minio/operator: {build: minio-operator}
  ironbank/opensource/minio/operator-sidecar: {build: minio-operator-sidecar}

  # --- Shared building blocks ---
  # Big Bang's jobs run kubectl scripts with /bin/bash; Chainguard's kubectl has no
  # shell, its -dev variant has (compat/headlamp.yaml: wait job failed, then passed).
  # Vault pins kubectl 1.30, end of life: the org's 1.30 FIPS image had 19 Critical CVEs
  # (cve-report 2026-10-30), and kubectl must be within one minor of the cluster
  # (Kubernetes 1.34+). Below 1.34, use the newest release.
  ironbank/opensource/kubernetes/kubectl: {cg: kubectl, suffix: dev, min_version: "1.34"}
  ironbank/opensource/postgres/postgresql: postgres
  ironbank/opensource/redis/redis8-slim: redis
  # Argo CD's redis-ha (off in Big Bang): HAProxy when redis-ha.haproxy is enabled, and
  # shellcheck for redis-ha's `helm test` only (not in the org; APPLICATION quota is full).
  # haproxy-fips is in the catalog but not the org (FIPS quota full): FIPS keeps haproxy.
  ironbank/opensource/haproxy/haproxy-latest: {cg: haproxy, fips: null}
  ironbank/opensource/shellcheck/shellcheck: {stays: "redis-ha's helm test image (helm test only)", until: shellcheck}
  ironbank/opensource/nginx/nginx: nginx
  ironbank/opensource/mysql/mysql8: mysql
  ironbank/afdco/docker/busybox: busybox
  # Big Bang's own job base image (bash + kubectl + yq + jq on UBI). scripts/bb-build.py base
  # rebuilds it FROM the org's kubectl -dev images; with BUILD_REGISTRY empty it stays.
  ironbank/big-bang/base: {build: base}
  ironbank/redhat/ubi/ubi9: {stays: "Red Hat UBI base; GitLab and Fortify scripts expect UBI userland"}
  ironbank/redhat/ubi/ubi9-minimal: {stays: "Red Hat UBI base; GitLab and Fortify scripts expect UBI userland"}

  # --- Big Bang CI test images (bbtests, disabled by default) ---
  ironbank/big-bang/cypress: {stays: "Big Bang CI test image (bbtests); built on cypress/included, which Chainguard does not publish"}
  # scripts/bb-build.py devops-tester rebuilds it FROM the org's kubectl -dev images.
  ironbank/big-bang/devops-tester: {build: devops-tester}
  ironbank/opensource/bats/bats: bats

  # --- GitLab (CNG images, versioned together) ---
  # Chainguard publishes the GitLab CNG images (the EE ones as commercial-gitlab-*-ee).
  # They move as one release: `group` keeps every image on Iron Bank until the org
  # has all of them on Big Bang's GitLab line (`strict`: never a newer minor), and
  # `fallback` keeps them there instead of failing while the org lacks them.
  # Chainguard tags every image with the GitLab release, so the images Iron Bank
  # tags with their own version (registry, shell, exporter) match on gitlab-base's
  # tag. mail_room and kubectl carry their own versions on Chainguard: newest.
  # same_patch: rails pins the Rails images (one codebase, one database schema) and
  # gitlab-base to the newest patch all of them have, standard and FIPS.
  gitlab/gitlab-org/build/cng/certificates: &gitlab {group: gitlab, strict: true, fallback: ironbank, cg: gitlab-certificates}
  gitlab/gitlab-org/build/cng/cfssl-self-sign: {<<: *gitlab, cg: cfssl-self-sign}
  gitlab/gitlab-org/build/cng/gitaly: {<<: *gitlab, cg: gitaly}
  gitlab/gitlab-org/build/cng/gitlab-base: {<<: *gitlab, same_patch: rails, cg: gitlab-base}
  gitlab/gitlab-org/build/cng/gitlab-container-registry: {<<: *gitlab, cg: gitlab-container-registry, version_from: gitlab/gitlab-org/build/cng/gitlab-base}
  gitlab/gitlab-org/build/cng/gitlab-exporter: {<<: *gitlab, cg: gitlab-exporter, version_from: gitlab/gitlab-org/build/cng/gitlab-base}
  gitlab/gitlab-org/build/cng/gitlab-geo-logcursor: {<<: *gitlab, same_patch: rails, cg: commercial-gitlab-geo-logcursor-ee}
  gitlab/gitlab-org/build/cng/gitlab-kas: {<<: *gitlab, cg: gitlab-kas}
  gitlab/gitlab-org/build/cng/gitlab-mailroom: {<<: *gitlab, cg: gitlab-mailroom, version: "*"}
  gitlab/gitlab-org/build/cng/gitlab-pages: {<<: *gitlab, cg: gitlab-pages}
  gitlab/gitlab-org/build/cng/gitlab-shell: {<<: *gitlab, cg: gitlab-shell, version_from: gitlab/gitlab-org/build/cng/gitlab-base}
  gitlab/gitlab-org/build/cng/gitlab-sidekiq-ee: {<<: *gitlab, same_patch: rails, cg: commercial-gitlab-sidekiq-ee}
  gitlab/gitlab-org/build/cng/gitlab-toolbox-ee: {<<: *gitlab, same_patch: rails, cg: commercial-gitlab-toolbox-ee}
  gitlab/gitlab-org/build/cng/gitlab-webservice-ee: {<<: *gitlab, same_patch: rails, cg: commercial-gitlab-webservice-ee}
  gitlab/gitlab-org/build/cng/gitlab-workhorse-ee: {<<: *gitlab, same_patch: rails, cg: commercial-gitlab-workhorse-ee}
  gitlab/gitlab-org/build/cng/kubectl: {<<: *gitlab, cg: gitlab-kubectl, version: "*"}
  # No Chainguard gitaly-init-cgroups image (Gitaly's cgroups init container, off by
  # default): scripts/bb-build.py gitaly-init-cgroups builds it from Gitaly's source as GitLab's
  # CNG does, FROM the org's images; with BUILD_REGISTRY empty it stays on registry1.
  gitlab/gitlab-org/build/cng/gitaly-init-cgroups: {build: gitaly-init-cgroups}
  # No Chainguard equivalent; Iron Bank's images at the same GitLab release.
  gitlab/gitlab-org/build/cng/gitlab-zoekt: {stays: "no Chainguard gitlab-zoekt image (code search, off by default)", until: gitlab-zoekt}
  gitlab/gitlab-org/build/cng/gitlab-openbao: {stays: "GitLab's own OpenBao build; Chainguard's openbao is upstream's"}
  gitlab/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/model-gateway: {stays: "GitLab AI gateway; GitLab-built only"}
  gitlab/gitlab-org/gitlab-runner: gitlab-runner
  gitlab/gitlab-org/gitlab-runner/gitlab-runner-helper: gitlab-runner-helper

# Istio builds image names from `hub`, and Chainguard names its Istio images
# differently (istio-pilot, istio-proxy, ...). Istio uses `image` as-is when it
# contains a "/", so the overlay sets full references at these paths instead.
hubs:
  istiod:
    upstream.image: ironbank/opensource/istio/pilot
    # The sidecar proxy is set in overrides.istiod: istio-init takes its image from
    # global.hub + proxy.image + global.tag, not from a full proxy.image reference.
  istio-cni:
    upstream.image: ironbank/opensource/istio/install-cni
  ztunnel:
    upstream.image: ironbank/opensource/istio/ztunnel

# Big Bang keys whose chart values sit below `values` (Big Bang key: sub-path).
value_roots:
  packages.istioGateway: shared      # merged into every gateway release by Big Bang

# Images that a package template hardcodes as a default (no value in values.yaml),
# with the value path that overrides it. Applied to any release that renders one.
# `beside`: values set next to that path in the same releases. `patch_keys`: Big Bang keys
# whose chart schema refuses those values; they get `patch` (a Flux post-renderer) instead.
template_defaults:
  - image: ironbank/opensource/kubernetes/kubectl
    path: waitJob.image          # Big Bang gluon bb-wait job: dig "image" ... .Values.waitJob
    # gluon sets no seccomp profile on the wait job unless asked, so Pod Security Admission's
    # `restricted` level (RKE2's CIS profile) refused it and kyverno-policies never finished
    # installing (rke2.yml). Every package with a wait job gets RuntimeDefault.
    beside: {seccompProfile: {type: RuntimeDefault}}
    patch_keys: [packages.istioGateway]   # its values.schema.json allows only waitJob.enabled/image/permissions
    patch:
      target: {kind: Job, name: .*-wait-job}
      patch: '[{"op": "add", "path": "/spec/template/spec/securityContext/seccompProfile", "value": {"type": "RuntimeDefault"}}]'

# Hand-written values for packages whose image settings the generic rules can't
# express. Merged over the generated overrides. Tokens are resolved against live
# org tags: @repo:<name>, @tag:<name>:<version|*>, @ref:<name>:<version|*>,
# @registry (cgr.dev/<org>)
# (FIPS overlay: <name> becomes <name>-fips).
overrides:
  # Istio's gateway chart gives its pods no seccomp profile, so Pod Security Admission's
  # `restricted` level (RKE2's CIS profile) refused every gateway pod (rke2.yml). Setting
  # securityContext replaces the chart's default, so the default's sysctl stays.
  public-ingressgateway: &gateway-pod-security
    upstream:
      securityContext:
        sysctls: [{name: net.ipv4.ip_unprivileged_port_start, value: "0"}]
        seccompProfile: {type: RuntimeDefault}
  passthrough-ingressgateway: *gateway-pod-security
  istiod:
    # Injected sidecars: istio-proxy uses proxy.image, istio-init uses proxy_init.image
    # (default "proxyv2", built as hub/proxyv2:tag), and both fall back to hub and tag.
    # compat/kiali.yaml found istio-init on Iron Bank's, then on cgr.dev/<org>/proxyv2.
    upstream:
      global:
        hub: "@registry"
        proxy: {image: "@repo:istio-proxy"}
        proxy_init: {image: "@ref:istio-proxy:ib=ironbank/opensource/istio/pilot"}
        tag: "@tag:istio-proxy:ib=ironbank/opensource/istio/pilot"   # same Istio release; the proxy is only injected, never rendered
  neuvector:
    # NeuVector builds "<registry>/<repository>:<tag>" from one chart-wide registry
    # and tag; Chainguard's scanner is versioned on its own (4.x, not Iron Bank's 6).
    upstream:
      registry: "@registry"
      tag: "@tag:neuvector-controller:5.6"
      controller: {image: {repository: "@repo:neuvector-controller"}}
      enforcer: {image: {repository: "@repo:neuvector-enforcer"}}
      manager: {image: {repository: "@repo:neuvector-manager"}}
      cve:
        scanner: {image: {registry: "", repository: "@repo:neuvector-scanner", tag: "@tag:neuvector-scanner:*"}}
    # The monitor subchart builds the exporter's image from its own chart-wide registry
    # (monitor.registry) and ignores exporter.image.registry, so the generated blank
    # registry rendered "/neuvector-prometheus-exporter:<tag>" (compat/neuvector.yaml).
    monitor:
      registry: "@registry"
  gitlab:
    # GitLab's chart sets GODEBUG=tlsmlkem=0,tlskyber=0 on every container unless the site
    # sets GODEBUG. Chainguard builds Gitaly, GitLab Shell and the registry with a Go that
    # removed tlskyber, and Go refuses to start with a removed setting ("fatal error:
    # removed GODEBUG \"tlskyber\" set to old value", compat/gitlab.yaml). Keep the chart's
    # intent (no ML-KEM key exchange) with the setting current Go has.
    global:
      extraEnv:
        GODEBUG: tlsmlkem=0
  grafana:
    # builds/grafana-plugins rebuilds the Redis datasource's Go backend from source (its
    # release ships Go 1.19 binaries with 8 fixable Critical CVEs) and drops the signed
    # MANIFEST.txt the new binary no longer matches. Grafana loads an unsigned plugin only
    # when allowed by id; this allows that one. Big Bang provisions Redis datasources
    # itself (Argo CD, AuthService, GitLab). With Iron Bank's signed image it changes nothing.
    #
    # k8s-sidecar 2.14 (Big Bang 4.0) starts a health server in each sidecar on HEALTH_PORT,
    # default 8080. Grafana chart 14.2.0 sets HEALTH_PORT only on the init containers, so the
    # dashboards and datasources sidecars share a pod and both bind 8080: the second logs
    # "OSError: [Errno 98] Address already in use" and runs without a health server
    # (compat/release-upgrade.yaml). The Iron Bank image is the same 2.14.1. These are the
    # chart's own per-sidecar ports.
    upstream:
      grafana.ini:
        plugins:
          allow_loading_unsigned_plugins: redis-datasource
      sidecar:
        dashboards:
          env: {HEALTH_PORT: "8084"}
        datasources:
          env: {HEALTH_PORT: "8082"}
  gitlab-runner:
    # The runner chart mounts its writable config directory at
    # /home/gitlab-runner/.gitlab-runner, the home of Iron Bank's gitlab-runner user. The
    # Chainguard image's user has another home, so the runner wrote to /.gitlab-runner and
    # crashed after registering ("PANIC: creating directory: mkdir /.gitlab-runner:
    # permission denied", compat/gitlab-runner.yaml); on restart it registered again and
    # GitLab rate-limited it. Point HOME at the mounted directory's parent.
    upstream:
      extraEnv:
        HOME: /home/gitlab-runner
  keycloak:
    # Big Bang's Keycloak chart runs as uid/gid 1000 (Iron Bank's keycloak user). Chainguard's
    # image has its own user, and its Keycloak files aren't readable by uid 1000 (since
    # the 2026-10-30 rebuild of 26.8.1: "AccessDeniedException ... quarkus-application.dat",
    # compat/keycloak.yaml). Unset both so the container runs as the image's user;
    # runAsNonRoot stays, and fsGroup keeps volumes writable.
    upstream:
      podSecurityContext: {runAsUser: null, runAsGroup: null}
      securityContext: {runAsUser: null, runAsGroup: null}
  kyverno:
    # Kyverno's reports controller runs at the chart's 128Mi limit. Upgrading from Big Bang
    # 3 to 4 replaces every ClusterPolicy with a CEL ValidatingPolicy, and the controller
    # rebuilds every report at once: it was OOMKilled in 2 of 3 FIPS release-upgrade runs
    # (compat/release-upgrade.yaml) and once on the FIPS kernel. Requests stay the chart's.
    upstream:
      reportsController:
        resources:
          limits: {memory: 256Mi}
  monitoring:
    # The SNMP exporter chart reads pull secrets from its top-level imagePullSecrets;
    # Big Bang sets snmpExporter.image.imagePullSecrets, which nothing reads, so the pod
    # pulled the org's private image anonymously and never started ("failed to fetch
    # anonymous token", compat/monitoring.yaml). The Iron Bank image has the same problem.
    snmpExporter:
      imagePullSecrets: [{name: private-registry}]
  thanos:
    # Thanos Query's default DNS resolver (miekgdns) found no address for its store
    # endpoints on a cluster whose nodes add a search domain (CI's Azure runners; AKS does
    # too): it tries the search domains first (ndots:5) and stops at the first empty
    # NOERROR answer, so Query had no stores ("IP address lookup yielded no results",
    # compat/thanos.yaml). Go's resolver finds them. Not image-specific: Iron Bank's
    # Thanos has the same default.
    upstream:
      query:
        extraFlags: [--store.sd-dns-resolver=golang]

# Images a package template hardcodes with no value to override (Big Bang key:
# Iron Bank repos). bb-convert writes a Flux postRenderers kustomize image rewrite.
# Workload labels that must state the image version actually deployed (Big Bang key:
# {Kind/name: Iron Bank repo whose converted tag is the version}). Istio gateways' wait
# job requires the proxy tag to equal istiod's app.kubernetes.io/version, which the chart
# sets to its own appVersion (Iron Bank's 1.31.1), while the org runs a newer patch
# (1.31.3): compat/kiali.yaml's gateway wait job restarted the gateway until it failed.
version_labels:
  packages.istiod:
    Deployment/istiod: ironbank/opensource/istio/pilot

# Wait jobs (Big Bang key: [Job names]) whose script starts #!/bin/sh but is bash
# (arrays). Iron Bank's kubectl is UBI, where sh is bash; the Chainguard -dev image's sh
# is busybox, so the script dies on its first line. bb-convert writes a Flux
# post-renderer that runs the job's scripts with bash. Found by compat/kyverno-enforce.yaml.
bash_wait_jobs:
  packages.kyvernoPolicies: [kyverno-kyverno-policies-wait-job]

# Containers (Big Bang key: [{kind, name regex, container: containers/<i> or
# initContainers/<i>}]) whose command is
# /bin/sh -c with a bash script, on an image whose sh is busybox once converted: the
# post-renderer makes the command /bin/bash. Found by scanning every package chart for
# bash-only syntax run by sh. (Images this repo builds, like bigbang-base, link sh to
# bash as UBI does, so jobs on them need no entry.)
bash_commands:
  packages.fortify:
    - {kind: Job, name: .*-keystore-job, container: containers/0}   # secret-creator: kubectl, REQUIRED_KEYS=( ... )

# Images this repo builds in a chart that prefixes every image with one chart-wide
# registry (Big Bang key: [Iron Bank repos]). NeuVector's registry-adapter template ignores
# cve.adapter.image.registry and uses `registry`, which the overlay sets to the org's, so it
# rendered cgr.dev/<org>/bigbang-registry-adapter (compat/registry-adapter.yaml).
# bb-convert writes a Flux postRenderers kustomize rewrite to BUILD_REGISTRY, or, with no
# BUILD_REGISTRY (the image stays on Iron Bank), from cgr.dev/<org>/ironbank/... back to registry1.
chart_registry_builds:
  packages.neuvector:
    - ironbank/opensource/neuvector/registry-adapter

post_renderers:
  packages.fortify:
    - ironbank/opensource/kubernetes/kubectl   # templates/keystore-job.yaml

# Value paths that hold Iron Bank strings but are not images to replace.
ignore:
  - {release: neuvector, path: upstream.controller.image}  # set by overrides.neuvector
  - {release: neuvector, path: upstream.enforcer.image}
  - {release: neuvector, path: upstream.manager.image}
  - {release: neuvector, path: upstream.cve.scanner.image}
  - {release: gatekeeper, path: upstream.image.crdRepository}  # upstream gatekeeper-crds hook, disabled by Big Bang
  - {release: kyverno-policies, path: policies}          # image patterns in policy parameters
  - {release: kyverno-policies, path: celPoliciesBeta}
  - {release: twistlock, path: console.trustedImages}    # Prisma trusted-registry rules

# Big Bang keys whose HelmRelease template can't take post-renderers (bb-scan.py finds
# them): bb-convert gives them none, so their images stay on tags (no digest pin).
no_post_renderers:
  packages.keycloak: Big Bang 4.0.0's keycloak/helmrelease.yaml writes postRenderers without the key

# Org images that stay on their exact tag instead of a digest pin (release: {org repo: why}).
# bb-verify.py fails on any other org image without a digest.
unpinned:
  istiod:
    istio-proxy: injected into pods from istiod's ConfigMap, which a post-renderer can't reach
  mattermost:
    kubectl: its two wait jobs run two kubectl lines (1.36, 1.37); kustomize pins one digest per name
  argocd:
    redis: redis (8.10) and redis-ha (8.8, off in Big Bang) name two redis lines; kustomize pins one digest per name

# scripts/bb-scan.py findings (chart file or default: how it is handled). CI fails on a
# finding not listed here, so each new Big Bang release gets the same review.
scan_reviewed:
  bigbang/templates/keycloak/helmrelease.yaml: no_post_renderers (Keycloak's images stay on tags)
  packages.kyvernoPolicies/chart/wait/wait.sh: bash_wait_jobs (wait job runs the script with bash)
  packages.alloy/chart/templates/bigbang/upgrade/post-upgradeJob.yaml: runs on bigbang-base, whose sh is bash
  packages.fortify/chart/templates/keystore-job.yaml: bash_commands (secret-creator runs /bin/bash)
