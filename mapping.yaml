# Iron Bank repository (path after registry1.dso.mil/) -> Chainguard repository in
# cgr.dev/<org> (the org is set in CHAINGUARD_ORG; see the README). An org's own
# exceptions go in orgs/<org>.yaml, which replaces entries here for that org.
#
#   <ironbank path>: <chainguard name>            FIPS variant is <name>-fips
#   <ironbank path>: {cg: <name>, fips: <name>}   FIPS variant named differently
#   <ironbank path>: {cg: <name>, fips: null}     no FIPS variant; FIPS overlay keeps the standard image
#   <ironbank path>: {stays: <reason>}            no Chainguard equivalent; stays on Iron Bank
#   <ironbank path>: {stays: <reason>, until: <name>}  same, and bb-convert reports when the org's
#                                                 <name> repo has tags (ready to convert)
#   Options on a cg entry:
#     fallback: ironbank   keep Iron Bank's image (instead of failing) while the org has no usable tag
#     strict: true         never a newer MINOR than Iron Bank's (no "MINOR AHEAD") for this image
#     group: <name>        images that move together: all convert, or all stay on Iron Bank
#     version_from: <ironbank path>  match the Iron Bank tag of another image (e.g. its release)
#   <ironbank path>: {cg: <name>, tag: <tag>}     pin a tag instead of matching the Iron Bank version
#   <ironbank path>: {cg: <name>, version: <v>}   resolve against version <v> instead of the Iron Bank tag
#                                                 ("*": the org's newest release)
#   <ironbank path>: {build: <name>}              built FROM the org's images by this repo
#                                                 (builds/<name>/, pushed to BUILD_REGISTRY)
#   <ironbank path>: {ref: <full repo>, fips: <full repo>, tag: <tag>}   image outside the org
#
# bb-convert.py fails if a discovered image is not listed here, so a new Big Bang
# release that adds an image cannot slip through on registry1.
images:
  # --- Flux (base/flux kustomization) ---
  ironbank/fluxcd/helm-controller: flux-helm-controller
  ironbank/fluxcd/kustomize-controller: flux-kustomize-controller
  ironbank/fluxcd/notification-controller: flux-notification-controller
  ironbank/fluxcd/source-controller: flux-source-controller

  # --- Istio ---
  ironbank/opensource/istio/pilot: istio-pilot
  ironbank/opensource/istio/proxyv2: istio-proxy
  ironbank/opensource/istio/install-cni: istio-install-cni
  # ztunnel is off by default (Istio ambient mode only).
  ironbank/opensource/istio/ztunnel: {cg: ztunnel, fallback: ironbank}
  ironbank/istio-ecosystem/authservice: authservice

  # --- Kiali ---
  ironbank/opensource/kiali/kiali: kiali
  ironbank/opensource/kiali/kiali-operator: kiali-operator

  # --- Policy ---
  ironbank/opensource/kyverno: kyverno
  ironbank/opensource/kyverno/kyverno/background-controller: kyverno-background-controller
  ironbank/opensource/kyverno/kyverno/cleanup-controller: kyverno-cleanup-controller
  ironbank/opensource/kyverno/kyverno/reports-controller: kyverno-reports-controller
  ironbank/opensource/kyverno/kyverno/readiness-checker: kyverno-readiness-checker
  ironbank/opensource/kyverno/kyvernocli: kyverno-cli
  ironbank/opensource/kyverno/kyvernopre: {cg: kyvernopre, fips: null}
  ironbank/opensource/kyverno/policy-reporter: kyverno-policy-reporter
  ironbank/opensource/kyverno/policy-reporter/kyverno-plugin: kyverno-policy-reporter-plugin-kyverno
  ironbank/nirmata/policy-reporter/policy-reporter-ui: kyverno-policy-reporter-ui
  ironbank/opensource/openpolicyagent/gatekeeper: gatekeeper

  # --- Logging / tracing / metrics ---
  ironbank/opensource/grafana/alloy: grafana-alloy
  ironbank/opensource/grafana/alloy-operator: {cg: grafana-alloy-operator, version: "0.9"}   # Chainguard tags the operator release (0.9.x), Iron Bank the app (1.11)
  ironbank/opensource/grafana/helm-chart-toolbox-kubectl: {cg: kubectl, tag: "1.34"}   # toolbox "1.0" is its own version, not kubectl's
  ironbank/opensource/grafana/loki: loki
  ironbank/bigbang/grafana/loki-canary: loki-canary
  ironbank/bigbang/grafana/loki-helm-test: {stays: "Big Bang test image (helm test only)"}
  ironbank/grafana/grafana-enterprise-logs: {stays: "Grafana Enterprise Logs is licensed; no Chainguard image"}
  ironbank/ironbank/opensource/grafana/enterprise-logs-provisioner: {stays: "Grafana Enterprise Logs is licensed; no Chainguard image"}
  ironbank/opensource/grafana/tempo: tempo
  ironbank/opensource/grafana/tempo-query: {stays: "no Chainguard tempo-query image"}
  ironbank/opensource/grafana/mimir: grafana-mimir
  ironbank/opensource/grafana/rollout-operator: grafana-rollout-operator
  ironbank/opensource/grafana/grafana-image-renderer: {cg: grafana-image-renderer, fips: null}
  # Big Bang builds Grafana with plugins baked in. scripts/bb-grafana-plugins.py
  # rebuilds it FROM the org's grafana / grafana-fips images using Iron Bank's own
  # plugin list; with BUILD_REGISTRY empty it stays on Iron Bank.
  ironbank/big-bang/grafana/grafana-plugins: {build: grafana-plugins}
  ironbank/kiwigrid/k8s-sidecar: k8s-sidecar
  ironbank/opensource/fluent/fluent-bit: fluent-bit
  ironbank/opensource/prometheus/prometheus: prometheus
  ironbank/opensource/prometheus/alertmanager: prometheus-alertmanager
  ironbank/opensource/prometheus/node-exporter: prometheus-node-exporter
  ironbank/opensource/prometheus/blackbox_exporter: prometheus-blackbox-exporter
  ironbank/opensource/prometheus/snmp_exporter: {cg: prometheus-snmp-exporter, fips: null}
  ironbank/opensource/prometheus/memcached-exporter: memcached-exporter
  ironbank/opensource/prometheus/jmx-exporter: {stays: "Chainguard has only jmx-exporter-iamguarded (Bitnami layout), not a drop-in"}
  ironbank/opensource/prometheus-operator/prometheus-operator: prometheus-operator
  ironbank/opensource/prometheus-operator/prometheus-config-reloader: prometheus-config-reloader
  ironbank/opensource/kubernetes/kube-state-metrics: kube-state-metrics
  ironbank/opensource/kubernetes-sigs/metrics-server: metrics-server
  ironbank/opensource/thanos/thanos: thanos
  ironbank/opensource/jimmidyson/configmap-reload: configmap-reload
  ironbank/opensource/memcached/memcached: memcached
  ironbank/bitnami/analytics/redis-exporter: prometheus-redis-exporter
  ironbank/opensource/elasticsearch-exporter: prometheus-elasticsearch-exporter
  ironbank/afdco/prometheus/mysqld_exporter: prometheus-mysqld-exporter

  # --- Elastic ---
  ironbank/elastic/eck-operator/eck-operator: eck-operator
  ironbank/elastic/elasticsearch/elasticsearch: elasticsearch
  ironbank/elastic/kibana/kibana: kibana

  # --- Security ---
  ironbank/neuvector/neuvector/controller: neuvector-controller
  ironbank/neuvector/neuvector/enforcer: neuvector-enforcer
  ironbank/neuvector/neuvector/manager: neuvector-manager
  ironbank/neuvector/neuvector/scanner: neuvector-scanner
  ironbank/neuvector/neuvector/prometheus-exporter: neuvector-prometheus-exporter
  ironbank/opensource/neuvector/registry-adapter: {stays: "no Chainguard neuvector-registry-adapter image"}
  ironbank/twistlock/console/console: {stays: "Prisma Cloud (Twistlock) is proprietary; vendor image only"}
  ironbank/twistlock/defender/defender: {stays: "Prisma Cloud (Twistlock) is proprietary; vendor image only"}
  ironbank/anchore/enterprise/enterprise: {stays: "Anchore Enterprise is proprietary; vendor image only"}
  ironbank/anchore/enterpriseui/enterpriseui: {stays: "Anchore Enterprise is proprietary; vendor image only"}
  ironbank/anchore/cli/cli: {stays: "Anchore CLI test image (bbtests only)"}
  ironbank/microfocus/fortify/ssc: {stays: "Fortify SSC is proprietary; vendor image only"}
  ironbank/sonarsource/sonarqube/sonarqube-community-build: {stays: "Chainguard sonarqube has only floating community/latest tags"}
  ironbank/hashicorp/vault: {stays: "org vault is 2.x; Big Bang pins 1.21 (major change)"}
  ironbank/hashicorp/vault/vault-k8s: vault-k8s
  ironbank/hashicorp/vault-csi-provider: vault-csi-provider
  ironbank/opensource/external-secrets/external-secrets: external-secrets

  # --- Certificates / identity ---
  ironbank/jetstack/cert-manager-controller: cert-manager-controller
  ironbank/jetstack/cert-manager-cainjector: cert-manager-cainjector
  ironbank/jetstack/cert-manager-webhook: cert-manager-webhook
  ironbank/opensource/jetstack/cert-manager-acmesolver: cert-manager-acmesolver
  ironbank/opensource/cleanstart/cert-manager-startupapicheck: cert-manager-startupapicheck
  ironbank/opensource/keycloak/keycloak: keycloak
  ironbank/opensource/dexidp/dex: dex

  # --- Apps ---
  ironbank/big-bang/argocd: argocd
  ironbank/opensource/headlamp-k8s/headlamp: headlamp
  ironbank/opensource/velero/velero: velero
  ironbank/opensource/velero/velero-plugin-for-aws: velero-plugin-for-aws
  ironbank/opensource/mattermost/mattermost: mattermost
  ironbank/opensource/mattermost/mattermost-operator: {stays: "no Chainguard mattermost-operator image"}
  ironbank/opensource/go-gitea/gitea: {stays: "org gitea is 28.x; Big Bang renovate pins 1.27 (test fixture)"}
  ironbank/opensource/apache/kafka-native: {cg: kafka-native, fips: null, fallback: ironbank}
  ironbank/container-hardening-tools/renovate/renovate: renovate
  ironbank/opensource/goharbor/harbor-core: harbor-core
  ironbank/opensource/goharbor/harbor-exporter: harbor-exporter
  ironbank/opensource/goharbor/harbor-jobservice: harbor-jobservice
  ironbank/opensource/goharbor/harbor-portal: harbor-portal
  ironbank/opensource/goharbor/harbor-registryctl: harbor-registryctl
  ironbank/opensource/goharbor/registry: harbor-registry
  ironbank/opensource/goharbor/trivy-adapter: harbor-trivy-adapter

  # MinIO (minio, mattermost's bundled minio, bucket-init jobs). Iron Bank pins
  # RELEASE.<date> tags, which have no MAJOR.MINOR line to match, so these take the
  # org's newest release (docs/images.md flags it).
  ironbank/opensource/minio/minio: {cg: minio, version: "*"}
  ironbank/opensource/minio/mc: {cg: minio-client, version: "*"}
  ironbank/opensource/minio/operator: {stays: "no Chainguard minio-operator image", until: minio-operator}
  ironbank/opensource/minio/operator-sidecar: {stays: "no Chainguard minio-operator-sidecar image", until: minio-operator-sidecar}

  # --- Shared building blocks ---
  ironbank/opensource/kubernetes/kubectl: kubectl
  ironbank/opensource/postgres/postgresql: postgres
  ironbank/opensource/redis/redis8-slim: redis
  ironbank/opensource/nginx/nginx: nginx
  ironbank/opensource/mysql/mysql8: mysql
  ironbank/afdco/docker/busybox: busybox
  # Big Bang's own job base image (bash + kubectl + yq + jq on UBI). scripts/bb-base.py
  # rebuilds it FROM the org's kubectl -dev images; with BUILD_REGISTRY empty it stays.
  ironbank/big-bang/base: {build: base}
  ironbank/redhat/ubi/ubi9: {stays: "Red Hat UBI base; GitLab and Fortify scripts expect UBI userland"}
  ironbank/redhat/ubi/ubi9-minimal: {stays: "Red Hat UBI base; GitLab and Fortify scripts expect UBI userland"}

  # --- Big Bang CI test images (bbtests, disabled by default) ---
  ironbank/big-bang/cypress: {stays: "Big Bang CI test image (bbtests); built on cypress/included, which Chainguard does not publish"}
  # scripts/bb-devops-tester.py rebuilds it FROM the org's kubectl -dev images.
  ironbank/big-bang/devops-tester: {build: devops-tester}
  ironbank/opensource/bats/bats: bats

  # --- GitLab (CNG images, versioned together) ---
  # Chainguard publishes the GitLab CNG images (the EE ones as commercial-gitlab-*-ee).
  # They move as one release: `group` keeps every image on Iron Bank until the org
  # has all of them on Big Bang's GitLab line (`strict`: never a newer minor), and
  # `fallback` keeps them there instead of failing while the org lacks them.
  # Chainguard tags every image with the GitLab release, so the images Iron Bank
  # tags with their own version (registry, shell, exporter) match on gitlab-base's
  # tag. mail_room and kubectl carry their own versions on Chainguard: newest.
  gitlab/gitlab-org/build/cng/certificates: &gitlab {group: gitlab, strict: true, fallback: ironbank, cg: gitlab-certificates}
  gitlab/gitlab-org/build/cng/cfssl-self-sign: {<<: *gitlab, cg: cfssl-self-sign}
  gitlab/gitlab-org/build/cng/gitaly: {<<: *gitlab, cg: gitaly}
  gitlab/gitlab-org/build/cng/gitlab-base: {<<: *gitlab, cg: gitlab-base}
  gitlab/gitlab-org/build/cng/gitlab-container-registry: {<<: *gitlab, cg: gitlab-container-registry, version_from: gitlab/gitlab-org/build/cng/gitlab-base}
  gitlab/gitlab-org/build/cng/gitlab-exporter: {<<: *gitlab, cg: gitlab-exporter, version_from: gitlab/gitlab-org/build/cng/gitlab-base}
  gitlab/gitlab-org/build/cng/gitlab-geo-logcursor: {<<: *gitlab, cg: commercial-gitlab-geo-logcursor-ee}
  gitlab/gitlab-org/build/cng/gitlab-kas: {<<: *gitlab, cg: gitlab-kas}
  gitlab/gitlab-org/build/cng/gitlab-mailroom: {<<: *gitlab, cg: gitlab-mailroom, version: "*"}
  gitlab/gitlab-org/build/cng/gitlab-pages: {<<: *gitlab, cg: gitlab-pages}
  gitlab/gitlab-org/build/cng/gitlab-shell: {<<: *gitlab, cg: gitlab-shell, version_from: gitlab/gitlab-org/build/cng/gitlab-base}
  gitlab/gitlab-org/build/cng/gitlab-sidekiq-ee: {<<: *gitlab, cg: commercial-gitlab-sidekiq-ee}
  gitlab/gitlab-org/build/cng/gitlab-toolbox-ee: {<<: *gitlab, cg: commercial-gitlab-toolbox-ee}
  gitlab/gitlab-org/build/cng/gitlab-webservice-ee: {<<: *gitlab, cg: commercial-gitlab-webservice-ee}
  gitlab/gitlab-org/build/cng/gitlab-workhorse-ee: {<<: *gitlab, cg: commercial-gitlab-workhorse-ee}
  gitlab/gitlab-org/build/cng/kubectl: {<<: *gitlab, cg: gitlab-kubectl, version: "*"}
  # No Chainguard equivalent; Iron Bank's images at the same GitLab release.
  gitlab/gitlab-org/build/cng/gitaly-init-cgroups: {stays: "no Chainguard image (Gitaly's cgroups init container)"}
  gitlab/gitlab-org/build/cng/gitlab-zoekt: {stays: "no Chainguard gitlab-zoekt image (code search, off by default)"}
  gitlab/gitlab-org/build/cng/gitlab-openbao: {stays: "GitLab's own OpenBao build; Chainguard's openbao is upstream's"}
  gitlab/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/model-gateway: {stays: "GitLab AI gateway; GitLab-built only"}
  gitlab/gitlab-org/gitlab-runner: gitlab-runner
  gitlab/gitlab-org/gitlab-runner/gitlab-runner-helper: gitlab-runner-helper

# Istio builds image names from `hub`, and Chainguard names its Istio images
# differently (istio-pilot, istio-proxy, ...). Istio uses `image` as-is when it
# contains a "/", so the overlay sets full references at these paths instead.
hubs:
  istiod:
    upstream.image: ironbank/opensource/istio/pilot
    upstream.global.proxy.image: ironbank/opensource/istio/proxyv2
  istio-cni:
    upstream.image: ironbank/opensource/istio/install-cni
  ztunnel:
    upstream.image: ironbank/opensource/istio/ztunnel

# Big Bang keys whose chart values sit below `values` (Big Bang key: sub-path).
value_roots:
  istioGateway: shared      # merged into every gateway release by Big Bang

# Images that a package template hardcodes as a default (no value in values.yaml),
# with the value path that overrides it. Applied to any release that renders one.
template_defaults:
  - image: ironbank/opensource/kubernetes/kubectl
    path: waitJob.image          # Big Bang gluon bb-wait job: dig "image" ... .Values.waitJob

# Hand-written values for packages whose image settings the generic rules can't
# express. Merged over the generated overrides. Tokens are resolved against live
# org tags: @repo:<name>, @tag:<name>:<version|*>, @ref:<name>:<version|*>,
# @registry (cgr.dev/<org>)
# (FIPS overlay: <name> becomes <name>-fips).
overrides:
  neuvector:
    # NeuVector builds "<registry>/<repository>:<tag>" from one chart-wide registry
    # and tag; Chainguard's scanner is versioned on its own (4.x, not Iron Bank's 6).
    upstream:
      registry: "@registry"
      tag: "@tag:neuvector-controller:5.6"
      controller: {image: {repository: "@repo:neuvector-controller"}}
      enforcer: {image: {repository: "@repo:neuvector-enforcer"}}
      manager: {image: {repository: "@repo:neuvector-manager"}}
      cve:
        scanner: {image: {registry: "", repository: "@repo:neuvector-scanner", tag: "@tag:neuvector-scanner:*"}}

# Images a package template hardcodes with no value to override (Big Bang key:
# Iron Bank repos). bb-convert writes a Flux postRenderers kustomize image rewrite.
post_renderers:
  addons.fortify:
    - ironbank/opensource/kubernetes/kubectl   # templates/keystore-job.yaml

# Value paths that hold Iron Bank strings but are not images to replace.
ignore:
  - {release: neuvector, path: upstream.controller.image}  # set by overrides.neuvector
  - {release: neuvector, path: upstream.enforcer.image}
  - {release: neuvector, path: upstream.manager.image}
  - {release: neuvector, path: upstream.cve.scanner.image}
  - {release: gatekeeper, path: upstream.image.crdRepository}  # upstream gatekeeper-crds hook, disabled by Big Bang
  - {release: kyverno-policies, path: policies}          # image patterns in policy parameters
  - {release: kyverno-policies, path: celPoliciesBeta}
  - {release: twistlock, path: console.trustedImages}    # Prisma trusted-registry rules
