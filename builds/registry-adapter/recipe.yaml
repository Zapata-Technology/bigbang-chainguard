# What builds/registry-adapter is (hand-written). scripts/bb-build.py registry-adapter reads it
# and its hook (scripts/buildhooks/registry_adapter.py) to generate build.yaml.
description: NeuVector's Harbor scanner adapter built from upstream's source (Go, cgo) FROM the org's images
hook: registry_adapter
image: bigbang-registry-adapter
header: |-
  Big Bang's NeuVector registry-adapter built from {{upstream}}'s source FROM
  the Chainguard org's images, following Iron Bank's recipe at `ironbank.commit`.
ironbank:
  image: ironbank/opensource/neuvector/registry-adapter
  project: opensource/neuvector/neuvector/registry-adapter
upstream: neuvector/registry-adapter
source: https://codeload.github.com/{{upstream}}/tar.gz/refs/tags/{{tag}}
# Modules raised past what upstream's go.mod pins. v0.2.11: x/net v0.58.0 has GO-2026-6612
# (Critical); go-jose v4.1.4 a fixable High.
go_bumps: [golang.org/x/net, github.com/go-jose/go-jose/v4]
# Iron Bank runs as UBI's `nobody`: its uid, numeric so runAsNonRoot can check it.
users: {nobody: "65534:65534"}
notes:
  - >-
    built from {{upstream}} {{tag}}'s source like Iron Bank's recipe (upstream's `make build`,
    cgo) with `adapter.go_get` raised; Chainguard has no registry-adapter image
  - >-
    image.fips.fips: toolchain = cgo with the org's go-fips; native = the org has no go-fips image, so
    Wolfi's Go builds it against Go's own FIPS 140-3 module (GOFIPS140, fips140=on by default)
build_args:
  ADAPTER_SOURCE: "{{adapter.source}}"
  ADAPTER_SHA256: "{{adapter.sha256}}"
  ADAPTER_VERSION: "{{adapter.tag}}"
  ADAPTER_GO_GET: "{{adapter.go_get}}"
  GO_PACKAGE: "{{image.$variant.go_package?}}"
  FIPS: "{{image.$variant.fips?}}"
  BINARY: "{{ironbank.binary}}"
  RUN_USER: "{{user}}"
