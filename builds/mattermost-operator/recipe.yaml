# What builds/mattermost-operator is (hand-written). scripts/bb-build.py mattermost-operator
# reads it and its hook (scripts/buildhooks/mattermost_operator.py) to generate build.yaml.
description: the Mattermost Operator built from upstream's source (Go) FROM the org's images
hook: mattermost_operator
image: bigbang-mattermost-operator
header: |-
  Big Bang's mattermost-operator built from {{upstream}}'s source FROM the
  Chainguard org's images, following Iron Bank's recipe at `ironbank.commit`.
ironbank:
  image: ironbank/opensource/mattermost/mattermost-operator
  project: opensource/mattermost/mattermost-operator
upstream: mattermost/mattermost-operator
source: https://codeload.github.com/{{upstream}}/tar.gz/refs/tags/{{tag}}
# Modules raised past what upstream's go.mod pins: x/net v0.58.0 has GO-2026-6612 (Critical).
go_bumps: [golang.org/x/net]
user: "65532:65532"   # distroless's nonroot:nonroot, numeric so runAsNonRoot can check it
notes:
  - >-
    built from {{upstream}} {{tag}}'s source (Chainguard has no mattermost-operator image)
    with `operator.go_get` raised; Iron Bank copies the binary out of upstream's image
  - >-
    image.fips.fips: toolchain = built like upstream's Dockerfile.fips (cgo, -tags=requirefips)
    with the org's go-fips; native = the org has no go-fips image, so Wolfi's Go builds it against
    Go's own FIPS 140-3 module (GOFIPS140, fips140=on by default)
build_args:
  OPERATOR_SOURCE: "{{operator.source}}"
  OPERATOR_SHA256: "{{operator.sha256}}"
  OPERATOR_COMMIT: "{{operator.commit}}"
  OPERATOR_BUILD_TIME: "{{operator.build_time}}"
  OPERATOR_GO_GET: "{{operator.go_get}}"
  GO_PACKAGE: "{{image.$variant.go_package?}}"
  FIPS: "{{image.$variant.fips?}}"
  BINARY: "{{ironbank.binary}}"
  RUN_USER: "{{user}}"
